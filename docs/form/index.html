    add('ui.answer.err.badDue', { value: String(input.due) });
  }
  const given = CONTENT_FIELDS.filter((field) => input[field] !== undefined);
  if (input.status === 'missing') {
    if (given.length > 0) add('ui.answer.err.missingHasContent');
  } else if (input.status === 'tbd') {
    for (const field of given) {
      if (field !== 'note' && field !== 'text') add('ui.answer.err.tbdContent', { field });
      else if (typeof input[field] !== 'string') add('ui.answer.err.badText', { field });
    }
  } else {
    const allowed = FIELDS_BY_TYPE[question.type] ?? ['text'];
    for (const field of given) {
      if (!allowed.includes(field)) add('ui.answer.err.wrongField', { field, type: question.type });
    }
    contentProblems(question, input, add);
  }
  if (inputStrings(input).some(hasHiddenCharacters)) add('ui.answer.err.controlChars', { where: question.id });
  if (problems.length === 0 && exceedsTextLimits(entryFromInput(question, input).body)) {
    add('ui.answer.err.tooLong', { lineLimit: MAX_LINE_CHARS, bodyLimit: '200 KB' });
  }
  return problems;
}

// Turns checked input into the shape parseFile gives for an answer: { status, owner, due, body, value }.
function entryFromInput(question, input) {
  const owner = toToken(input.owner ?? '');
  const due = input.due ?? '';
  if (input.status === 'complete' || input.status === 'partial') {
    const body = bodyFromInput(question, input);
    return { status: input.status, owner, due, body, value: parseBody(question, body) };
  }
  if (input.status === 'tbd') {
    const parts = [input.note, input.text].filter((part) => typeof part === 'string' && part.trim() !== '');
    return { status: 'tbd', owner, due, body: encodeMarkup(normalizeText(parts.join('\n'))), value: emptyValue(question) };
  }
  return { status: 'missing', owner, due, body: '', value: emptyValue(question) };
}

// ---- parse.mjs ----
// Parsing answer files and the assets table (FORMAT.md sections 4 and 5).
// Tolerant on input (CRLF, any bullet style, trailing spaces). This file must stay pure.


const REQUIRED_FRONT_MATTER = ['schema', 'file', 'language'];
const HEADING_LINE = /^ {0,3}#{1,3}(?:\s|$)/;
const QUESTION_HEADING_LINE = /^ {0,3}###(?:\s|$)/;
const FRONT_MATTER_LINE = /^([A-Za-z][\w-]*):\s*([\s\S]*)$/;
const MAX_PARSE_FLAGS = 100;
const EXCERPT_CHARS = 60;

// A line this long is not text a person wrote; reading it could take unbounded time.
function checkLineLengths(lines) {
  const index = lines.findIndex((line) => line.length > MAX_LINE_CHARS);
  if (index !== -1) throw new PackError('ui.check.err.lineTooLong', { line: index + 1, limit: MAX_LINE_CHARS });
}

// A damaged file can hold thousands of problems; the first ones are enough to show.
function pushFlag(flags, flag) {
  if (flags.length < MAX_PARSE_FLAGS) flags.push(flag);
}

function unquoteFrontMatter(value) {
  if (value.length >= 2 && value.startsWith('"') && value.endsWith('"')) {
    return value.slice(1, -1).replace(/\\(["\\])/g, '$1');
  }
  return value;
}

// Returns { frontMatter, start }: frontMatter is null when there is no closed block at the top.
function readFrontMatter(lines) {
  const first = lines.findIndex((line) => line.trim() !== '');
  if (first === -1 || lines[first].trim() !== '---') return { frontMatter: null, start: 0 };
  const end = lines.findIndex((line, index) => index > first && line.trim() === '---');
  if (end === -1) return { frontMatter: null, start: 0 };
  const frontMatter = {};
  for (const line of lines.slice(first + 1, end)) {
    const match = FRONT_MATTER_LINE.exec(line);
    if (match) frontMatter[match[1]] = unquoteFrontMatter(match[2].trim());
  }
  return { frontMatter, start: end + 1 };
}

// The required front matter keys that are missing or have an unusable value.
function badFrontMatterKeys(frontMatter, schema) {
  if (!frontMatter) return [...REQUIRED_FRONT_MATTER];
  return REQUIRED_FRONT_MATTER.filter((key) => {
    const value = frontMatter[key];
    if (!value) return true;
    if (key === 'file') return !schema.files.some((file) => file.id === value);
    if (key === 'language') return !schema.languages.includes(value);
    return false;
  });
}

// <!-- q:<id> status:<status> [owner:<owner>] [due:<date>] -->, or null for any other line.
function parseMarker(line) {
  const trimmed = line.trim();
  if (!trimmed.startsWith('<!--') || !trimmed.endsWith('-->')) return null;
  const inner = trimmed.slice(4, -3).trim();
  if (!inner.startsWith('q:') || inner.includes('>')) return null;
  const [id, ...words] = inner.slice(2).split(/\s+/);
  if (id === '') return null;
  const tokens = {};
  for (const word of words) {
    const colon = word.indexOf(':');
    if (colon > 0) tokens[word.slice(0, colon)] = word.slice(colon + 1);
  }
  return { id, status: tokens.status ?? '', owner: tokens.owner ?? '', due: tokens.due ?? '' };
}

// Opens an answer for a marker, or reports why it is ignored. Returns the open answer or null.
function openAnswer(marker, state) {
  const question = findQuestion(state.schema, marker.id);
  if (!question) {
    pushFlag(state.flags, { id: 'marker.unknownQuestion', severity: 'warn', params: { id: marker.id } });
    return null;
  }
  if (Object.hasOwn(state.answers, marker.id)) {
    if (!state.duplicated.has(marker.id)) {
      state.duplicated.add(marker.id);
      pushFlag(state.flags, { id: 'marker.duplicate', severity: 'warn', qid: marker.id, params: { qid: marker.id } });
    }
    return null;
  }
  const entry = { status: marker.status, owner: marker.owner, due: marker.due, body: '', value: null };
  state.answers[marker.id] = entry;
  return { entry, question, lines: [] };
}

// Fills body and value once all lines are known. An unreadable status is reported and replaced
// by partial (there is text) or missing (there is none).
function closeAnswer(open, flags) {
  const { entry, question } = open;
  entry.body = normalizeText(open.lines.join('\n'));
  if (entry.body.length > MAX_BODY_CHARS) {
    throw new PackError('ui.check.err.bodyTooLarge', { id: question.id, limit: '200 KB' });
  }
  if (hasHiddenCharacters(entry.body)) {
    pushFlag(flags, { id: 'text.hiddenCharacters', severity: 'warn', qid: question.id, params: { qid: question.id } });
  }
  if (!ANSWER_STATUSES.includes(entry.status)) {
    pushFlag(flags, { id: 'marker.badStatus', severity: 'warn', qid: question.id, params: { qid: question.id, status: entry.status } });
    entry.status = entry.body === '' ? 'missing' : 'partial';
  }
  entry.value = entry.status === 'tbd' || entry.status === 'missing' ? emptyValue(question) : parseBody(question, entry.body);
}

// True for a "###" heading that no marker follows: the renderer never writes one, so a person did.
function isStrayQuestionHeading(lines, index) {
  if (!QUESTION_HEADING_LINE.test(lines[index])) return false;
  let next = index + 1;
  while (next < lines.length && lines[next].trim() === '') next += 1;
  return next >= lines.length || parseMarker(lines[next]) === null;
}

function excerptOf(line) {
  const text = oneLine(line);
  const chars = Array.from(text);
  return chars.length > EXCERPT_CHARS ? `${chars.slice(0, EXCERPT_CHARS).join('')}...` : text;
}

// -> { frontMatter, answers: { [id]: { status, owner, due, body, value } }, flags }
// Flags are { id, severity, qid?, params }. The caller adds the file. Throws PackError for a
// line or an answer that is too long to read.
function parseFile(text, schema) {
  const lines = splitLines(text);
  checkLineLengths(lines);
  const { frontMatter, start } = readFrontMatter(lines);
  const flags = [];
  const badKeys = badFrontMatterKeys(frontMatter, schema);
  if (badKeys.length > 0) pushFlag(flags, { id: 'file.badFrontMatter', severity: 'warn', params: { keys: badKeys.join(', ') } });

  const state = { schema, answers: {}, flags, duplicated: new Set() };
  const opened = [];
  const stray = { count: 0, line: 0, excerpt: '' };
  const noteStray = (index) => {
    stray.count += 1;
    if (stray.count === 1) Object.assign(stray, { line: index + 1, excerpt: excerptOf(lines[index]) });
  };
  let current = null;
  let ignoring = false;
  let hiddenOutsideAnswers = lines.slice(0, start).some(hasHiddenCharacters);
  for (let index = start; index < lines.length; index += 1) {
    const line = lines[index];
    const isHeading = HEADING_LINE.test(line);
    const marker = isHeading ? null : parseMarker(line);
    if (isHeading) {
      if (isStrayQuestionHeading(lines, index)) noteStray(index);
      current = null;
      ignoring = false;
    } else if (marker) {
      current = openAnswer(marker, state);
      ignoring = current === null;
      if (current) opened.push(current);
    } else if (current) {
      current.lines.push(line);
    } else if (!ignoring && line.trim() !== '') {
      noteStray(index);
    }
    if (!current || isHeading || marker) hiddenOutsideAnswers = hiddenOutsideAnswers || hasHiddenCharacters(line);
  }
  for (const open of opened) closeAnswer(open, flags);
  if (hiddenOutsideAnswers) pushFlag(flags, { id: 'text.hiddenCharacters', severity: 'warn', params: {} });
  if (stray.count > 0) {
    pushFlag(flags, { id: 'file.strayText', severity: 'warn', params: { line: stray.line, excerpt: stray.excerpt, count: stray.count } });
  }
  return { frontMatter, answers: state.answers, flags };
}

// Rows of the assets table: [{ file, what, owner, rights, restrictions }].
// The first table row is the header and the second the separator; their text is ignored.
// A table with more than MAX_ASSET_ROWS rows is refused with a PackError.
function parseAssets(text) {
  const lines = normalizeNewlines(text).split('\n');
  checkLineLengths(lines);
  const tableLines = lines.map((line) => line.trim()).filter((line) => line.startsWith('|'));
  if (tableLines.length - 2 > MAX_ASSET_ROWS) throw new PackError('ui.check.err.tooManyRows', { limit: MAX_ASSET_ROWS });
  const rows = [];
  for (const line of tableLines.slice(2)) {
    const inner = line.replace(/^\|/, '').replace(/(?<!\\)\|$/, '');
    const [fileCell = '', ...cells] = splitPipes(inner);
    const [what = '', owner = '', rights = '', restrictions = ''] = cells.map((cell) => decodeMarkup(joinLines(cell)));
    // The file column is read exactly: only the padding around the cell is removed.
    const file = decodeMarkup(trimSpaces(fileCell));
    if (file !== '') rows.push({ file, what, owner, rights, restrictions });
  }
  return rows;
}

// ---- render.mjs ----
// Rendering answer files, the assets table and the open-questions file (FORMAT.md sections 4, 5, 8).
// Output is canonical: LF line endings, one blank line between blocks. This file must stay pure.


const GENERATED_START = '<!-- generated:start -->';
const GENERATED_END = '<!-- generated:end -->';

// The text for a key, or the fallback while the text files do not define it.
function textOr(i18n, key, fallback = '') {
  return i18n.has(key) ? i18n.t(key) : fallback;
}

function questionLabel(i18n, questionId) {
  return oneLine(textOr(i18n, `q.${questionId}.label`, questionId));
}

// Headings of level 1 to 3 inside user text would end the answer, so they become level 4. A line
// that looks like a marker comment is defused.
function protectBody(text) {
  return normalizeNewlines(text)
    .split('\n')
    .map((line) => {
      const heading = /^( {0,3})#{1,3}(?=\s|$)/.exec(line);
      if (heading) return `${heading[1]}####${line.slice(heading[0].length)}`;
      if (/^\s*<!--/.test(line)) return line.replace('<!--', '&lt;!--');
      return line;
    })
    .join('\n');
}

function quoteFrontMatter(value) {
  const text = defuseMarkup(joinLines(value));
  return `"${text.replace(/[\\"]/g, (char) => `\\${char}`)}"`;
}

function frontMatterBlock(schema, fileId, meta) {
  const lines = ['---', `schema: ${schema.schema}`, `file: ${fileId}`, `language: ${meta.language}`];
  if (meta.respondent) lines.push(`respondent: ${quoteFrontMatter(meta.respondent)}`);
  lines.push(`updated: ${meta.updated}`, '---');
  return lines.join('\n');
}

function questionBlock(question, i18n, entry) {
  const status = entry && ANSWER_STATUSES.includes(entry.status) ? entry.status : 'missing';
  const tokens = [`q:${question.id}`, `status:${status}`];
  if (entry && entry.owner) tokens.push(`owner:${toToken(entry.owner)}`);
  if (entry && entry.due) tokens.push(`due:${entry.due}`);
  const lines = [`### ${questionLabel(i18n, question.id)}`, `<!-- ${tokens.join(' ')} -->`];
  const body = entry ? protectBody(canonicalBody(question, entry)) : '';
  if (body !== '') lines.push(body);
  return lines.join('\n');
}

// One answer file. answersById holds every answer of the pack (parseFile shape), because showIf
// can refer to a question in another file. meta: { language, respondent?, updated }.
function renderFile(schema, i18n, fileId, answersById, meta) {
  const file = schema.files.find((entry) => entry.id === fileId);
  if (!file) throw new Error(`Unknown file id: ${fileId}`);
  const blocks = [frontMatterBlock(schema, fileId, meta)];
  blocks.push(`# ${oneLine(textOr(i18n, `file.${fileId}.title`, fileId))}`);
  for (const moduleId of file.modules) {
    const moduleEntry = schema.modules.find((entry) => entry.id === moduleId);
    if (!moduleEntry) continue;
    blocks.push(`## ${oneLine(textOr(i18n, `module.${moduleId}.title`, moduleId))}`);
    for (const item of moduleEntry.questions) {
      const question = { ...item, module: moduleEntry.id, file: moduleEntry.file };
      if (effectiveLevel(question, answersById, schema) === 'skipped') continue;
      blocks.push(questionBlock(question, i18n, answersById[question.id]));
    }
  }
  return `${blocks.join('\n\n')}\n`;
}

// A cell in a markdown table: one line, no markup, pipes escaped, and cut at `limit` characters.
// Stored text is kept as it is, with its invisible joiners and special spaces. Only control
// characters and the hidden characters of util.mjs are written as <U+XXXX>, which no answer
// can contain, so that a damaged pack cannot put them into a generated file.
function tableCell(value, limit = Infinity) {
  return escapePipes(encodeMarkup(showHiddenCharacters(truncateText(joinLines(value), limit))));
}

function tableLine(cells, limit) {
  return `| ${cells.map((cell) => tableCell(cell, limit)).join(' | ')} |`;
}

// The file column of the assets table holds the name exactly: only a pipe and markup are escaped.
function fileCell(value) {
  return escapePipes(encodeMarkup(showHiddenCharacters(String(value ?? ''))));
}

// rows: [{ file, what, owner, rights, restrictions }]
function renderAssets(rows, i18n) {
  const header = [
    i18n.t('ui.assets.col.file'),
    i18n.t('ui.assets.col.what'),
    i18n.t('ui.assets.col.owner'),
    i18n.t('ui.assets.col.rights'),
    i18n.t('ui.assets.col.restrictions'),
  ];
  const lines = [
    `# ${i18n.t('ui.assets.title')}`,
    '',
    i18n.t('ui.assets.intro'),
    '',
    tableLine(header),
    '|---|---|---|---|---|',
    ...rows.map((row) => `| ${fileCell(row.file)} | ${[row.what, row.owner, row.rights, row.restrictions].map((cell) => tableCell(cell)).join(' | ')} |`),
  ];
  return `${lines.join('\n')}\n`;
}

// The message for a flag, in the language of the dictionary. Question flags get {label}; a file
// flag gets its path as {label}. The text is not made safe for printing: print it through
// sanitizeForTerminal.
function describeFlag(flag, i18n) {
  const params = { ...flag.params };
  const questionId = flag.qid ?? params.qid;
  if (questionId) {
    params.qid = questionId;
    params.label = questionLabel(i18n, questionId);
  } else if (params.label === undefined && params.path !== undefined) {
    params.label = params.path;
  }
  return i18n.t(`flag.${flag.id}`, params);
}

// The rows of one level: deferred questions in scope of the depth, and, for the levels that are
// always asked, missing questions too.
function openRows(report, level, includeMissing) {
  return Object.entries(report.questions).filter(([, entry]) => {
    if (entry.level !== level) return false;
    if (entry.status === 'tbd') return entry.inScope !== false;
    return includeMissing && entry.status === 'missing';
  });
}

function openTable(rows, i18n) {
  const header = [
    i18n.t('ui.openq.col.question'),
    i18n.t('ui.openq.col.status'),
    i18n.t('ui.openq.col.owner'),
    i18n.t('ui.openq.col.due'),
    i18n.t('ui.openq.col.note'),
  ];
  const body = rows.map(([id, entry]) =>
    tableLine([questionLabel(i18n, id), textOr(i18n, `status.${entry.status}`, entry.status), entry.owner, entry.due, decodeMarkup(entry.note)], MAX_CELL_CHARS),
  );
  return [tableLine(header), '|---|---|---|---|---|', ...body];
}

// The findings as bullets: at most MAX_LISTED_ITEMS, each cut short, then a line with the rest.
function flagBullets(report, i18n) {
  const shown = report.flags.filter((flag) => flag.severity === 'block' || flag.severity === 'warn');
  const ordered = [...shown.filter((flag) => flag.severity === 'block'), ...shown.filter((flag) => flag.severity === 'warn')];
  const bullets = ordered.slice(0, MAX_LISTED_ITEMS).map((flag) => {
    const severity = flag.severity === 'block' ? i18n.t('ui.openq.sev.block') : i18n.t('ui.openq.sev.warn');
    return `- ${severity}: ${encodeMarkup(showHiddenCharacters(truncateText(joinLines(describeFlag(flag, i18n)), MAX_CELL_CHARS)))}`;
  });
  if (ordered.length > MAX_LISTED_ITEMS) bullets.push(`- ${i18n.t('ui.openq.more', { count: ordered.length - MAX_LISTED_ITEMS })}`);
  return bullets;
}

function generatedBlock(report, i18n) {
  const lines = [GENERATED_START, `## ${i18n.t('ui.openq.heading')}`, '', i18n.t('ui.openq.intro')];
  // The group names are the level names from the text files when they exist.
  const groups = [
    { level: 'gate1', includeMissing: true, heading: textOr(i18n, 'level.gate1.short', textOr(i18n, 'level.gate1', i18n.t('ui.openq.group.gate1'))) },
    { level: 'recommended', includeMissing: true, heading: textOr(i18n, 'level.recommended', i18n.t('ui.openq.group.recommended')) },
    { level: 'optional', includeMissing: false, heading: textOr(i18n, 'level.optional', i18n.t('ui.openq.group.optional')) },
  ];
  for (const { level, includeMissing, heading } of groups) {
    const rows = openRows(report, level, includeMissing);
    if (rows.length === 0 && level === 'optional') continue;
    lines.push('', `### ${heading}`, '');
    lines.push(...(rows.length === 0 ? [i18n.t('ui.openq.none')] : openTable(rows, i18n)));
  }
  const bullets = flagBullets(report, i18n);
  lines.push('', `### ${i18n.t('ui.openq.flagsHeading')}`, '');
  lines.push(...(bullets.length === 0 ? [i18n.t('ui.openq.noFlags')] : bullets));
  lines.push(GENERATED_END);
  return lines.join('\n');
}

// The open-questions file. Everything between the generated markers is replaced; text outside
// them is kept. Without a pair of markers the block is added at the end (or the file is created).
function renderOpenQuestions(report, i18n, existingText) {
  const block = generatedBlock(report, i18n);
  const existing = existingText === undefined || existingText === null ? '' : normalizeNewlines(existingText);
  const start = existing.indexOf(GENERATED_START);
  const end = start === -1 ? -1 : existing.indexOf(GENERATED_END, start + GENERATED_START.length);
  if (start !== -1 && end !== -1) {
    const merged = existing.slice(0, start) + block + existing.slice(end + GENERATED_END.length);
    return merged.endsWith('\n') ? merged : `${merged}\n`;
  }
  if (existing.trim() === '') return `# ${i18n.t('ui.openq.title')}\n\n${block}\n`;
  return `${existing.trimEnd()}\n\n${block}\n`;
}

// ---- validate.mjs ----
// Validation, scoring, the must-answer check and "what to ask next" (FORMAT.md sections 9, 11 and 14).
// Works on plain data, so the static form can use it too. This file must stay pure.


// The design inputs that must be answered before the design inputs count as sufficient.
const DESIGN_INPUT_IDS = ['E.like', 'E.dislike', 'E.feel'];

const URL_CHECKED_IDS = ['E.like', 'E.dislike', 'E.competitors', 'A.existing-site'];
const ALWAYS_WARN_FLAGS = ['rule.badChoice', 'rule.dateInPast'];
const MAX_URL_FLAGS = 10;
const UNKNOWN_RIGHTS = ['unknown', 'ukendt'];

// True when the rights column says that the rights are not known (allowed, but listed).
function isUnknownRights(rights) {
  return UNKNOWN_RIGHTS.includes(String(rights ?? '').trim().toLowerCase());
}
const LEADING_PUNCTUATION = '(<[';
const TRAILING_PUNCTUATION = ')>],;.';
const URL_START = /^(?:[a-z][a-z0-9+.-]*:\/\/|www\.)\S+$/i;
const DOMAIN_LIKE = /^[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)+(?:[/:?#]\S*)?$/i;

function newFlag(id, severity, params, where = {}) {
  const flag = { id, severity };
  if (where.qid) flag.qid = where.qid;
  if (where.file) flag.file = where.file;
  flag.params = params;
  return flag;
}

// Removes brackets and punctuation around a word, looking from each end (no pattern that backtracks).
function trimPunctuation(token) {
  let start = 0;
  let end = token.length;
  while (start < end && LEADING_PUNCTUATION.includes(token[start])) start += 1;
  while (end > start && TRAILING_PUNCTUATION.includes(token[end - 1])) end -= 1;
  return token.slice(start, end);
}

function looksLikeAddress(token) {
  const lower = token.toLowerCase();
  return lower.startsWith('http') || lower.startsWith('www.') || lower.includes('://');
}

// 'ok' when the entry holds a web address, 'broken' when a word looks like one but is not,
// 'text' for pasted text.
function classifyLink(text) {
  const words = text.split(/\s+/).map(trimPunctuation).filter(Boolean);
  if (words.some((word) => URL_START.test(word) || DOMAIN_LIKE.test(word))) return 'ok';
  return words.some(looksLikeAddress) ? 'broken' : 'text';
}

// Pasted text is allowed in link lists (information); a broken address is a warning.
function linkProblems(items) {
  const problems = [];
  for (const item of items) {
    const kind = classifyLink(item.text);
    if (kind === 'ok') continue;
    problems.push({ id: 'rule.notUrl', severity: kind === 'broken' ? 'warn' : 'info', params: { item: item.text } });
    if (problems.length === MAX_URL_FLAGS) break;
  }
  return problems;
}

// All answers of the pack by question id. When an id appears twice, the first one wins and the
// duplicate is listed in `duplicates` (files are read in schema order).
function gatherAnswers(packData, schema) {
  const answers = Object.create(null);
  const duplicates = [];
  for (const file of schema.files) {
    const parsed = packData.files && packData.files[file.id];
    if (!parsed || parsed.exists === false) continue;
    for (const [id, entry] of Object.entries(parsed.answers ?? {})) {
      if (Object.hasOwn(answers, id)) duplicates.push({ qid: id, file: file.id });
      else answers[id] = entry;
    }
  }
  return { answers, duplicates };
}

function collectAnswers(packData, schema) {
  return gatherAnswers(packData, schema).answers;
}

// ---------------------------------------------------------------------------------------------
// Judging one answer

// What an answer contains, by type:
//   filled  there is content;  unmet  rules a `complete` answer fails (and is then partial);
//   always  problems reported for complete and partial answers;  invalid  content exists but is unusable.
function inspectText(question, value) {
  const length = textLength(value.text);
  const min = question.rules && question.rules.minChars;
  const unmet = min && length < min ? [{ id: 'rule.minChars', params: { min, actual: length } }] : [];
  return { filled: length > 0, unmet, always: [], invalid: false };
}

function inspectList(question, value) {
  const min = question.rules && question.rules.minItems;
  const unmet = min && value.items.length < min ? [{ id: 'rule.minItems', params: { min, actual: value.items.length } }] : [];
  const always = URL_CHECKED_IDS.includes(question.id) ? linkProblems(value.items) : [];
  return { filled: value.items.length > 0, unmet, always, invalid: false };
}

function inspectChoice(question, value) {
  const allowed = question.choices ?? [];
  const single = question.type === 'choice';
  const usable = (id, index) => allowed.includes(id) && !(single && index > 0);
  const always = value.choice
    .map((id, index) => (usable(id, index) ? null : { id: 'rule.badChoice', params: { choice: id } }))
    .filter(Boolean);
  const unmet = value.choice.length === 0 ? [{ id: 'rule.noChoice', params: {} }] : [];
  const invalid = value.choice.length > 0 && !value.choice.some(usable);
  return { filled: value.choice.length > 0, unmet, always, invalid };
}

function inspectDate(value, today) {
  if (value.date === '') return { filled: false, unmet: [{ id: 'rule.badDate', params: { value: '' } }], always: [], invalid: false };
  if (!isValidDate(value.date)) {
    return { filled: true, unmet: [], always: [{ id: 'rule.badDate', params: { value: value.date } }], invalid: true };
  }
  const always = value.date < today ? [{ id: 'rule.dateInPast', params: { date: value.date } }] : [];
  return { filled: true, unmet: [], always, invalid: false };
}

function valueOf(question, entry) {
  return entry.value ?? parseBody(question, entry.body ?? '');
}

function inspectAnswer(question, entry, today) {
  const value = valueOf(question, entry);
  if (question.type === 'date') return inspectDate(value, today);
  if (question.type === 'list' || question.type === 'urllist' || question.type === 'files') return inspectList(question, value);
  if (question.type === 'choice' || question.type === 'multichoice') return inspectChoice(question, value);
  return inspectText(question, value);
}

function tbdProblems(entry) {
  const problems = [];
  if (!entry.owner) problems.push({ id: 'tbd.noOwner', severity: 'warn', params: {} });
  if (!entry.due) problems.push({ id: 'tbd.noDue', severity: 'info', params: {} });
  return problems;
}

// -> { status, declared, owner, due, note, problems: [{ id, severity, params }] }
function judgeAnswer(question, entry, level, today) {
  const declared = entry ? entry.status : 'missing';
  const result = { status: declared, declared, owner: entry ? entry.owner : '', due: entry ? entry.due : '', note: '', problems: [] };
  if (declared === 'missing') return result;
  if (declared === 'tbd') {
    result.note = joinLines(entry.body);
    result.problems = tbdProblems(entry);
    return result;
  }
  const severity = level === 'gate1' ? 'block' : 'warn';
  const found = inspectAnswer(question, entry, today);
  const withSeverity = (problem) => ({ ...problem, severity: problem.severity ?? (ALWAYS_WARN_FLAGS.includes(problem.id) ? 'warn' : severity) });
  const reported = declared === 'complete' ? [...found.unmet, ...found.always] : found.always;
  result.problems = (found.filled || declared === 'complete') ? reported.map(withSeverity) : [];
  if (!found.filled) result.status = 'missing';
  else if (declared === 'complete' && (found.invalid || found.unmet.length > 0)) result.status = 'partial';
  return result;
}

// ---------------------------------------------------------------------------------------------
// Pack level checks

function fileProblems(packData, schema, language) {
  const flags = [];
  for (const file of schema.files) {
    const parsed = packData.files && packData.files[file.id];
    const where = { file: file.id };
    if (!parsed || parsed.exists === false) {
      flags.push(newFlag('file.missing', 'info', { file: file.id, path: file.path }, where));
      continue;
    }
    for (const flag of parsed.flags ?? []) {
      flags.push({ ...flag, file: file.id, params: { file: file.id, path: file.path, ...flag.params } });
    }
    const found = parsed.frontMatter && parsed.frontMatter.language;
    if (language && found && schema.languages.includes(found) && found !== language) {
      flags.push(newFlag('file.languageMismatch', 'warn', { file: file.id, path: file.path, found, expected: language }, where));
    }
  }
  return flags;
}

// The name in the table row without the folder, exactly as written (backslashes are kept).
function storedAssetName(file) {
  return file.replace(/^(?:docs\/)?assets\//, '');
}

// The name of an asset inside docs/assets, from the form used in the table ("assets/logo.svg"),
// also when it is written with backslashes or a leading ./.
function assetName(file) {
  return file.replace(/\\/g, '/').replace(/^\.\//, '').replace(/^(?:docs\/)?assets\//, '');
}

// Adds a flag for each row that passes the test, but no more than MAX_FLAGS_PER_KIND of one kind,
// so a table with thousands of rows cannot fill the report.
function addRowFlags(flags, rows, id, test, paramsOf = (row) => ({ file: row.file })) {
  let added = 0;
  for (const row of rows) {
    if (added === MAX_FLAGS_PER_KIND) return;
    if (test(row)) {
      flags.push(newFlag(id, 'warn', paramsOf(row)));
      added += 1;
    }
  }
}

function hasHiddenText(row) {
  return [row.what, row.owner, row.rights, row.restrictions].some(hasHiddenCharacters);
}

function assetProblems(assets) {
  const rows = (assets && assets.rows) ?? [];
  const present = new Set((assets && assets.present) ?? []);
  const listed = new Set(rows.map((row) => assetName(row.file)));
  const flags = [];
  let unlisted = 0;
  let badNames = 0;
  for (const name of present) {
    if (!isStorableAssetName(name)) {
      if (badNames < MAX_FLAGS_PER_KIND) flags.push(newFlag('assets.badName', 'warn', { file: describeAssetName(name) }));
      badNames += 1;
    } else if (!listed.has(name) && unlisted < MAX_FLAGS_PER_KIND) {
      flags.push(newFlag('assets.unlisted', 'warn', { file: name }));
      unlisted += 1;
    }
  }
  const nameParams = (row) => ({ file: describeAssetName(row.file) });
  addRowFlags(flags, rows, 'assets.badName', (row) => !isStorableAssetName(storedAssetName(row.file)), nameParams);
  addRowFlags(flags, rows, 'assets.missingFile', (row) => !present.has(assetName(row.file)));
  addRowFlags(flags, rows, 'assets.noRights', (row) => row.rights.trim() === '');
  addRowFlags(flags, rows, 'assets.rightsUnknown', (row) => isUnknownRights(row.rights));
  addRowFlags(flags, rows, 'text.hiddenCharacters', hasHiddenText, (row) => ({ label: describeAssetName(row.file) }));
  return flags;
}

function crossProblems(packData, schema, answers, statuses) {
  const flags = [];
  const picked = (id) => selectedChoices(schema, answers, id);
  const languages = picked('D.languages');
  const features = picked('G.features');
  if (languages.length >= 2 && features.length > 0 && !features.includes('multilingual')) {
    flags.push(newFlag('cross.languagesVsMultilingual', 'warn', { languages: languages.join(', ') }));
  }
  const existingSite = answers['A.existing-site'];
  const siteAnswered = existingSite && (existingSite.status === 'complete' || existingSite.status === 'partial');
  const siteItems = siteAnswered ? valueOf(findQuestion(schema, 'A.existing-site'), existingSite).items : [];
  if (picked('A.project-kind').includes('redesign') && siteItems.length === 0) {
    flags.push(newFlag('cross.redesignNoSite', 'warn', {}));
  }
  const present = (packData.assets && packData.assets.present) ?? [];
  if (picked('B.assets-status').some((choice) => choice === 'guidelines' || choice === 'partial') && present.length === 0) {
    flags.push(newFlag('cross.assetsClaimedMissing', 'warn', {}));
  }
  const done = DESIGN_INPUT_IDS.filter((id) => statuses[id] === 'complete').length;
  if (done < DESIGN_INPUT_IDS.length) {
    flags.push(newFlag('cross.designInputsThin', 'info', { count: done, min: DESIGN_INPUT_IDS.length }));
  }
  return flags;
}

// ---------------------------------------------------------------------------------------------
// Scoring

function emptyBucket() {
  return { total: 0, weight: 0, earned: 0 };
}

function bucketScore(bucket) {
  return { score: bucket.weight === 0 ? 0 : Math.round((bucket.earned / bucket.weight) * 10000) / 10000, total: bucket.total };
}

function summarize(schema, records, depth) {
  const counts = { complete: 0, partial: 0, tbd: 0, missing: 0, skipped: 0 };
  const overall = emptyBucket();
  const byFile = Object.fromEntries(schema.files.map((file) => [file.id, emptyBucket()]));
  const byModule = Object.fromEntries(schema.moduleOrder.map((id) => [id, emptyBucket()]));
  const byArea = Object.fromEntries(schema.areas.map((area) => [area, emptyBucket()]));
  for (const record of records) {
    if (record.level === 'skipped') {
      counts.skipped += 1;
      continue;
    }
    if (!inDepth(record.level, depth, schema)) continue;
    counts[record.status] += 1;
    const weight = schema.weights[record.level];
    const earned = weight * (schema.statusScores[record.status] ?? 0);
    for (const bucket of [overall, byFile[record.file], byModule[record.module], byArea[record.area]]) {
      if (!bucket) continue;
      bucket.total += 1;
      bucket.weight += weight;
      bucket.earned += earned;
    }
  }
  const scored = (buckets) => Object.fromEntries(Object.entries(buckets).map(([key, bucket]) => [key, bucketScore(bucket)]));
  return {
    overall: bucketScore(overall).score,
    counts,
    byModule: scored(byModule),
    byFile: scored(byFile),
    byArea: scored(byArea),
  };
}

// ---------------------------------------------------------------------------------------------
// The report

// packData: { language, depth, files: { [fileId]: { exists, frontMatter, answers, flags } }, assets: { rows, present } }
// opts: { depth, today }.  Returns the Report of FORMAT.md section 11.
function validatePackData(packData, schema, opts = {}) {
  const depth = opts.depth ?? packData.depth ?? 'standard';
  if (!Object.hasOwn(schema.depths, depth)) throw new Error(`Unknown depth: ${depth}`);
  const today = opts.today ?? localDate();
  const language = packData.language ?? null;
  const { answers, duplicates } = gatherAnswers(packData, schema);

  const flags = fileProblems(packData, schema, language);
  for (const duplicate of duplicates) {
    const path = schema.files.find((file) => file.id === duplicate.file).path;
    flags.push(newFlag('marker.duplicate', 'warn', { file: duplicate.file, path, qid: duplicate.qid }, duplicate));
  }

  const questions = {};
  const statuses = {};
  const records = [];
  for (const question of questionsInOrder(schema)) {
    const level = effectiveLevel(question, answers, schema);
    const entry = answers[question.id];
    const declared = entry ? entry.status : 'missing';
    let record = { status: 'skipped', declared, owner: '', due: '', note: '', problems: [] };
    if (level !== 'skipped') record = judgeAnswer(question, entry, level, today);
    const where = { qid: question.id, file: question.file };
    const questionFlags = record.problems.map((problem) => newFlag(problem.id, problem.severity, problem.params, where));
    for (const flag of questionFlags) flags.push(flag);
    questions[question.id] = {
      status: record.status,
      declared: record.declared,
      level,
      flags: questionFlags.map(({ id, severity, params }) => ({ id, severity, params })),
      owner: record.owner,
      due: record.due,
      note: record.note,
      inScope: level !== 'skipped' && inDepth(level, depth, schema),
    };
    statuses[question.id] = record.status;
    records.push({ level, status: record.status, file: question.file, module: question.module, area: question.area });
  }
  for (const flag of flags) {
    if (flag.qid && Object.hasOwn(questions, flag.qid) && !questions[flag.qid].flags.some((own) => own.id === flag.id)) {
      questions[flag.qid].flags.push({ id: flag.id, severity: flag.severity, params: flag.params });
    }
  }
  for (const flag of assetProblems(packData.assets)) flags.push(flag);
  for (const flag of crossProblems(packData, schema, answers, statuses)) flags.push(flag);

  const blocking = Object.entries(questions)
    .filter(([, entry]) => entry.level === 'gate1' && entry.status !== 'complete')
    .map(([id]) => id);
  return {
    language,
    depth,
    questions,
    gate1: { ready: blocking.length === 0, blocking },
    completeness: summarize(schema, records, depth),
    flags,
  };
}

function validatePack(pack, schema, opts = {}) {
  return validatePackData(pack, schema, opts);
}

// True when a parsed value holds something a person answered. A note alone does not count.
function valueHasContent(value) {
  if (typeof value.text === 'string') return value.text.trim() !== '';
  if (Array.isArray(value.items)) return value.items.length > 0;
  if (Array.isArray(value.choice)) return value.choice.length > 0;
  return typeof value.date === 'string' && value.date.trim() !== '';
}

// A deferred question is an answer. A complete or partial one is only an answer when it has
// content: an empty marker is a missing answer, as the check reports it.
function entryIsAnswer(entry) {
  if (entry.status === 'tbd') return true;
  if (entry.status !== 'complete' && entry.status !== 'partial') return false;
  return entry.value ? valueHasContent(entry.value) : String(entry.body ?? '').trim() !== '';
}

// True when the pack holds any answer, at any level and any depth.
function hasAnyAnswer(packData) {
  return Object.values(packData.files ?? {}).some(
    (file) => file.exists !== false && Object.values(file.answers ?? {}).some(entryIsAnswer),
  );
}

// The completeness block of the manifest (FORMAT.md section 6).
function manifestCompleteness(report) {
  const { overall, counts, byFile, byModule } = report.completeness;
  return { overall, gate1Ready: report.gate1.ready, gate1Blocking: [...report.gate1.blocking], counts, byFile, byModule };
}

// ---------------------------------------------------------------------------------------------
// What to ask next

function openQuestions(report, schema, depth) {
  return questionsInOrder(schema).filter((question) => {
    const entry = report.questions[question.id];
    return entry && entry.status === 'missing' && inDepth(entry.level, depth, schema);
  });
}

// Missing questions in scope of the depth, counted by effective level.
function remainingByLevel(report, schema, depth = report.depth) {
  const remaining = { gate1: 0, recommended: 0, optional: 0 };
  for (const question of openQuestions(report, schema, depth)) remaining[report.questions[question.id].level] += 1;
  return remaining;
}

function withReportFields(question, report) {
  const entry = report.questions[question.id];
  return { ...question, level: entry.level, status: entry.status };
}

// Questions to ask next. Only `missing` questions in scope of the depth are returned, in module
// order with gate1 questions first inside a module, and a round never crosses a module boundary:
// every question comes from the first module that has any left. A non-empty state.focus returns
// exactly the focus ids that apply (known and not skipped), whatever their status, in focus order.
// opts: { count, module, depth }.
function nextQuestions(pack, schema, report, opts = {}) {
  const depth = opts.depth ?? report.depth;
  const focus = pack.state && Array.isArray(pack.state.focus) ? uniq(pack.state.focus) : [];
  let selected;
  if (focus.length > 0) {
    selected = focus
      .filter((id) => typeof id === 'string' && Object.hasOwn(report.questions, id) && report.questions[id].level !== 'skipped')
      .map((id) => findQuestion(schema, id));
  } else {
    const rank = (question) => schema.moduleOrder.indexOf(question.module) * 2 + (report.questions[question.id].level === 'gate1' ? 0 : 1);
    const ordered = openQuestions(report, schema, depth)
      .filter((question) => !opts.module || question.module === opts.module)
      .map((question, index) => ({ question, index }))
      .sort((first, second) => rank(first.question) - rank(second.question) || first.index - second.index)
      .map(({ question }) => question);
    selected = ordered.filter((question) => question.module === ordered[0]?.module);
  }
  const limited = opts.count ? selected.slice(0, opts.count) : selected;
  return limited.map((question) => withReportFields(question, report));
}

// ---- engine.js ----
// The logic of the static form without any DOM: form state, answers, pack files, manifest, zip.
//
// tools/build-form.mjs inlines this file after the six pure library modules (util, i18n-core, rules,
// parse, render, validate) into one script, so everything here shares their scope and uses their
// functions directly. Nothing in this file touches the DOM, the network or storage.

const FORM_FORMAT = 'everything-mapped-form/1';
const OWNER_CHOICES = ['client', 'me', 'other'];
const SIZE_WARNING_BYTES = 50 * 1024 * 1024;
const ZIP_MAX_BYTES = 0xffffffff;
const ZIP_MAX_ENTRIES = 0xffff;
// What the team's reader of a pack accepts (FORMAT.md section 15): the form never builds more.
const PACK_MAX_ENTRIES = 5000;
const PACK_MAX_BYTES = 500 * 1024 * 1024;
const PACK_MAX_RATIO = 200;
// Room kept for the manifest and the state file when the size is checked before they are made.
const PACK_HEADROOM_BYTES = 2 * 1024 * 1024;
// Entries of a pack besides the attached files: six answer files, the open questions, the file list, the manifest and the state.
const PACK_OWN_ENTRIES = 10;
// Attached files, in the form, in saved data and in an export: one limit everywhere.
const MAX_ATTACHMENTS = PACK_MAX_ENTRIES - PACK_OWN_ENTRIES;
// Rows of a list. The page stops at this number, and anything beyond it is reported, never dropped quietly.
const MAX_ROWS = 500;
const MAX_NAME = 100;
const MAX_NAME_BYTES = 200;
// What the exporter of form data and its loader agree on. Base64 text of the attached files over
// the first number, and the form data is exported without the files; the file is never over the second.
const EXPORT_FILES_BUDGET = 300 * 1024 * 1024;
const IMPORT_MAX_BYTES = 400 * 1024 * 1024;
// While a pack is built, the page gets a turn after about this many bytes of work.
const YIELD_EVERY_BYTES = 8 * 1024 * 1024;
// Work on a big file is done in slices of this size (a multiple of 64, the block size of SHA-256).
const WORK_SLICE_BYTES = 4 * 1024 * 1024;
const DEFLATE_SLICE_BYTES = 1024 * 1024;

// How much each kind of field may hold. The library reads lines of at most 20 000 characters and an
// answer of at most 200 KB, and escaping can make text more than twice as long (a "<" and the letter
// after it become five characters). So a line of a pack file never gets near the limit: fields are
// short, and long lines in a text are broken at WRAP_WIDTH.
const LIMITS = {
  block: { kind: 'block', max: 50000 },
  line: { kind: 'line', max: 2000 },
  item: { kind: 'line', max: 1000 },
  note: { kind: 'block', max: 4000 },
  asset: { kind: 'line', max: 500 },
  person: { kind: 'name', max: 120 },
  recipient: { kind: 'name', max: 200 },
  owner: { kind: 'name', max: 200 },
};
const WRAP_WIDTH = 4000;

// An error whose message is a text key of the form (ui.form.err.*), so the interface can show it
// in the chosen language.
class FormError extends Error {
  constructor(key, params = {}) {
    super(key);
    this.name = 'FormError';
    this.key = key;
    this.params = params;
  }
}

// ---------------------------------------------------------------------------------------------
// Cleaning text that is typed, pasted or loaded
//
// The form removes the characters the library refuses and nothing else (isControlCode and
// isHiddenCode of util.mjs, the one rule that check, answer and the manifest share): the control
// characters (all of C0 but tab and line feed, DEL, all of C1) and the characters that hide text or
// change its direction. Lone surrogates go as well, because they cannot be written as UTF-8 text.
// Joiners (ZWJ, ZWNJ), the soft hyphen, the direction marks LRM and RLM and the narrow no-break
// space are text and stay. Line and paragraph separators are line breaks, as the library reads them.

const SEPARATORS = new RegExp(`[${String.fromCharCode(0x2028)}${String.fromCharCode(0x2029)}]`, 'g');
const LONE_SURROGATES = /[\ud800-\udbff](?![\udc00-\udfff])|(?<![\ud800-\udbff])[\udc00-\udfff]/g;
const LONE_SURROGATE = /[\ud800-\udbff](?![\udc00-\udfff])|(?<![\ud800-\udbff])[\udc00-\udfff]/;

function isRefusedCode(code) {
  return isControlCode(code) || isHiddenCode(code);
}

// -> { text, removed }: the text without the refused characters, and how many were removed.
function removeRefused(value) {
  const text = typeof value === 'string' ? value : '';
  if (!hasHiddenCharacters(text) && !LONE_SURROGATE.test(text)) return { text, removed: 0 };
  let removed = 0;
  let kept = '';
  for (const char of text.replace(LONE_SURROGATES, () => { removed += 1; return ''; })) {
    if (isRefusedCode(char.codePointAt(0))) removed += 1;
    else kept += char;
  }
  return { text: kept, removed };
}

// Cuts to at most `max` UTF-16 units without leaving half a surrogate pair.
function cutUnits(text, max) {
  if (text.length <= max) return text;
  const cut = text.slice(0, max);
  const last = cut.charCodeAt(cut.length - 1);
  return last >= 0xd800 && last <= 0xdbff ? cut.slice(0, -1) : cut;
}

function splitLongLine(line, width) {
  const pieces = [];
  let rest = line;
  while (rest.length > width) {
    let cut = rest.lastIndexOf(' ', width);
    let skip = 1;
    if (cut < width / 2) {
      cut = width;
      skip = 0;
      const unit = rest.charCodeAt(cut - 1);
      if (unit >= 0xd800 && unit <= 0xdbff) cut -= 1;
    }
    pieces.push(rest.slice(0, cut));
    rest = rest.slice(cut + skip);
  }
  pieces.push(rest);
  return pieces.join('\n');
}

// Breaks lines longer than `width` at a space when there is one near the end, else in the middle
// of a word. In markdown a line break inside a paragraph reads like a space.
function wrapLongLines(text, width) {
  if (text.length <= width) return text;
  return text.split('\n').map((line) => (line.length > width ? splitLongLine(line, width) : line)).join('\n');
}

// One line: breaks and tabs become spaces.
function cleanLine(value, max) {
  const text = typeof value === 'string' ? value : '';
  return cutUnits(removeRefused(text.replace(/[\t\r\n]+/g, ' ').replace(SEPARATORS, ' ')).text, max);
}

// A name of a person: the same rule as any line (the library refuses the same characters in a name).
function cleanName(value, max) {
  return cleanLine(value, max);
}

// Several lines, as in a text area.
function cleanBlock(value, max) {
  const text = typeof value === 'string' ? value : '';
  const plain = removeRefused(text.replace(/\r\n?/g, '\n').replace(SEPARATORS, '\n')).text;
  return cutUnits(wrapLongLines(plain, WRAP_WIDTH), max);
}

// `limit` is one of LIMITS.
function cleanField(value, limit) {
  return limit.kind === 'block' ? cleanBlock(value, limit.max) : cleanLine(value, limit.max);
}

// How many characters cleanField removes from what a person typed or pasted (not the ones cut for length).
function countRemoved(value) {
  return removeRefused(value).removed;
}

// ---------------------------------------------------------------------------------------------
// Bytes: UTF-8, CRC-32, SHA-256, base64

function encodeUtf8(text) {
  const source = String(text);
  const out = new Uint8Array(source.length * 3);
  let length = 0;
  for (let index = 0; index < source.length; index += 1) {
    let code = source.charCodeAt(index);
    if (code >= 0xd800 && code <= 0xdbff && index + 1 < source.length) {
      const next = source.charCodeAt(index + 1);
      if (next >= 0xdc00 && next <= 0xdfff) {
        code = 0x10000 + ((code - 0xd800) << 10) + (next - 0xdc00);
        index += 1;
      }
    }
    if (code >= 0xd800 && code <= 0xdfff) code = 0xfffd;
    if (code < 0x80) {
      out[length++] = code;
    } else if (code < 0x800) {
      out[length++] = 0xc0 | (code >> 6);
      out[length++] = 0x80 | (code & 0x3f);
    } else if (code < 0x10000) {
      out[length++] = 0xe0 | (code >> 12);
      out[length++] = 0x80 | ((code >> 6) & 0x3f);
      out[length++] = 0x80 | (code & 0x3f);
    } else {
      out[length++] = 0xf0 | (code >> 18);
      out[length++] = 0x80 | ((code >> 12) & 0x3f);
      out[length++] = 0x80 | ((code >> 6) & 0x3f);
      out[length++] = 0x80 | (code & 0x3f);
    }
  }
  return out.slice(0, length);
}

function toBytes(data) {
  return typeof data === 'string' ? encodeUtf8(data) : data;
}

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n += 1) {
    let c = n;
    for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32Update(crc, bytes, start, end) {
  let c = crc;
  for (let index = start; index < end; index += 1) c = CRC_TABLE[(c ^ bytes[index]) & 0xff] ^ (c >>> 8);
  return c;
}

function crc32(bytes) {
  return (crc32Update(0xffffffff, bytes, 0, bytes.length) ^ 0xffffffff) >>> 0;
}

// The CRC of a big file in slices, so the page gets turns while it is made. `pause` is what
// makeYielder returns.
async function crc32Async(bytes, pause) {
  let crc = 0xffffffff;
  for (let at = 0; at < bytes.length; at += WORK_SLICE_BYTES) {
    const end = Math.min(bytes.length, at + WORK_SLICE_BYTES);
    crc = crc32Update(crc, bytes, at, end);
    await pause(end - at);
  }
  return (crc ^ 0xffffffff) >>> 0;
}

const SHA_ROUNDS = new Uint32Array([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
]);

function rotateRight(value, count) {
  return (value >>> count) | (value << (32 - count));
}

// Mixes one 64-byte block of `bytes` (starting at `offset`) into the hash state.
function shaBlock(state, bytes, offset, words) {
  for (let index = 0; index < 16; index += 1) {
    const at = offset + index * 4;
    words[index] = (bytes[at] << 24) | (bytes[at + 1] << 16) | (bytes[at + 2] << 8) | bytes[at + 3];
  }
  for (let index = 16; index < 64; index += 1) {
    const early = words[index - 15];
    const late = words[index - 2];
    const small0 = rotateRight(early, 7) ^ rotateRight(early, 18) ^ (early >>> 3);
    const small1 = rotateRight(late, 17) ^ rotateRight(late, 19) ^ (late >>> 10);
    words[index] = words[index - 16] + small0 + words[index - 7] + small1;
  }
  let [a, b, c, d, e, f, g, h] = state;
  for (let index = 0; index < 64; index += 1) {
    const big1 = rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);
    const choose = (e & f) ^ (~e & g);
    const first = (h + big1 + choose + SHA_ROUNDS[index] + words[index]) >>> 0;
    const big0 = rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);
    const majority = (a & b) ^ (a & c) ^ (b & c);
    const second = (big0 + majority) >>> 0;
    h = g;
    g = f;
    f = e;
    e = (d + first) >>> 0;
    d = c;
    c = b;
    b = a;
    a = (first + second) >>> 0;
  }
  [a, b, c, d, e, f, g, h].forEach((value, index) => {
    state[index] += value;
  });
}

// The last bytes of the message (fewer than 64), the 0x80 marker and the length in bits, as one or
// two blocks. The rest of the message is mixed in where it lies, so it is never copied.
function shaTail(bytes, fullLength) {
  const rest = bytes.length - fullLength;
  const tail = new Uint8Array(rest + 9 <= 64 ? 64 : 128);
  tail.set(bytes.subarray(fullLength));
  tail[rest] = 0x80;
  const view = new DataView(tail.buffer);
  view.setUint32(tail.length - 8, Math.floor(bytes.length / 0x20000000));
  view.setUint32(tail.length - 4, (bytes.length << 3) >>> 0);
  return tail;
}

function shaStart() {
  return new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
}

// Mixes in the end of the message and gives the hash as lower-case hex.
function shaFinish(state, bytes, fullLength, words) {
  const tail = shaTail(bytes, fullLength);
  for (let offset = 0; offset < tail.length; offset += 64) shaBlock(state, tail, offset, words);
  return Array.from(state, (word) => word.toString(16).padStart(8, '0')).join('');
}

// SHA-256 of a Uint8Array as lower-case hex (the manifest hashes every file with it).
function sha256Hex(bytes) {
  const state = shaStart();
  const words = new Uint32Array(64);
  const fullLength = bytes.length - (bytes.length % 64);
  for (let offset = 0; offset < fullLength; offset += 64) shaBlock(state, bytes, offset, words);
  return shaFinish(state, bytes, fullLength, words);
}

// The same, in slices, so the page gets turns while a big file is hashed.
async function sha256HexSliced(bytes, pause) {
  const state = shaStart();
  const words = new Uint32Array(64);
  const fullLength = bytes.length - (bytes.length % 64);
  for (let at = 0; at < fullLength; at += WORK_SLICE_BYTES) {
    const end = Math.min(fullLength, at + WORK_SLICE_BYTES);
    for (let offset = at; offset < end; offset += 64) shaBlock(state, bytes, offset, words);
    await pause(end - at);
  }
  return shaFinish(state, bytes, fullLength, words);
}

function hexOf(bytes) {
  return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
}

// SHA-256 as lower-case hex. The browser does it when it can (crypto.subtle, which runs beside the
// page and is much faster than the code above); else, or when it refuses, the code above does it, in
// slices (`pause`, from makeYielder, gives the page its turns). Both give the same text.
async function sha256HexAsync(bytes, pause = async () => {}) {
  const subtle = typeof crypto === 'object' && crypto !== null ? crypto.subtle : null;
  if (subtle && typeof subtle.digest === 'function') {
    try {
      return hexOf(new Uint8Array(await subtle.digest('SHA-256', bytes)));
    } catch {
      // Not allowed here (a page that is not a secure context): the plain code does it.
    }
  }
  return sha256HexSliced(bytes, pause);
}

// -> async (bytes) => void. Lets the page have a turn (`yieldToPage`, an async function) after about
// YIELD_EVERY_BYTES of work, so a big pack does not freeze the page and the message "building" shows.
function makeYielder(yieldToPage) {
  let pending = 0;
  return async (bytes) => {
    if (typeof yieldToPage !== 'function') return;
    pending += bytes;
    if (pending < YIELD_EVERY_BYTES) return;
    pending = 0;
    await yieldToPage();
  };
}

const BASE64_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
const BASE64_CODES = Uint8Array.from(BASE64_ALPHABET, (symbol) => symbol.charCodeAt(0));
const BASE64_VALUES = (() => {
  const values = new Int8Array(128).fill(-1);
  for (let index = 0; index < BASE64_ALPHABET.length; index += 1) values[BASE64_ALPHABET.charCodeAt(index)] = index;
  return values;
})();
const BASE64_CHUNK_BYTES = 3 * 65536;

// The base64 text of bytes[start, end); start and end - start are multiples of 3 except at the end.
function base64Chunk(bytes, start, end) {
  const out = new Uint8Array(Math.ceil((end - start) / 3) * 4);
  let at = 0;
  for (let index = start; index < end; index += 3) {
    const chunk = (bytes[index] << 16) | ((index + 1 < end ? bytes[index + 1] : 0) << 8) | (index + 2 < end ? bytes[index + 2] : 0);
    out[at++] = BASE64_CODES[(chunk >> 18) & 63];
    out[at++] = BASE64_CODES[(chunk >> 12) & 63];
    out[at++] = index + 1 < end ? BASE64_CODES[(chunk >> 6) & 63] : 61;
    out[at++] = index + 2 < end ? BASE64_CODES[chunk & 63] : 61;
  }
  let text = '';
  for (let from = 0; from < out.length; from += 16384) text += String.fromCharCode.apply(null, out.subarray(from, from + 16384));
  return text;
}

// The base64 text of bytes in pieces of about 256 KB, so that a big file never needs one huge string.
function base64Parts(bytes) {
  const parts = [];
  for (let start = 0; start < bytes.length; start += BASE64_CHUNK_BYTES) {
    parts.push(base64Chunk(bytes, start, Math.min(bytes.length, start + BASE64_CHUNK_BYTES)));
  }
  return parts;
}

function bytesToBase64(bytes) {
  return base64Parts(bytes).join('');
}

// Returns a Uint8Array, or null when the text is not base64.
function base64ToBytes(text) {
  const clean = String(text).replace(/\s+/g, '');
  if (clean.length % 4 !== 0 || !/^[A-Za-z0-9+/]*={0,2}$/.test(clean)) return null;
  const padding = clean.endsWith('==') ? 2 : clean.endsWith('=') ? 1 : 0;
  const out = new Uint8Array((clean.length / 4) * 3 - padding);
  let length = 0;
  for (let index = 0; index < clean.length; index += 4) {
    let chunk = 0;
    for (let offset = 0; offset < 4; offset += 1) {
      const code = clean.charCodeAt(index + offset);
      chunk = (chunk << 6) | (code === 61 ? 0 : BASE64_VALUES[code]);
    }
    for (const shift of [16, 8, 0]) if (length < out.length) out[length++] = (chunk >> shift) & 255;
  }
  return out;
}

// ---------------------------------------------------------------------------------------------
// Zip writer (FORMAT.md section 15): standard zip, no zip64, UTF-8 names, CRC-32, stored or deflate.

function dosDateTime(date) {
  const year = date.getUTCFullYear();
  if (year < 1980) return { time: 0, date: (1 << 5) | 1 };
  if (year > 2107) return { time: (23 << 11) | (59 << 5) | 29, date: (127 << 9) | (12 << 5) | 31 };
  return {
    time: (date.getUTCHours() << 11) | (date.getUTCMinutes() << 5) | (date.getUTCSeconds() >> 1),
    date: ((year - 1980) << 9) | ((date.getUTCMonth() + 1) << 5) | date.getUTCDate(),
  };
}

// The rules for a name in the zip are the ones of the team's zip writer (scripts/lib/zip.mjs,
// checkName), which uses node modules and so cannot be part of this page. This is a copy of them.
// A test runs both over every code point and a table of tricky names, so the copy cannot drift.
const ZIP_MAX_NAME_PART_BYTES = 255;
const ZIP_MAX_NAME_CHARACTERS = 240;
// Windows treats these as devices, with or without an extension; so do the superscript digits.
const ZIP_DEVICE_NAMES = /^(?:CON|PRN|AUX|NUL|CONIN\$|CONOUT\$|COM[1-9\xb9\xb2\xb3]|LPT[1-9\xb9\xb2\xb3])$/;
// Control characters and invisible ones: [from, to] code points.
const ZIP_FORBIDDEN_RANGES = [
  [0x00, 0x1f],
  [0x7f, 0x9f],
  [0x61c, 0x61c],
  [0x180e, 0x180e],
  [0x200b, 0x200f],
  [0x2028, 0x202e],
  [0x2060, 0x2064],
  [0x2066, 0x2069],
  [0xfeff, 0xfeff],
];
// Characters Windows cannot store in a file name.
const ZIP_FORBIDDEN_CHARACTERS = '<>:"|?*';

function isZipForbiddenCode(code) {
  return ZIP_FORBIDDEN_RANGES.some(([first, last]) => code >= first && code <= last);
}

// Why a zip entry name is refused, as a short code, or '' when it is fine.
function zipNameProblem(name) {
  if (typeof name !== 'string' || name === '') return 'empty';
  if (LONE_SURROGATE.test(name)) return 'notText';
  if (name.includes('\\')) return 'backslash';
  if (name.startsWith('/') || /^[A-Za-z]:/.test(name)) return 'absolute';
  for (const char of name) {
    if (ZIP_FORBIDDEN_CHARACTERS.includes(char) || isZipForbiddenCode(char.codePointAt(0))) return 'character';
  }
  for (const segment of name.split('/')) {
    if (segment === '') return 'emptyPart';
    if (segment === '.' || segment === '..') return 'dots';
    if (/[. ]$/.test(segment)) return 'ending';
    if (ZIP_DEVICE_NAMES.test(segment.split('.')[0].trimEnd().toUpperCase())) return 'device';
    if (encodeUtf8(segment).length > ZIP_MAX_NAME_PART_BYTES) return 'partTooLong';
  }
  if (Array.from(name).length > ZIP_MAX_NAME_CHARACTERS) return 'pathTooLong';
  return '';
}

function checkedZipName(name) {
  const problem = zipNameProblem(name);
  if (problem !== '') throw new Error(`Invalid zip entry name ${JSON.stringify(name)}: ${problem}`);
  return encodeUtf8(name);
}

function compareBytes(first, second) {
  const shared = Math.min(first.length, second.length);
  for (let index = 0; index < shared; index += 1) {
    if (first[index] !== second[index]) return first[index] - second[index];
  }
  return first.length - second.length;
}

// Raw deflate through the browser's CompressionStream, as a list of chunks (never joined into one
// buffer). Returns null when it is not available.
// The bytes go in slices of DEFLATE_SLICE_BYTES, each waited for: a browser deflates what it is given
// at once, so one write of a big file would keep the page busy for as long as it takes. Between
// slices `pause` (from makeYielder) gives the page its turns.
async function deflateRawChunks(bytes, pause = async () => {}) {
  if (typeof CompressionStream !== 'function') return null;
  try {
    const stream = new CompressionStream('deflate-raw');
    const writer = stream.writable.getWriter();
    const reader = stream.readable.getReader();
    const reading = (async () => {
      const chunks = [];
      for (;;) {
        const { done, value } = await reader.read();
        if (done) return chunks;
        chunks.push(value);
      }
    })();
    try {
      for (let at = 0; at < bytes.length; at += DEFLATE_SLICE_BYTES) {
        const end = Math.min(bytes.length, at + DEFLATE_SLICE_BYTES);
        await writer.write(bytes.subarray(at, end));
        await pause(end - at);
      }
      await writer.close();
    } catch (error) {
      reading.catch(() => {});
      throw error;
    }
    return await reading;
  } catch {
    return null;
  }
}

function chunksLength(chunks) {
  return chunks.reduce((sum, chunk) => sum + chunk.length, 0);
}

// One entry of the zip: its name, CRC and size, and the body as chunks (deflated when that makes
// it smaller, but not so much smaller that a reader suspects a zip bomb).
async function prepareZipEntry(entry, compress, pause) {
  const nameBytes = checkedZipName(entry.name);
  const data = toBytes(entry.data);
  let body = [data];
  let method = 0;
  const packed = compress && data.length > 0 ? await compress(data, pause) : null;
  const chunks = packed ? (Array.isArray(packed) ? packed : [packed]) : null;
  const packedLength = chunks ? chunksLength(chunks) : 0;
  if (chunks && packedLength < data.length && data.length <= packedLength * PACK_MAX_RATIO) {
    body = chunks;
    method = 8;
  }
  return { nameBytes, body, bodyLength: chunksLength(body), method, crc: await crc32Async(data, pause), size: data.length };
}

function zipLocalHeader(entry, dos) {
  const header = new Uint8Array(30 + entry.nameBytes.length);
  const view = new DataView(header.buffer);
  view.setUint32(0, 0x04034b50, true);
  view.setUint16(4, 20, true);
  view.setUint16(6, 0x0800, true);
  view.setUint16(8, entry.method, true);
  view.setUint16(10, dos.time, true);
  view.setUint16(12, dos.date, true);
  view.setUint32(14, entry.crc, true);
  view.setUint32(18, entry.bodyLength, true);
  view.setUint32(22, entry.size, true);
  view.setUint16(26, entry.nameBytes.length, true);
  header.set(entry.nameBytes, 30);
  return header;
}

function zipCentralHeader(entry, dos, localOffset) {
  const header = new Uint8Array(46 + entry.nameBytes.length);
  const view = new DataView(header.buffer);
  view.setUint32(0, 0x02014b50, true);
  view.setUint16(4, (3 << 8) | 20, true);
  view.setUint16(6, 20, true);
  view.setUint16(8, 0x0800, true);
  view.setUint16(10, entry.method, true);
  view.setUint16(12, dos.time, true);
  view.setUint16(14, dos.date, true);
  view.setUint32(16, entry.crc, true);
  view.setUint32(20, entry.bodyLength, true);
  view.setUint32(24, entry.size, true);
  view.setUint16(28, entry.nameBytes.length, true);
  view.setUint32(38, (0o100644 << 16) >>> 0, true);
  view.setUint32(42, localOffset, true);
  header.set(entry.nameBytes, 46);
  return header;
}

function zipEndRecord(count, centralSize, centralOffset) {
  const record = new Uint8Array(22);
  const view = new DataView(record.buffer);
  view.setUint32(0, 0x06054b50, true);
  view.setUint16(8, count, true);
  view.setUint16(10, count, true);
  view.setUint32(12, centralSize, true);
  view.setUint32(16, centralOffset, true);
  return record;
}

// entries: [{ name, data }] with data a string (UTF-8) or a Uint8Array. options: { date, compress,
// yieldToPage } where compress is false (store only), an async function Uint8Array -> chunks|null,
// or omitted (deflate through CompressionStream when the browser has it, else store).
// Returns { parts, size }: the zip as a list of pieces (headers and bodies) that a Blob can take as
// they are, so no second copy of a big file is made. Entries are written sorted by name.
async function createZipParts(entries, options = {}) {
  if (entries.length > ZIP_MAX_ENTRIES) throw new FormError('ui.form.err.tooManyFiles', { count: entries.length, max: ZIP_MAX_ENTRIES });
  const dos = dosDateTime(options.date || new Date());
  const compress = options.compress === false ? null : options.compress || deflateRawChunks;
  const seen = new Set();
  const prepared = [];
  const pause = makeYielder(options.yieldToPage);
  for (const entry of entries) {
    const item = await prepareZipEntry(entry, compress, pause);
    const key = bytesToBase64(item.nameBytes);
    if (seen.has(key)) throw new Error(`The name ${JSON.stringify(entry.name)} appears twice`);
    seen.add(key);
    prepared.push(item);
  }
  prepared.sort((first, second) => compareBytes(first.nameBytes, second.nameBytes));

  const parts = [];
  const central = [];
  let offset = 0;
  for (const entry of prepared) {
    central.push(zipCentralHeader(entry, dos, offset));
    const header = zipLocalHeader(entry, dos);
    parts.push(header, ...entry.body);
    offset += header.length + entry.bodyLength;
  }
  const centralSize = chunksLength(central);
  const size = offset + centralSize + 22;
  if (size > ZIP_MAX_BYTES) throw new FormError('ui.form.err.tooLarge');
  parts.push(...central, zipEndRecord(prepared.length, centralSize, offset));
  return { parts, size };
}

function joinParts(parts, size) {
  const bytes = new Uint8Array(size);
  let at = 0;
  for (const part of parts) {
    bytes.set(part, at);
    at += part.length;
  }
  return bytes;
}

// The same zip as one Uint8Array (tests, small packs).
async function createZipBytes(entries, options = {}) {
  const { parts, size } = await createZipParts(entries, options);
  return joinParts(parts, size);
}

// ---------------------------------------------------------------------------------------------
// Names of attached files
//
// A name must pass three readers: the zip writer (zipNameProblem), the list of files in the pack
// (isStorableAssetName: no control or hidden character, no space at an end) and the pack reader
// (isPackFile: no hidden or temporary name). assetNameProblem asks all three; safeAssetName makes
// any name pass them.

// Characters a file name may not hold: those the zip writer refuses, those the library refuses
// anywhere, and lone surrogates.
function isForbiddenNameCode(code) {
  return isZipForbiddenCode(code) || isRefusedCode(code) || (code >= 0xd800 && code <= 0xdfff);
}

function nameMarker(code) {
  return `<U+${code.toString(16).toUpperCase().padStart(4, '0')}>`;
}

// The name with every character that a file name may not hold written as <U+XXXX>, so a person can
// see what was taken out.
function showNameCharacters(value) {
  let shown = '';
  for (const char of String(value ?? '')) {
    const code = char.codePointAt(0);
    shown += isForbiddenNameCode(code) ? nameMarker(code) : char;
  }
  return shown;
}

function removeNameCharacters(value) {
  let kept = '';
  for (const char of String(value ?? '')) if (!isForbiddenNameCode(char.codePointAt(0))) kept += char;
  return kept;
}

function foldName(name) {
  return name.normalize('NFC').toLowerCase();
}

// Why `name`, a file name in the folder `directory` of the pack, is refused by the zip writer, the
// list of files or the reader of a pack: a short code, or '' when it is fine everywhere.
function assetNameProblem(name, directory) {
  const zip = zipNameProblem(`${directory}/${name}`);
  if (zip !== '') return zip;
  if (!isStorableAssetName(name)) return 'storable';
  return isPackFile(`${directory}/${name}`) ? '' : 'hidden';
}

// At most MAX_NAME characters (not units: no emoji is cut in two) and MAX_NAME_BYTES bytes of UTF-8,
// keeping a short extension.
function limitName(name) {
  const points = Array.from(name);
  const dot = points.lastIndexOf('.');
  const extension = dot > 0 && points.length - dot <= 10 ? points.slice(dot) : [];
  const stem = dot > 0 && extension.length > 0 ? points.slice(0, dot) : points;
  let kept = stem.slice(0, Math.max(1, MAX_NAME - extension.length));
  while (kept.length > 1 && encodeUtf8(kept.concat(extension).join('')).length > MAX_NAME_BYTES) kept = kept.slice(0, -1);
  return kept.concat(extension).join('');
}

function trimNameEnd(name) {
  return name.replace(/[. ]+$/, '');
}

// What a name needs after it was cut or numbered, or was given: no dot at the front, none of the
// characters Windows refuses, nothing at the end that Windows drops (dot, space), a name left, no
// ".tmp" ending and no device name.
function repairName(value) {
  let name = value.trim().replace(/[<>:"|?*#%]/g, '-').replace(/\s+/g, '-');
  name = trimNameEnd(name.replace(/-{2,}/g, '-').replace(/^\.+/, ''));
  if (/^-*$/.test(name)) name = 'file';
  if (ZIP_DEVICE_NAMES.test(name.split('.')[0].trimEnd().toUpperCase())) name = `_${name}`;
  if (name.toLowerCase().endsWith('.tmp')) name = `${name.slice(0, -4)}-tmp`;
  return name;
}

// `stem` and `extension` with "-number" between them, the stem made shorter when the whole would be
// longer than a name may be.
function numberedName(stem, extension, number) {
  const points = Array.from(stem);
  for (;;) {
    const candidate = trimNameEnd(`${points.join('')}-${number}${extension}`);
    const fits = Array.from(candidate).length <= MAX_NAME + 1 && encodeUtf8(candidate).length <= MAX_NAME_BYTES + 1;
    if (fits || points.length <= 1) return candidate;
    points.pop();
  }
}

function uniqueName(name, taken) {
  if (!taken.has(foldName(name))) return name;
  const dot = name.lastIndexOf('.');
  const stem = dot > 0 ? name.slice(0, dot) : name;
  const extension = dot > 0 ? name.slice(dot) : '';
  for (let number = 2; ; number += 1) {
    const candidate = numberedName(stem, extension, number);
    if (!taken.has(foldName(candidate))) return candidate;
  }
}

// A file name that is safe inside docs/assets on every system, unique among the folded names
// (NFC, lower case) in `taken`. The folder part of a path is dropped, and so are control characters,
// invisible and direction characters and lone surrogates. A name that was cut or numbered is made
// whole again: it never ends in a dot or a space. `directory` is the folder in the pack.
function safeAssetName(rawName, taken, directory = 'docs/assets') {
  const base = String(rawName ?? '').normalize('NFC').split(/[\\/]/).pop();
  const cleaned = cutUnits(removeNameCharacters(base), 4 * MAX_NAME_BYTES);
  const name = uniqueName(repairName(limitName(repairName(cleaned))), taken);
  return assetNameProblem(name, directory) === '' ? name : uniqueName('file', taken);
}

// ---------------------------------------------------------------------------------------------
// Texts of a record that came from outside (saved data, an imported file)

// Cleans a value and counts it in notes.cleaned when cleaning changed what was given.
function cleanTracked(value, limit, notes) {
  const cleaned = cleanField(value, limit);
  if (notes && typeof value === 'string' && cleaned !== value) notes.cleaned += 1;
  return cleaned;
}

// What loading changed in the data it was given, so the page can say so: values that were cleaned or
// cut (cleaned), entries that do not belong in this form (ignored), list entries and attached files
// beyond the limits (droppedItems, droppedFiles) and the names of files that came without their
// content and must be attached again (reattach).
function newNotes() {
  return { cleaned: 0, ignored: 0, droppedItems: 0, droppedFiles: 0, reattach: [] };
}

function cleanItems(raw, withNote, notes) {
  if (!Array.isArray(raw)) return [];
  if (notes && raw.length > MAX_ROWS) notes.droppedItems += raw.length - MAX_ROWS;
  return raw.slice(0, MAX_ROWS).map((item) => ({
    text: cleanTracked(isPlainObject(item) ? item.text : item, LIMITS.item, notes),
    note: withNote && isPlainObject(item) ? cleanTracked(item.note, LIMITS.item, notes) : '',
  }));
}

function cleanChoices(question, raw) {
  const wanted = Array.isArray(raw) ? raw.filter((id) => typeof id === 'string') : [];
  const known = uniq(wanted.filter((id) => (question.choices ?? []).includes(id)));
  return question.type === 'choice' ? known.slice(0, 1) : known;
}

// The answer of one question, as the form keeps it. Only fields that fit the question type stay.
// notes (optional, see newNotes) counts what cleaning changed or left out.
function cleanRecord(question, raw, notes) {
  if (!isPlainObject(raw)) return null;
  const record = {};
  const type = question.type;
  if (type === 'text' || type === 'longtext') record.text = cleanTracked(raw.text, type === 'longtext' ? LIMITS.block : LIMITS.line, notes);
  if (type === 'list' || type === 'urllist') record.items = cleanItems(raw.items, type === 'urllist', notes);
  if (type === 'choice' || type === 'multichoice') {
    record.choice = cleanChoices(question, raw.choice);
    record.note = cleanTracked(raw.note, LIMITS.note, notes);
  }
  if (type === 'date') {
    record.date = isValidDate(raw.date) ? raw.date : '';
    record.note = cleanTracked(raw.note, LIMITS.note, notes);
  }
  record.unknown = raw.unknown === true;
  record.owner = OWNER_CHOICES.includes(raw.owner) ? raw.owner : 'client';
  record.ownerName = cleanTracked(raw.ownerName, LIMITS.owner, notes);
  record.due = isValidDate(raw.due) ? raw.due : '';
  record.tbdNote = cleanTracked(raw.tbdNote, LIMITS.note, notes);
  return record;
}

// ---------------------------------------------------------------------------------------------
// The engine

// data: { schema, dictionaries: { da, en }, toolVersion }. Returns the functions the form needs;
// none of them reads or writes the page.
function createEngine(data) {
  const schema = data.schema;
  const toolVersion = data.toolVersion;
  const storageKey = data.storageKey;
  const dictionaries = {};
  for (const lang of schema.languages) dictionaries[lang] = makeI18n(data.dictionaries[lang], lang);
  const ordered = questionsInOrder(schema);
  const byId = new Map(ordered.map((question) => [question.id, question]));

  function i18n(lang) {
    return dictionaries[lang];
  }

  function newState(options = {}) {
    return {
      format: FORM_FORMAT,
      language: schema.languages.includes(options.language) ? options.language : 'en',
      depth: Object.hasOwn(schema.depths, options.depth) ? options.depth : 'standard',
      respondent: { name: '', role: '' },
      recipient: '',
      currentModule: schema.moduleOrder[0],
      createdAt: isoDateTime(options.now || new Date()),
      answers: {},
      assets: [],
    };
  }

  // The record of a question, created when it is first needed for writing.
  function record(state, id) {
    if (!state.answers[id]) state.answers[id] = {};
    return state.answers[id];
  }

  function assetsOf(state, id) {
    return state.assets.filter((asset) => asset.qid === id);
  }

  function nextAssetId(state) {
    const numbers = state.assets.map((asset) => Number(String(asset.id).replace(/^a/, '')) || 0);
    return `a${Math.max(0, ...numbers) + 1}`;
  }

  // The size of the attached files that have their content.
  function attachedBytes(state) {
    return state.assets.reduce((sum, asset) => sum + (asset.data ? asset.data.length : 0), 0);
  }

  // Why a file cannot be attached, as { key, params }, or null. Looks at the name and size only, so a
  // file that is too big is never read into memory. A pack holds at most PACK_MAX_BYTES in all and
  // needs PACK_HEADROOM_BYTES for its own files, so a single file over the difference can never fit,
  // and the files together may not go over it either. `textBytes` (optional) is what the answer files
  // take at the moment; the page passes it, so what is allowed here is what the build allows.
  function attachmentProblem(state, file, textBytes = 0) {
    const name = cleanLine(file.name, MAX_NAME_BYTES);
    const nominal = PACK_MAX_BYTES - PACK_HEADROOM_BYTES;
    const room = nominal - textBytes;
    const limit = `${Math.floor(nominal / (1024 * 1024))} MB`;
    if (file.size > room) return { key: 'ui.form.files.tooBig', params: { name, limit } };
    if (state.assets.length >= MAX_ATTACHMENTS) return { key: 'ui.form.files.tooMany', params: { name, max: MAX_ATTACHMENTS } };
    if (attachedBytes(state) + file.size > room) return { key: 'ui.form.files.totalTooBig', params: { name, limit } };
    return null;
  }

  // Adds a file. The name is cleaned (safeAssetName); when that changes it, `renamedFrom` keeps the
  // name the person gave, with the characters that were hidden made visible, so the page can say so.
  function addAsset(state, qid, file) {
    const taken = new Set(state.assets.map((asset) => foldName(asset.name)));
    const name = safeAssetName(file.name, taken, schema.generatedFiles.assetsDir);
    const asset = {
      id: nextAssetId(state),
      qid,
      name,
      renamedFrom: file.name === name ? '' : cutUnits(showNameCharacters(file.name), MAX_NAME_BYTES),
      what: '',
      owner: '',
      rights: '',
      restrictions: '',
      size: file.data.length,
      data: file.data,
    };
    state.assets.push(asset);
    return asset;
  }

  function removeAsset(state, id) {
    state.assets = state.assets.filter((asset) => asset.id !== id);
  }

  // ----- from the form's answers to answer.mjs style inputs

  function ownerOf(rec, respondent) {
    if (rec.owner === 'other') return oneLine(rec.ownerName);
    if (rec.owner === 'me') return oneLine(cleanField(respondent.name, LIMITS.person));
    return 'client';
  }

  function itemsOf(rec, question) {
    const withNote = question.type === 'urllist';
    return (rec.items ?? [])
      .map((item) => ({ text: oneLine(item.text), note: withNote ? oneLine(item.note) : '' }))
      .filter((item) => item.text !== '');
  }

  function contentInput(question, rec, state) {
    switch (question.type) {
      case 'text':
      case 'longtext': {
        const text = normalizeText(rec.text);
        return text === '' ? null : { text };
      }
      case 'list':
      case 'urllist': {
        const items = itemsOf(rec, question);
        return items.length === 0 ? null : { items };
      }
      case 'choice':
      case 'multichoice': {
        const ids = cleanChoices(question, rec.choice);
        return ids.length === 0 ? null : { choice: ids, note: normalizeText(rec.note) };
      }
      case 'date':
        return isValidDate(rec.date) ? { date: rec.date, note: normalizeText(rec.note) } : null;
      case 'files': {
        const items = assetsOf(state, question.id)
          .filter((asset) => asset.data)
          .map((asset) => ({ text: `assets/${asset.name}`, note: oneLine(cleanField(asset.what, LIMITS.asset)) }));
        return items.length === 0 ? null : { items };
      }
      default:
        return null;
    }
  }

  function answerInput(question, rec, state) {
    const own = cleanRecord(question, rec || {});
    if (own.unknown) {
      const due = isValidDate(own.due) ? own.due : '';
