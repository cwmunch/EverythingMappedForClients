<style>
/* The look of the static form: one system font, flat colour, no pictures.
   Colours are tokens on :root; the dark set follows prefers-color-scheme. */

:root {
  color-scheme: light dark;
  --bg: #f6f5f1;
  --surface: #ffffff;
  --tint: #ebf1ee;
  --ink: #1c1b19;
  --muted: #5a5852;
  --line: #d6d3ca;
  --field-border: #85827a;
  --accent: #1d5c48;
  --accent-hover: #14412f;
  --accent-ink: #ffffff;
  --focus: #1a56c4;
  --warn: #8a3a00;
  --danger: #a12b1c;
  --danger-bg: #fbeae7;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412;
    --surface: #1d1d1a;
    --tint: #1f2b26;
    --ink: #ecebe5;
    --muted: #b0aea4;
    --line: #3a3934;
    --field-border: #8a877e;
    --accent: #6fc7a5;
    --accent-hover: #8ad8bb;
    --accent-ink: #0c1d16;
    --focus: #8ab4ff;
    --warn: #f2b072;
    --danger: #ff9d90;
    --danger-bg: #3a1f1b;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 1rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

#app {
  max-width: 72rem;
  margin: 0 auto;
  padding: 1.5rem 1rem 4rem;
}

noscript p,
#emfc-failed p {
  max-width: 40rem;
  margin: 1.5rem auto;
  padding: 0 1rem;
}

h1,
h2,
h3 {
  margin: 0 0 0.5rem;
  line-height: 1.25;
  font-weight: 650;
}

h1 {
  font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.25rem);
}

h2 {
  font-size: 1.3rem;
}

h3 {
  font-size: 1.05rem;
}

p {
  margin: 0 0 0.75rem;
}

.muted {
  color: var(--muted);
}

.skip {
  position: absolute;
  left: -999rem;
  top: 0;
}

.skip:focus {
  left: 1rem;
  top: 1rem;
  z-index: 10;
  padding: 0.5rem 1rem;
  background: var(--surface);
  color: var(--ink);
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

[tabindex="-1"]:focus {
  outline: none;
}

/* Top of the page */

.top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem 2rem;
  margin-bottom: 1.5rem;
}

.top-text {
  flex: 1 1 24rem;
  max-width: 44rem;
}

.lede {
  color: var(--muted);
  font-size: 1.0625rem;
}

.lang {
  display: flex;
  border: 1px solid var(--field-border);
  border-radius: 0.5rem;
  overflow: hidden;
}

.seg {
  min-height: 2.75rem;
  padding: 0 1.1rem;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}

.seg + .seg {
  border-left: 1px solid var(--field-border);
}

.seg:focus-visible {
  outline-offset: -3px;
}

.seg[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}

.privacy {
  max-width: 52rem;
  margin-bottom: 1.5rem;
  padding: 0.25rem 0 0.25rem 1rem;
  border-left: 3px solid var(--accent);
}

.privacy h2 {
  font-size: 1.05rem;
}

.privacy .btn.quiet {
  margin-left: -1.1rem;
}

.card {
  padding: 1.25rem;
  border: 1px solid var(--line);
  border-radius: 0.5rem;
  background: var(--surface);
}

.setup {
  display: grid;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.setup h2 {
  margin: 0;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
  gap: 1rem;
}

/* Form controls */

.lbl {
  display: block;
}

.lbl-text {
  display: block;
  margin-bottom: 0.25rem;
  font-weight: 600;
}

.field {
  display: block;
  width: 100%;
  min-height: 2.75rem;
  padding: 0.6rem 0.75rem;
  border: 1px solid var(--field-border);
  border-radius: 0.375rem;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
}

textarea.field {
  min-height: 5.5rem;
  line-height: 1.5;
  resize: vertical;
  field-sizing: content;
}

.field::placeholder {
  color: var(--muted);
  opacity: 1;
}

.field-date {
  max-width: 14rem;
}

fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

legend {
  padding: 0;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  min-height: 2.75rem;
  padding: 0.5rem 0;
  cursor: pointer;
}

.option input {
  flex: none;
  width: 1.25rem;
  height: 1.25rem;
  margin: 0.2rem 0 0;
  accent-color: var(--accent);
}

.desc {
  display: block;
  color: var(--muted);
}

.options {
  margin-bottom: 0.5rem;
}

.btn {
  min-height: 2.75rem;
  padding: 0.5rem 1.1rem;
  border: 1px solid var(--accent);
  border-radius: 0.375rem;
  background: var(--accent);
  color: var(--accent-ink);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

.btn:hover {
  border-color: var(--accent-hover);
  background: var(--accent-hover);
}

.btn.secondary {
  background: transparent;
  color: var(--accent);
}

.btn.secondary:hover {
  background: var(--tint);
}

.btn.quiet {
  border-color: transparent;
  background: transparent;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.btn.quiet:hover {
  background: var(--tint);
}

.btn.small {
  min-height: 2.25rem;
  padding: 0.25rem 0.75rem;
}

.btn[disabled] {
  opacity: 0.6;
  cursor: default;
}

.link {
  min-height: 2.25rem;
  padding: 0.25rem 0;
  border: 0;
  background: none;
  color: var(--accent);
  font: inherit;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  overflow-wrap: anywhere;
}

.file {
  max-width: 100%;
  font: inherit;
}

.file::file-selector-button {
  min-height: 2.5rem;
  margin-right: 1rem;
  padding: 0.4rem 1rem;
  border: 1px solid var(--accent);
  border-radius: 0.375rem;
  background: transparent;
  color: var(--accent);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

.import {
  padding-top: 0.5rem;
  border-top: 1px solid var(--line);
}

/* Status and navigation */

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: start;
  gap: 1.5rem;
}

.side {
  display: grid;
  gap: 1rem;
}

.panel h2 {
  font-size: 1.1rem;
}

.bar {
  height: 0.5rem;
  margin: 0.75rem 0;
  border-radius: 0.25rem;
  background: var(--line);
  overflow: hidden;
}

.bar-fill {
  width: 0;
  height: 100%;
  background: var(--accent);
  transition: width 0.2s ease;
}

.must {
  font-weight: 600;
}

.must-list summary,
.nav-box summary,
.note-box summary,
.aids summary {
  min-height: 2.25rem;
  cursor: pointer;
  color: var(--accent);
}

.nav-box > summary {
  display: flex;
  align-items: center;
  min-height: 2.75rem;
  color: var(--ink);
  font-weight: 650;
}

.nav-list,
.plain-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.plain-list li {
  margin: 0.25rem 0;
}

.nav-item {
  display: grid;
  grid-template-columns: 1.25rem minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.5rem;
  width: 100%;
  min-height: 2.75rem;
  padding: 0.4rem 0.5rem;
  border: 0;
  border-left: 3px solid transparent;
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.nav-item:hover {
  background: var(--tint);
}

.nav-item[aria-current="step"] {
  border-left-color: var(--accent);
  background: var(--tint);
  font-weight: 650;
}

.nav-id {
  color: var(--muted);
}

.nav-count {
  color: var(--muted);
  font-size: 0.875rem;
  white-space: nowrap;
}

.save-state {
  margin: 0.75rem 0 0;
  font-size: 0.875rem;
}

.notices {
  margin-bottom: 1rem;
}

.notice {
  margin: 0 0 0.75rem;
  padding: 0.75rem 1rem;
  border-left: 3px solid var(--accent);
  background: var(--tint);
}

.notice-error {
  border-left-color: var(--danger);
  background: var(--danger-bg);
}

.notice:empty {
  margin: 0;
  padding: 0;
  border: 0;
}

/* Modules and questions */

.module-head {
  margin-bottom: 1.25rem;
}

.eyebrow {
  margin: 0;
  color: var(--muted);
  font-size: 0.875rem;
}

.intro {
  max-width: 44rem;
}

.module-count {
  color: var(--muted);
  font-size: 0.9375rem;
}

.questions {
  display: grid;
  gap: 1rem;
}

.q {
  display: block;
  min-width: 0;
  padding: 1.25rem;
  border: 1px solid var(--line);
  border-radius: 0.5rem;
  background: var(--surface);
  overflow-wrap: anywhere;
}

.q-label {
  display: block;
  width: 100%;
  font-size: 1.0625rem;
  font-weight: 650;
}

.q-meta {
  margin: 0.15rem 0 0.5rem;
  color: var(--muted);
  font-size: 0.875rem;
}

.tag {
  font-weight: 600;
}

.status:not(:empty) {
  margin-left: 0.75rem;
  padding-left: 0.75rem;
  border-left: 1px solid var(--line);
}

.q[data-status="complete"] .status {
  color: var(--accent);
}

.ask {
  margin: 0 0 0.5rem;
}

.aids {
  margin-bottom: 0.75rem;
}

.aids details p {
  margin: 0.25rem 0 0.5rem;
  padding-left: 1rem;
  border-left: 3px solid var(--line);
}

.hint {
  margin: 0.5rem 0 0;
  color: var(--muted);
  font-size: 0.9375rem;
}

.hint.warn {
  color: var(--warn);
}

.unknown {
  margin-top: 1rem;
  padding-top: 0.5rem;
  border-top: 1px solid var(--line);
}

.tbd {
  display: grid;
  gap: 1rem;
  margin-top: 0.5rem;
  padding: 1rem;
  border-radius: 0.375rem;
  background: var(--tint);
}

.owner .field {
  margin-top: 0.25rem;
}

.rows,
.assets {
  display: grid;
  gap: 0.5rem;
  margin: 0 0 0.75rem;
  padding: 0;
  list-style: none;
}

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 0.5rem;
}

.row-note {
  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr) auto;
}

.note-box {
  margin-top: 0.75rem;
}

.note-box .field {
  margin-top: 0.25rem;
}

.asset {
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 0.375rem;
}

.asset-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 1rem;
  margin-bottom: 0.75rem;
}

.asset-name {
  overflow-wrap: anywhere;
}

.module-foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.75rem;
  margin-top: 1.5rem;
}

.finish {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 1rem;
}

/* A long file name or e-mail address breaks instead of making the page scroll sideways. */
.finish-block,
.plain-list li,
.notice,
.finish-summary,
.hint {
  overflow-wrap: anywhere;
}

.finish-block {
  min-width: 0;
  padding: 1.25rem;
  border: 1px solid var(--line);
  border-radius: 0.5rem;
  background: var(--surface);
}

.after-download {
  margin-top: 0.5rem;
}

.after-download p {
  margin: 0.25rem 0 0;
}

.sync {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: 0 0 1rem;
  padding: 0.75rem 1rem;
  border: 1px solid var(--line);
  border-left: 3px solid var(--danger);
  background: var(--danger-bg);
}

.sync p {
  margin: 0 0 0.75rem;
  overflow-wrap: anywhere;
}

.sync .actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.finish-block .btn {
  margin: 0.25rem 0 0.5rem;
}

.finish-summary {
  font-weight: 600;
}

/* Wide screens: status and navigation beside the questions */

@media (min-width: 56rem) {
  .layout {
    grid-template-columns: 18rem minmax(0, 1fr);
  }

  .side {
    position: sticky;
    top: 0.75rem;
    max-height: calc(100vh - 1.5rem);
    margin: -0.25rem;
    padding: 0.25rem;
    overflow: auto;
  }
}

/* Narrow screens */

@media (max-width: 40rem) {
  #app {
    padding: 1rem 1rem 3rem;
  }

  .q,
  .card,
  .finish-block {
    padding: 1rem;
  }

  .row-note {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .row-note .field:nth-child(2) {
    grid-column: 1 / -1;
    grid-row: 2;
  }

  .module-foot .btn {
    flex: 1 1 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}

/* Paper: every module, no controls that do nothing on paper */

@media print {
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #ffffff;
    --tint: #ffffff;
    --ink: #000000;
    --muted: #333333;
    --line: #999999;
    --field-border: #666666;
    --accent: #000000;
    --warn: #000000;
  }

  body {
    font-size: 11pt;
  }

  #app {
    max-width: none;
    padding: 0;
  }

  .skip,
  .lang,
  .side,
  .btn,
  .link,
  .file,
  .import,
  .aids,
  .module-foot,
  .privacy .btn {
    display: none !important;
  }

  .layout {
    display: block;
  }

  .module[hidden] {
    display: block !important;
  }

  .module {
    margin-top: 1.5rem;
  }

  .q {
    padding: 0.5rem 0;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    break-inside: avoid;
  }

  .field {
    border-color: var(--field-border);
  }
}
</style>
</head>

<script type="application/json" id="emfc-texts-da">{"file.brief.title":"Projektbeskrivelse","file.brief.intro":"Her beskriver du virksomheden, målet med projektet og hvordan samarbejdet skal foregå. Det tager cirka 20 minutter.","file.brand.title":"Brand","file.brand.intro":"Her samler du det, der gør virksomheden genkendelig: navn, værdier, tone, logo og farver. Det tager cirka 20 minutter.","file.audience.title":"Målgruppe og konkurrenter","file.audience.intro":"Her beskriver du, hvem hjemmesiden er til, hvem du konkurrerer med, og hvordan hjemmesiden skal føles. Det tager cirka 30 minutter.","file.content.title":"Produkter og indhold","file.content.intro":"Her beskriver du, hvad du sælger, og hvilke tekster, billeder og andet materiale der findes i forvejen. Det tager cirka 20 minutter.","file.scope.title":"Omfang og opbygning","file.scope.intro":"Her bliver det klart, hvilke sider og funktioner hjemmesiden skal have, og hvem der skal opdatere den bagefter. Det tager cirka 15 minutter.","file.technical.title":"Teknik og regler","file.technical.intro":"Her samler du de praktiske oplysninger om domæne, drift, persondata og lovkrav. Det tager cirka 10 minutter, og du behøver ikke kende de tekniske detaljer for at svare.","module.A.title":"Virksomheden og projektet","module.A.intro":"Kort om virksomheden, hvorfor projektet sker nu, og hvad det skal føre til. Det tager cirka 15 minutter.","module.B.title":"Dit brand","module.B.intro":"Navn, formål, personlighed og tone, og hvad der findes af logo, skrifttyper og farver. Det tager cirka 20 minutter.","module.C.title":"Produkter og ydelser","module.C.intro":"Hvad du sælger, hvad der er vigtigst at sælge, og hvorfor kunderne vælger dig. Det tager cirka 10 minutter.","module.D.title":"Målgruppen","module.D.intro":"Hvem hjemmesiden er til, hvad de leder efter, og hvad de skal gøre, når de er der. Det tager cirka 15 minutter.","module.E.title":"Konkurrenter og inspiration","module.E.intro":"Hvem du konkurrerer med, hvilke hjemmesider du kan lide eller ikke kan lide, og hvordan din egen skal føles. Det tager cirka 15 minutter.","module.F.title":"Tekster, billeder og materiale","module.F.intro":"Hvad der allerede findes af tekster, fotos og andre filer, og hvem der skriver de nye tekster. Det tager cirka 10 minutter.","module.G.title":"Sider og funktioner","module.G.intro":"Hvilke sider og funktioner hjemmesiden skal have, og hvad der ikke er med denne gang. Det tager cirka 10 minutter.","module.H.title":"Opdatering og vedligeholdelse","module.H.intro":"Hvem der skal rette og tilføje indhold, når hjemmesiden er i luften, og hvem der holder den ved lige. Det tager cirka 5 minutter.","module.I.title":"Teknik, data og regler","module.I.intro":"Domæne, drift, persondata, cookies og tilgængelighed. Det tager cirka 10 minutter, og det er fint at markere det, du ikke ved, som noget, der skal afklares senere.","module.J.title":"Samarbejdet","module.J.intro":"Hvem der er kontaktperson, hvornår du har tid til at give feedback, og hvad der ellers er godt at vide. Det tager cirka 5 minutter.","q.A.business.label":"Virksomheden kort fortalt","q.A.business.ask":"Hvordan vil du beskrive din virksomhed for en, der aldrig har hørt om den? Fortæl gerne, hvad den laver, for hvem og hvor.","q.A.business.help":"Det giver et fælles udgangspunkt for alt det andet. Et par sætninger med dine egne ord er nok.","q.A.business.example":"Holm Tømrer og Snedker er et tømrerfirma i Aarhus med ni ansatte. Vi renoverer køkkener, tage og vinduer for private boligejere i Østjylland og har gjort det siden 1998.","q.A.project-kind.label":"Type af projekt","q.A.project-kind.ask":"Hvad er det for et projekt: en ny hjemmeside, en ny udgave af den, du har, eller noget andet?","q.A.project-kind.help":"Typen afgør, hvad der skal undersøges først, for eksempel om der er indhold, som skal flyttes fra en gammel hjemmeside.","q.A.project-kind.example":"En ny udgave af vores nuværende hjemmeside, som er otte år gammel.","choice.A.project-kind.new-site":"Ny hjemmeside","choice.A.project-kind.redesign":"Ny udgave af en eksisterende hjemmeside","choice.A.project-kind.landing-page":"En enkelt side til en kampagne eller et produkt","choice.A.project-kind.small-app":"En lille app","choice.A.project-kind.other":"Noget andet","q.A.existing-site.label":"Den nuværende hjemmeside","q.A.existing-site.ask":"Hvad er adressen på din nuværende hjemmeside? Skriv gerne, hvad der virker godt, og hvad der ikke gør.","q.A.existing-site.help":"Den nuværende hjemmeside viser, hvad der skal med videre, og hvad der skal blive bedre.","q.A.existing-site.example":"- https://www.example.com | Kunderne finder os, men siden er svær at bruge på mobilen\n- https://www.example.com/galleri | Billederne af vores arbejde er det, folk kigger mest på","q.A.why-now.label":"Hvorfor lige nu","q.A.why-now.ask":"Hvad har fået dig til at sætte projektet i gang netop nu?","q.A.why-now.help":"Årsagen siger meget om, hvad der haster, og hvad der skal løses først.","q.A.why-now.example":"Vi har ansat to nye tømrere og har plads til flere opgaver. Den gamle hjemmeside giver næsten ingen henvendelser, og den viser ikke, hvad vi kan i dag.","q.A.goal.label":"Det vigtigste mål","q.A.goal.ask":"Hvad er det vigtigste, hjemmesiden skal opnå for din virksomhed?","q.A.goal.help":"Et klart mål gør det lettere at vælge, hvad der skal fylde mest, og hvad der kan vente.","q.A.goal.example":"At få flere henvendelser fra private kunder, så vi kan fylde kalenderen to måneder frem.","q.A.metrics.label":"Tal, der viser, om det virker","q.A.metrics.ask":"Hvilke tal vil du gerne se ændre sig, og hvor ligger de i dag?","q.A.metrics.help":"Når du kender tallet i dag, kan du senere se, om den nye hjemmeside gør en forskel. Et skøn er fint, hvis du ikke har de præcise tal.","q.A.metrics.example":"- Henvendelser via hjemmesiden: cirka 6 om måneden i dag, gerne 15\n- Andel af henvendelser, der bliver til en opgave: cirka 30 procent i dag\n- Besøgende om måneden: cirka 800 i dag","q.A.deadline.label":"Ønsket dato for lancering","q.A.deadline.ask":"Hvornår skal hjemmesiden senest være i luften?","q.A.deadline.help":"Datoen afgør, hvor meget der kan nås, og hvad der eventuelt må vente. Skriv den dato, du sigter mod, også selvom den kan flytte sig.","q.A.deadline.example":"1. marts 2027","q.A.deadline-reason.label":"Grunden til datoen","q.A.deadline-reason.ask":"Hvad gør netop den dato vigtig, og hvad sker der, hvis den skrider?","q.A.deadline-reason.help":"Nogle datoer ligger fast, andre er ønsker. Det er godt at vide, hvor der er plads til at rykke.","q.A.deadline-reason.example":"Foråret er vores travleste tid, og folk begynder at planlægge renoveringer i februar. Hvis hjemmesiden først er klar i maj, går vi glip af en sæson.","q.A.budget.label":"Budget","q.A.budget.ask":"Hvilket budget har du sat af til projektet?","q.A.budget.help":"Med et budget kan løsningen tilpasses det, du har sat af. Et spænd eller et skøn er helt fint.","q.A.budget.example":"Mellem 60.000 og 80.000 kr. ekskl. moms.","q.A.stakeholders.label":"Hvem der er med, og hvem der godkender","q.A.stakeholders.ask":"Hvem er med i projektet, hvilken rolle har de, og hvem skal godkende tekster og juridiske sider?","q.A.stakeholders.help":"Når det er klart, hvem der godkender hvad, går der mindre tid med at vente på svar. Tænk også på dem, der først kommer ind i billedet til sidst, for eksempel en advokat eller en medejer.","q.A.stakeholders.example":"- Mette Holm, indehaver: godkender alt til sidst\n- Jonas Bak, kontor og kundeservice: daglig kontakt og godkender tekster\n- Lise Dahl, vores advokat: godkender privatlivspolitik og handelsbetingelser","q.A.failure.label":"Hvis projektet slår fejl","q.A.failure.ask":"Hvis projektet om et år blev set som en fiasko, hvad ville grunden så være?","q.A.failure.help":"Svaret viser ofte de bekymringer, der er værd at tage hånd om fra starten.","q.A.failure.example":"Hvis vi har brugt pengene, og telefonen stadig ikke ringer oftere. Eller hvis ingen af os kan finde ud af at opdatere siden selv.","q.B.name.label":"Navn","q.B.name.ask":"Hvad hedder virksomheden, og skal navnet skrives på en bestemt måde?","q.B.name.help":"Navnet bruges på hele hjemmesiden, så stavemåden skal være rigtig, også med store og små bogstaver.","q.B.name.example":"Holm Tømrer og Snedker. Vi skriver altid ordet og, aldrig et &-tegn.","q.B.name-meaning.label":"Historien bag navnet","q.B.name-meaning.ask":"Betyder navnet noget særligt, eller er der en historie bag?","q.B.name-meaning.help":"En god historie bag navnet kan bruges i teksterne. Hvis der ikke er nogen, er det også et fint svar.","q.B.name-meaning.example":"Firmaet er opkaldt efter min far, Erik Holm, som startede det i 1998. Navnet viser, at vi er et familiefirma, hvor kunderne kender den, der kommer ud til dem.","q.B.purpose.label":"Hvorfor virksomheden findes","q.B.purpose.ask":"Hvorfor findes din virksomhed, ud over at tjene penge?","q.B.purpose.help":"Formålet er det, både tekster og udseende skal bygge på. Skriv det, som du ville forklare det for en ny medarbejder.","q.B.purpose.example":"Vi vil gøre det trygt at få håndværkere i huset. Kunderne skal vide, hvad det koster, hvornår vi kommer, og at vi rydder op efter os.","q.B.values.label":"Værdier","q.B.values.ask":"Hvilke værdier lægger virksomheden mest vægt på i det daglige? Nævn gerne tre til fem.","q.B.values.help":"Værdier bliver konkrete, når du skriver, hvad de betyder i praksis. Så er de lettere at vise på hjemmesiden.","q.B.values.example":"- Ærlighed: fast pris, når det er muligt, og besked med det samme, hvis noget ændrer sig\n- Orden: vi rydder op hver dag\n- Faglig stolthed: vi arbejder, som var det vores eget hus","q.B.personality.label":"Virksomhedens personlighed","q.B.personality.ask":"Hvis virksomheden var en person, hvilke fem ord ville så beskrive den?","q.B.personality.help":"Ordene bruges til at ramme den rigtige tone og stemning. Tænk for eksempel på ord som venlig, rolig, direkte, legende, solid, jordnær eller nysgerrig.","q.B.personality.example":"- Ærlig\n- Rolig\n- Jordnær\n- Grundig\n- Venlig","q.B.not-personality.label":"Det, virksomheden ikke er","q.B.not-personality.ask":"Hvilke ord passer slet ikke på virksomheden, selvom andre i branchen måske bruger dem?","q.B.not-personality.help":"Det er lige så nyttigt at vide, hvad der skal undgås. Det kan for eksempel være smart, fornem, billig eller kæk.","q.B.not-personality.example":"- Smart\n- Billig\n- Pralende","q.B.voice-samples.label":"Eksempler på den rigtige tone","q.B.voice-samples.ask":"Har du tekster, der lyder, som virksomheden skal lyde? Det kan være links eller en tekst, du selv har skrevet og er glad for.","q.B.voice-samples.help":"Rigtige eksempler viser tonen bedre end en beskrivelse. Det kan være et opslag på sociale medier, et nyhedsbrev, en e-mail til en kunde eller en anden virksomheds hjemmeside.","q.B.voice-samples.example":"- https://www.example.com/opslag | Vores opslag om lærlingen Ida, som fik mange søde kommentarer\n- Tak, fordi vi måtte bygge dit nye køkken. Vi har ryddet op og lagt en seddel med plejeråd i den øverste skuffe. | Fra den e-mail, vi sender efter hver opgave","q.B.voice-avoid.label":"Ord og vendinger, der skal undgås","q.B.voice-avoid.ask":"Er der ord, vendinger eller en måde at skrive på, som du ikke vil have på hjemmesiden?","q.B.voice-avoid.help":"Det kan være fagudtryk, som kunderne ikke forstår, eller ord, der lyder for meget som reklame.","q.B.voice-avoid.example":"- Fagudtryk uden forklaring, for eksempel rem og lægte\n- Reklameord som drømmekøkken og eksklusiv\n- Engelske ord, når der findes et godt dansk","q.B.assets-status.label":"Logo, farver og skrifttyper i dag","q.B.assets-status.ask":"Har virksomheden allerede et logo, faste farver og skrifttyper, og er det samlet ét sted?","q.B.assets-status.help":"Svaret viser, om arbejdet skal bygge videre på det, der findes, eller starte fra bunden. Begge dele er helt almindeligt.","q.B.assets-status.example":"Vi har et logo og to faste farver, men ingen samlet designmanual.","choice.B.assets-status.guidelines":"Ja, det hele er samlet i en designmanual","choice.B.assets-status.partial":"Noget af det, for eksempel kun et logo","choice.B.assets-status.none":"Nej, ingenting endnu","q.B.logo.label":"Logofiler","q.B.logo.ask":"Kan du sende de logofiler, du har? Skriv gerne, hvad du godt kan lide, og hvad du ikke kan lide ved logoet.","q.B.logo.help":"Send de filer, du har, i den bedste kvalitet, du kan finde. Der er ingen forkerte svar, og du behøver ikke vide, hvilket filformat der er det rigtige.","q.B.logo.example":"- logo-farve.svg | Det logo, vi bruger på biler og arbejdstøj\n- logo-hvid.png | Til mørk baggrund, lidt sløret i kanterne","q.B.fonts.label":"Skrifttyper","q.B.fonts.ask":"Bruger virksomheden bestemte skrifttyper i dag, og hvad synes du om dem?","q.B.fonts.help":"Hvis du ikke kender navnet på skrifttypen, er et billede eller en beskrivelse nok. Der er ingen forkerte svar.","q.B.fonts.example":"Vi bruger skriften fra logoet, men ved ikke, hvad den hedder. Den virker lidt gammeldags og må gerne blive mere moderne.","q.B.colors.label":"Farver","q.B.colors.ask":"Hvilke farver forbinder du med virksomheden, og er der farver, du ikke kan lide?","q.B.colors.help":"Beskriv farverne med dine egne ord, eller send et billede. Der er ingen forkerte svar, og du skal ikke vælge de endelige farver.","q.B.colors.example":"Mørkegrøn som på bilerne og en lys træfarve. Vi bryder os ikke om rød, fordi den minder om tilbudsaviser.","q.B.guidelines.label":"Designmanual og retningslinjer","q.B.guidelines.ask":"Har du en designmanual eller andre retningslinjer for, hvordan virksomheden skal se ud og lyde?","q.B.guidelines.help":"En designmanual samler reglerne for logo, farver og tekster. Hvis du ikke har en, kan du bare springe spørgsmålet over.","q.B.guidelines.example":"- designmanual-2021.pdf | Lavet sammen med logoet, delvist forældet\n- https://www.example.com/presse | Presseside med logoer og farver","q.B.non-negotiables.label":"Det, der ikke må ændres","q.B.non-negotiables.ask":"Er der noget ved virksomhedens udseende eller budskab, som ikke må ændres?","q.B.non-negotiables.help":"Det kan være logoet, en farve, et slogan eller en bestemt måde at tale til kunderne på. Så er rammerne klare fra starten.","q.B.non-negotiables.example":"Logoet og den grønne farve skal blive, fordi de står på alle vores biler. Vores slogan om, at vi rydder op efter os, skal også med.","q.B.admired.label":"Brands, du beundrer","q.B.admired.ask":"Hvilke virksomheder eller brands kan du godt lide, også uden for din branche? Skriv gerne et link og en sætning om, hvad du lægger mærke til.","q.B.admired.help":"Det kan være en butik, et magasin eller en app. Der er ingen forkerte svar, og en mavefornemmelse er lige så god som en lang forklaring.","q.B.admired.example":"- https://www.example.com | Et lokalt bryggeri. Hjemmesiden føles ærlig og hjemmelavet på den gode måde\n- https://www.example.org | En møbelbutik med rolige farver og fotos af rigtige hjem","q.B.never-resemble.label":"Brands, du ikke vil ligne","q.B.never-resemble.ask":"Er der virksomheder eller brands, du aldrig vil forveksles med? Skriv gerne et link og en sætning om hvorfor.","q.B.never-resemble.help":"Det er lige så nyttigt at vide, hvad der skal undgås, som hvad du kan lide. Der er ingen forkerte svar.","q.B.never-resemble.example":"- https://www.example.net | Store kæder med tilbud og nedtælling, det virker stresset\n- https://www.example.com/byg | Meget glat og upersonligt, som om der ikke arbejder rigtige mennesker der","q.B.story.label":"Virksomhedens historie","q.B.story.ask":"Hvordan startede virksomheden, og hvad er der sket siden?","q.B.story.help":"En kort historie giver teksterne liv og gør det lettere for kunderne at lære virksomheden at kende. Nævn gerne et par vigtige år eller episoder.","q.B.story.example":"Erik Holm startede firmaet alene i 1998 med en varevogn og en høvlebænk i garagen. Hans datter Mette overtog i 2015, og i dag er vi ni.","q.B.tension.label":"Det, der skal balanceres","q.B.tension.ask":"Er der noget, virksomheden skal balancere, for eksempel at være både solid og nytænkende?","q.B.tension.help":"Mange virksomheder skal rumme to ting på én gang. Når det er sagt højt, er det lettere at ramme den rette balance.","q.B.tension.example":"Vi er et gammelt håndværksfirma, men vi vil ikke virke støvede. Vi skal fremstå både erfarne og nemme at have med at gøre.","q.C.offers.label":"Produkter og ydelser","q.C.offers.ask":"Hvilke produkter eller ydelser sælger virksomheden?","q.C.offers.help":"Listen bliver grundlaget for, hvilke sider der skal laves. Start med det vigtigste.","q.C.offers.example":"- Nye køkkener og køkkenrenovering\n- Tagrenovering og efterisolering\n- Udskiftning af vinduer og døre","q.C.hero-offer.label":"Det, du helst vil sælge","q.C.hero-offer.ask":"Hvis hjemmesiden kun kunne sælge én ting, hvad skulle det så være?","q.C.hero-offer.help":"Det, du helst vil sælge, får den mest synlige plads, for eksempel øverst på forsiden.","q.C.hero-offer.example":"Køkkenrenovering. Det er der, vi tjener mest, og det er det, vi er bedst til.","q.C.pricing.label":"Priser","q.C.pricing.ask":"Hvordan fastsætter du priserne, og skal de stå på hjemmesiden?","q.C.pricing.help":"Nogle kunder vil gerne kende prisniveauet, før de tager kontakt. Det er også fint at skrive, at priserne ikke skal vises.","q.C.pricing.example":"Vi giver altid et fast tilbud efter et besøg. Vi vil gerne vise eksempler, for eksempel at et typisk køkken koster fra 90.000 kr., men ikke en prisliste.","q.C.catalogue-size.label":"Antal produkter og ydelser","q.C.catalogue-size.ask":"Hvor mange produkter eller ydelser skal vises på hjemmesiden?","q.C.catalogue-size.help":"Antallet afgør, om hver enkelt kan få sin egen side, eller om der skal laves et katalog med filtre og søgning.","q.C.catalogue-size.example":"Omkring seks ydelser og ingen produkter.","choice.C.catalogue-size.under-10":"Under 10","choice.C.catalogue-size.10-100":"Mellem 10 og 100","choice.C.catalogue-size.over-100":"Over 100","choice.C.catalogue-size.none":"Ingen at vise enkeltvis","q.C.change-rate.label":"Hvor ofte udvalget ændrer sig","q.C.change-rate.ask":"Hvor ofte ændrer udvalget eller priserne sig?","q.C.change-rate.help":"Svaret afgør, hvor nemt det skal være selv at rette i produkter og priser.","q.C.change-rate.example":"Et par gange om året, når vi tilføjer en ny ydelse eller justerer priserne.","choice.C.change-rate.rarely":"Sjældent, et par gange om året eller mindre","choice.C.change-rate.monthly":"Cirka en gang om måneden","choice.C.change-rate.weekly":"Cirka en gang om ugen","choice.C.change-rate.daily":"Hver dag","q.C.seasonality.label":"Sæsoner og travle perioder","q.C.seasonality.ask":"Har virksomheden sæsoner eller perioder, hvor der er mere eller mindre travlt?","q.C.seasonality.help":"Sæsoner kan påvirke, hvornår hjemmesiden bør være klar, og hvad den skal fremhæve på forskellige tidspunkter af året.","q.C.seasonality.example":"Mest travlt fra marts til oktober. Om vinteren laver vi mest køkkener og indendørs opgaver.","q.C.proof.label":"Anmeldelser og andre beviser på godt arbejde","q.C.proof.ask":"Hvad kan vise nye kunder, at de kan stole på virksomheden, for eksempel anmeldelser, referencer, certificeringer eller tal?","q.C.proof.help":"Nye kunder kender ikke virksomheden endnu, så konkrete beviser fra andre gør det lettere for dem at tage kontakt.","q.C.proof.example":"- 4,8 ud af 5 stjerner i 140 anmeldelser på en anmeldelsesside\n- Medlem af en garantiordning for håndværkere\n- Fotos og udtalelser fra 12 færdige køkkener","q.C.advantage.label":"Hvorfor kunderne vælger dig","q.C.advantage.ask":"Hvorfor vælger kunderne dig frem for andre?","q.C.advantage.help":"Det er ofte det, der skal stå tydeligst på hjemmesiden. Tænk på, hvad kunderne selv siger, når de roser dig.","q.C.advantage.example":"Vi holder de aftaler, vi laver, og kunderne får en fast kontaktperson fra start til slut. Mange fortæller, at de valgte os, fordi vi var de eneste, der ringede tilbage samme dag.","q.C.fulfilment.label":"Forløbet fra bestilling til levering","q.C.fulfilment.ask":"Hvad sker der, fra en kunde bestiller, til opgaven er løst eller varen er leveret?","q.C.fulfilment.help":"Når forløbet er beskrevet, kan hjemmesiden forklare kunderne, hvad der sker, og hvornår.","q.C.fulfilment.example":"Gratis besøg og opmåling, et fast tilbud inden for en uge, opstart efter to til seks uger og en gennemgang med kunden, når vi er færdige.","q.D.segments.label":"Kundegrupper","q.D.segments.ask":"Hvilke kundegrupper er hjemmesiden først og fremmest til?","q.D.segments.help":"Når kundegrupperne er tydelige, kan tekster og sider tale direkte til dem. Start med den vigtigste.","q.D.segments.example":"- Familier i Aarhus-området, der vil renovere køkken eller bad\n- Ældre boligejere, der har brug for nyt tag eller nye vinduer\n- Små boligforeninger med mindre opgaver","q.D.jobs.label":"Det, kunderne vil have løst","q.D.jobs.ask":"Hvad prøver kunderne at få løst, når de kommer ind på hjemmesiden?","q.D.jobs.help":"En hjemmeside virker bedst, når den hjælper folk med det, de faktisk kom for.","q.D.jobs.example":"- Finde ud af, om vi laver den type opgave, de har\n- Få en idé om pris og ventetid\n- Se eksempler på arbejde, vi har lavet","q.D.questions.label":"Kundernes spørgsmål","q.D.questions.ask":"Hvilke spørgsmål får du oftest fra kunder, før de vælger dig?","q.D.questions.help":"De spørgsmål, du hører igen og igen, er ofte dem, hjemmesiden skal svare på. Tre til fem er en god start.","q.D.questions.example":"- Hvad koster et nyt køkken cirka?\n- Hvor lang ventetid er der, før arbejdet kan begynde?\n- Hvem rydder op bagefter?","q.D.objections.label":"Det, der får kunderne til at tøve","q.D.objections.ask":"Hvad får nogle kunder til at tøve eller vælge en anden?","q.D.objections.help":"Når tvivlen er kendt, kan hjemmesiden svare på den, før den står i vejen.","q.D.objections.example":"- Frygt for, at prisen stiger undervejs\n- Bekymring for larm og støv i hjemmet\n- Tror, vi kun tager store opgaver","q.D.channels.label":"Hvor kunderne finder dig","q.D.channels.ask":"Hvordan finder nye kunder typisk frem til dig i dag?","q.D.channels.help":"Det viser, hvor folk kommer fra, når de besøger hjemmesiden, og hvad de allerede ved.","q.D.channels.example":"De fleste bliver anbefalet af tidligere kunder, og nogle søger efter en tømrer i Aarhus på nettet.","choice.D.channels.search":"Søgning på nettet","choice.D.channels.social":"Sociale medier","choice.D.channels.referral":"Anbefalinger fra andre","choice.D.channels.ads":"Annoncer","choice.D.channels.email":"Nyhedsbreve og e-mail","choice.D.channels.offline":"Uden for nettet, for eksempel skilte og messer","choice.D.channels.partners":"Samarbejdspartnere","choice.D.channels.other":"Andet","q.D.devices.label":"Mobil eller computer","q.D.devices.ask":"Tror du, kunderne mest besøger hjemmesiden på mobilen eller på en computer?","q.D.devices.help":"Et kvalificeret gæt er fint. Hvis du har besøgsstatistik, kan den give svaret.","q.D.devices.example":"Mest på mobilen, tror vi, især om aftenen.","choice.D.devices.mobile":"Mest på mobil","choice.D.devices.desktop":"Mest på computer","choice.D.devices.mixed":"Begge dele","choice.D.devices.unknown":"Ved ikke","q.D.languages.label":"Sprog på hjemmesiden","q.D.languages.ask":"Hvilke sprog skal hjemmesiden findes på?","q.D.languages.help":"Hvert ekstra sprog betyder flere tekster at skrive og holde opdateret, så det er godt at vide fra starten.","q.D.languages.example":"Kun dansk.","choice.D.languages.da":"Dansk","choice.D.languages.en":"Engelsk","choice.D.languages.de":"Tysk","choice.D.languages.sv":"Svensk","choice.D.languages.no":"Norsk","choice.D.languages.other":"Andet","q.D.access.label":"Særlige hensyn til kunderne","q.D.access.ask":"Er der noget ved dine kunder, som hjemmesiden skal tage særligt hensyn til, for eksempel alder, syn eller hvor vant de er til computere?","q.D.access.help":"Svaret påvirker for eksempel tekststørrelse, ordvalg og hvor enkel hjemmesiden skal være at bruge.","q.D.access.example":"Mange af vores kunder er over 60. De skal kunne læse teksten uden at zoome ind og finde telefonnummeret med det samme.","q.D.action.label":"Det, de besøgende skal gøre","q.D.action.ask":"Hvad er det vigtigste, en besøgende skal gøre på hjemmesiden, for eksempel ringe, skrive eller bestille?","q.D.action.help":"Når handlingen er klar, kan hver side bygges op, så den fører derhen. Start med den vigtigste.","q.D.action.example":"- Bestille et gratis besøg\n- Ringe til os\n- Sende fotos af opgaven via en formular","q.D.customer-voice.label":"Kundernes egne ord","q.D.customer-voice.ask":"Hvordan beskriver kunderne selv deres problem eller det, de har brug for?","q.D.customer-voice.help":"Kundernes egne ord gør teksterne lettere at forstå og hjemmesiden lettere at finde, når folk søger på nettet.","q.D.customer-voice.example":"De siger sjældent køkkenrenovering. De siger, at køkkenet er slidt, at skufferne driller, eller at de vil have mere plads til at lave mad sammen.","q.E.competitors.label":"Konkurrenter","q.E.competitors.ask":"Hvem er dine vigtigste konkurrenter? Skriv gerne linket til deres hjemmeside og en sætning om, hvad de gør godt eller dårligt.","q.E.competitors.help":"Konkurrenterne viser, hvad kunderne sammenligner med, og hvor der er plads til at skille sig ud. Tre er en god start.","q.E.competitors.example":"- https://www.example.com | Stort firma med lave priser, men lang ventetid\n- https://www.example.org | Flot hjemmeside med mange fotos af færdige køkkener\n- https://www.example.net | Ligner os meget, men er svære at finde på nettet","q.E.gap.label":"Det, kunderne mangler hos andre","q.E.gap.ask":"Hvad mangler kunderne hos dine konkurrenter, som du kan give dem?","q.E.gap.help":"Det, som ingen andre tilbyder eller siger tydeligt, kan blive hjemmesidens stærkeste budskab.","q.E.gap.example":"Ingen af de andre viser priseksempler eller fortæller, hvordan en renovering foregår fra dag til dag. Det spørger kunderne om hele tiden.","q.E.like.label":"Hjemmesider, du godt kan lide","q.E.like.ask":"Hvilke hjemmesider kan du godt lide, også fra helt andre brancher? Skriv linket og en sætning om, hvad du lægger mærke til, eller hvad du føler, når du ser dem.","q.E.like.help":"Du behøver ikke kunne forklare det med fagord. Der er ingen forkerte svar, og en mavefornemmelse er lige så nyttig som en grundig begrundelse.","q.E.like.example":"- https://www.example.com | Roligt og luftigt, jeg får lyst til at blive og kigge\n- https://www.example.org | Store fotos af rigtige mennesker, det føles ærligt\n- https://www.example.net | Det er let at finde telefonnummeret, og teksterne er korte","q.E.dislike.label":"Hjemmesider, du ikke kan lide","q.E.dislike.ask":"Hvilke hjemmesider bryder du dig ikke om? Skriv linket og en sætning om, hvad du lægger mærke til, eller hvad du føler, når du ser dem.","q.E.dislike.help":"Det, du ikke kan lide, siger lige så meget som det, du kan lide. Der er ingen forkerte svar.","q.E.dislike.example":"- https://www.example.com | For mange tilbud og pop op-vinduer, jeg bliver stresset\n- https://www.example.org | Flot, men jeg kan ikke finde ud af, hvad de egentlig laver","q.E.feel.label":"Sådan skal hjemmesiden føles","q.E.feel.ask":"Hvordan skal folk have det, når de besøger hjemmesiden? Beskriv det gerne med fem ord.","q.E.feel.help":"Der er ingen forkerte svar. Det kan for eksempel være tryg, rolig, varm, enkel, professionel, legende, inspireret eller nysgerrig.","q.E.feel.example":"- Tryg\n- Velkommen\n- Rolig\n- Inspireret\n- Klar til at ringe","q.E.not-feel.label":"Sådan må hjemmesiden ikke føles","q.E.not-feel.ask":"Hvordan må folk ikke have det, når de besøger hjemmesiden?","q.E.not-feel.help":"Der er ingen forkerte svar. Det kan for eksempel være presset, forvirret, overvældet, usikker eller snydt.","q.E.not-feel.example":"- Presset til at købe\n- Forvirret\n- Usikker på prisen","q.E.imagery.label":"Billeder og video","q.E.imagery.ask":"Hvilke slags billeder kan du bedst lide på en hjemmeside som din?","q.E.imagery.help":"Vælg det, der føles rigtigt for dig. Der er ingen forkerte svar, og du kan vælge flere.","q.E.imagery.example":"Fotos af vores folk i arbejde og af færdige køkkener. Gerne en kort video af et køkken, der bliver bygget.","choice.E.imagery.photos-people":"Fotos af mennesker","choice.E.imagery.photos-product":"Fotos af produkter","choice.E.imagery.photos-place":"Fotos af steder og omgivelser","choice.E.imagery.illustration":"Tegninger og illustrationer","choice.E.imagery.abstract":"Mønstre, former og farveflader","choice.E.imagery.video":"Video","choice.E.imagery.none":"Ingen eller meget få billeder","q.E.density.label":"Meget eller lidt på hver side","q.E.density.ask":"Kan du bedst lide hjemmesider med god luft og få ting ad gangen, eller med meget information samlet?","q.E.density.help":"Tænk på de hjemmesider, du selv bruger og er glad for. Der er ingen forkerte svar.","q.E.density.example":"Roligt med god luft. Kunderne skal ikke drukne i tekst.","choice.E.density.calm":"Roligt med god luft","choice.E.density.balanced":"Et sted midt imellem","choice.E.density.dense":"Meget information samlet","q.E.design-musts.label":"Andre ønsker til udseendet","q.E.design-musts.ask":"Er der andet, du ønsker dig eller vil undgå, når det gælder hjemmesidens udseende?","q.E.design-musts.help":"Det kan være små ting, du har lagt mærke til andre steder. Der er ingen forkerte svar, og du behøver ikke bruge fagord.","q.E.design-musts.example":"Telefonnummeret skal kunne ses hele tiden. Jeg kan ikke lide tekst, der langsomt dukker op, når man ruller ned.","q.F.existing-content.label":"Indhold, der findes i forvejen","q.F.existing-content.ask":"Hvilket indhold har du allerede, som kan bruges på den nye hjemmeside?","q.F.existing-content.help":"Det, der allerede findes, sparer tid og penge. Det behøver ikke være færdigt eller perfekt.","q.F.existing-content.example":"Tekster fra den gamle hjemmeside, en del fotos af færdige opgaver og nogle udtalelser fra kunder.","choice.F.existing-content.texts":"Tekster","choice.F.existing-content.photos":"Fotos","choice.F.existing-content.video":"Video","choice.F.existing-content.testimonials":"Udtalelser fra kunder","choice.F.existing-content.documents":"Dokumenter, for eksempel brochurer eller prislister","choice.F.existing-content.none":"Ingenting endnu","q.F.photos.label":"Fotos","q.F.photos.ask":"Har du gode fotos, der kan bruges på hjemmesiden?","q.F.photos.help":"Fotos betyder meget for, hvordan hjemmesiden opleves. Der er ingen forkerte svar, og det er helt normalt at have fotos af blandet kvalitet.","q.F.photos.example":"Vi har mange mobilfotos af vores arbejde og et par professionelle billeder af holdet fra sidste år.","choice.F.photos.professional":"Ja, professionelle fotos","choice.F.photos.some":"Nogle, men af blandet kvalitet","choice.F.photos.none":"Nej, ingen brugbare fotos","choice.F.photos.unknown":"Ved ikke","q.F.copywriter.label":"Hvem der skriver teksterne","q.F.copywriter.ask":"Hvem skal skrive teksterne til den nye hjemmeside?","q.F.copywriter.help":"Tekster tager ofte længere tid end ventet, så det er godt at aftale tidligt, hvem der står for dem.","q.F.copywriter.example":"Vi skriver selv udkast, men vil gerne have hjælp til at gøre dem kortere og bedre.","choice.F.copywriter.client":"Du eller nogen i din virksomhed","choice.F.copywriter.team":"Holdet, der bygger hjemmesiden","choice.F.copywriter.mixed":"En blanding af begge","choice.F.copywriter.undecided":"Ikke besluttet endnu","q.F.volume.label":"Mængden af indhold","q.F.volume.ask":"Hvor meget indhold forventer du, for eksempel antal sider, artikler eller fotos?","q.F.volume.help":"Et groft skøn er nok. Det hjælper med at vurdere, hvor lang tid det tager at lave indholdet og lægge det på plads.","q.F.volume.example":"Omkring 15 sider, 20 eksempler på opgaver med fotos og et par artikler om året.","q.F.migration.label":"Indhold fra den gamle hjemmeside","q.F.migration.ask":"Hvad skal flyttes med fra den nuværende hjemmeside, og hvad kan slettes?","q.F.migration.help":"Det tager tid at flytte indhold, og de gamle adresser kan have betydning for, at folk stadig kan finde dig på nettet. Skriv det, du ved, og lad resten vente til senere.","q.F.migration.example":"Alle eksempler på opgaver og siden om tagrenovering skal med. Nyhederne fra før 2020 kan slettes.","q.F.rights.label":"Rettigheder til fotos, skrifttyper og tekster","q.F.rights.ask":"Hvem ejer de fotos, skrifttyper og tekster, du vil bruge, eller har du tilladelse til at bruge dem på nettet?","q.F.rights.help":"Fotos og skrifttyper fra nettet må ofte ikke bruges uden en licens, altså en tilladelse, der kan koste penge. Det er lettere at afklare nu end at skulle skifte dem ud senere.","q.F.rights.example":"Fotos af opgaverne har vi selv taget. Billederne af holdet er taget af en fotograf, og vi har lov til at bruge dem på hjemmesiden. Vi ved ikke, om vi har licens til skriften i logoet.","q.F.sensitive.label":"Følsomt indhold","q.F.sensitive.ask":"Er der indhold, der er følsomt eller kun må vises for bestemte personer?","q.F.sensitive.help":"Det kan for eksempel være fotos fra kunders hjem, interne priser eller oplysninger om ansatte. Så kan det beskyttes eller holdes ude fra starten.","q.F.sensitive.example":"Fotos fra kunders hjem må kun vises, når kunden har sagt ja, og uden husnummer eller navne.","q.G.pages.label":"Sider på hjemmesiden","q.G.pages.ask":"Hvilke sider forestiller du dig, at hjemmesiden skal have?","q.G.pages.help":"Et første bud er nok. Listen bliver justeret undervejs.","q.G.pages.example":"- Forside\n- En side for hver ydelse\n- Kontakt og bestilling af besøg","q.G.features.label":"Funktioner","q.G.features.ask":"Hvilke funktioner skal hjemmesiden have, for eksempel kontaktformular, booking eller webshop?","q.G.features.help":"Funktioner påvirker både pris og tid. Vælg det, der skal med fra start, og skriv eventuelle ønsker til senere i en note.","q.G.features.example":"En kontaktformular, hvor kunden kan sende fotos, et galleri med vores opgaver og et kort over, hvor vi arbejder.","choice.G.features.contact-form":"Kontaktformular","choice.G.features.booking":"Booking af tider","choice.G.features.shop":"Webshop","choice.G.features.search":"Søgefunktion","choice.G.features.blog":"Blog eller nyheder","choice.G.features.members":"Login for kunder eller medlemmer","choice.G.features.multilingual":"Flere sprog","choice.G.features.calculator":"Prisberegner eller anden beregner","choice.G.features.map":"Kort","choice.G.features.newsletter":"Tilmelding til nyhedsbrev","choice.G.features.gallery":"Galleri","choice.G.features.other":"Andet","q.G.integrations.label":"Systemer, hjemmesiden skal hænge sammen med","q.G.integrations.ask":"Er der andre systemer, som hjemmesiden skal hænge sammen med, for eksempel kalender, regnskab, nyhedsbrev eller kundekartotek?","q.G.integrations.help":"Forbindelser til andre systemer tager ofte ekstra tid, så det er godt at kende dem tidligt. Navnet på systemet er nok.","q.G.integrations.example":"- Vores kalender til besøg\n- Det system, vi sender tilbud og fakturaer fra\n- Vores side på sociale medier","q.G.out-of-scope.label":"Det, der ikke er med denne gang","q.G.out-of-scope.ask":"Er der noget, som bevidst ikke skal med i denne omgang?","q.G.out-of-scope.help":"En klar grænse gør det lettere at holde tid og budget. Det, der står her, kan sagtens komme med senere.","q.G.out-of-scope.example":"- Webshop\n- Tysk udgave\n- Login for kunder","q.G.priorities.label":"Det vigtigste, hvis der skal vælges","q.G.priorities.ask":"Hvis tid eller budget bliver stramt, hvad er så det vigtigste at få med?","q.G.priorities.help":"En liste i prioriteret rækkefølge gør det lettere at træffe gode valg undervejs, uden at du skal spørges hver gang.","q.G.priorities.example":"- Det skal være let at bestille et besøg\n- Gode fotos af vores arbejde\n- Siderne for hver ydelse","q.G.multilingual.label":"Indhold på flere sprog","q.G.multilingual.ask":"Hvis hjemmesiden skal findes på flere sprog, skal alle sprog så have det samme indhold, eller skal noget være forskelligt?","q.G.multilingual.help":"Det samme indhold på alle sprog er det enkleste. Forskelligt indhold giver mere frihed, men også mere at holde opdateret.","q.G.multilingual.example":"Hvis vi en dag får en tysk udgave, skal den have det samme indhold som den danske.","choice.G.multilingual.same-structure":"Samme indhold på alle sprog","choice.G.multilingual.separate-content":"Forskelligt indhold på hvert sprog","choice.G.multilingual.unsure":"Ved ikke","q.G.content-types.label":"Typer af indhold","q.G.content-types.ask":"Er der indhold, der går igen i samme form mange gange, for eksempel opgaver, medarbejdere, arrangementer eller produkter?","q.G.content-types.help":"Indhold, der gentager sig, kan få en fast skabelon. Det gør det lettere at tilføje nyt og holde det ensartet.","q.G.content-types.example":"- Eksempler på opgaver med fotos, sted og type\n- Medarbejdere med foto og fagområde","q.H.editing-needs.label":"Hvor meget du selv vil kunne ændre","q.H.editing-needs.ask":"Hvor meget skal du eller dine kolleger selv kunne ændre på hjemmesiden, når den er i luften?","q.H.editing-needs.help":"Svaret afgør, hvor nemt det skal være at rette i indholdet, og hvilken løsning der passer bedst.","q.H.editing-needs.example":"Vi vil gerne selv kunne tilføje nye opgaver og rette åbningstiderne et par gange om måneden.","choice.H.editing-needs.nobody":"Ingenting, andre klarer det","choice.H.editing-needs.occasional":"Små rettelser en gang imellem","choice.H.editing-needs.regular":"Jævnlige opdateringer, for eksempel nyheder eller opgaver","choice.H.editing-needs.restructure":"Også nye sider og ændringer i opbygningen","q.H.who-edits.label":"Hvem der skal opdatere hjemmesiden","q.H.who-edits.ask":"Hvem skal opdatere hjemmesiden, og hvor vant er de til den slags arbejde?","q.H.who-edits.help":"Det er godt at vide, om det er én person eller flere, og hvor meget hjælp de har brug for. Så kan løsningen gøres tilpas enkel.","q.H.who-edits.example":"Jonas på kontoret. Han har opdateret den gamle hjemmeside, men synes, det er besværligt.","q.H.approval.label":"Godkendelse af ændringer","q.H.approval.ask":"Skal nogen godkende ændringer, før de bliver synlige på hjemmesiden?","q.H.approval.help":"Hvis der skal være en godkendelse, kan der laves et trin, hvor ændringer bliver set igennem først.","q.H.approval.example":"Nej, Jonas må selv lægge ting ud. Prisændringer skal dog godkendes af Mette.","q.H.roles.label":"Hvem der må hvad","q.H.roles.ask":"Skal forskellige personer have forskellig adgang, for eksempel nogle, der kun må skrive udkast?","q.H.roles.help":"Det er kun relevant, hvis flere skal arbejde på hjemmesiden. Ellers kan du springe spørgsmålet over.","q.H.roles.example":"- Mette: må alt\n- Jonas: må rette tekster og tilføje opgaver\n- Lærlinge: må kun lægge fotos op","q.H.preview.label":"Se ændringer, før de bliver synlige","q.H.preview.ask":"Er det vigtigt at kunne se, hvordan en ændring ser ud, før den bliver synlig for alle?","q.H.preview.help":"En forhåndsvisning giver tryghed, især hvis flere retter i indholdet.","q.H.preview.example":"Ja, det vil gøre Jonas mere tryg ved selv at rette.","choice.H.preview.yes":"Ja","choice.H.preview.no":"Nej","choice.H.preview.unsure":"Ved ikke","q.H.maintenance.label":"Vedligeholdelse","q.H.maintenance.ask":"Hvem skal sørge for, at hjemmesiden bliver opdateret og holdt sikker, når den er færdig?","q.H.maintenance.help":"En hjemmeside skal opdateres teknisk og passes på, lidt ligesom en bil skal til service. Det er godt at aftale fra starten, hvem der gør det.","q.H.maintenance.example":"Vi vil gerne have en fast aftale med dem, der bygger hjemmesiden.","choice.H.maintenance.client":"Du eller nogen i din virksomhed","choice.H.maintenance.team":"Holdet, der bygger hjemmesiden","choice.H.maintenance.agency":"Et andet bureau eller en freelancer","choice.H.maintenance.none":"Ingen fast aftale","choice.H.maintenance.undecided":"Ikke besluttet endnu","q.I.domain.label":"Domænenavn","q.I.domain.ask":"Hvilket domænenavn skal hjemmesiden have, og hvem har adgang til at styre det?","q.I.domain.help":"Domænenavnet er hjemmesidens adresse, den del, der står efter www. Uden adgang til domænet kan hjemmesiden hverken flyttes eller gå i luften, så det er godt at vide, hvem der ejer det og har login.","q.I.domain.example":"holmtomrer.dk. Domænet står i Mettes navn, men det er vores gamle webbureau, der har login.","q.I.dns-contact.label":"Hvem der kan ændre domænets indstillinger","q.I.dns-contact.ask":"Hvem kan ændre de tekniske indstillinger for domænet, hvis det bliver nødvendigt?","q.I.dns-contact.help":"Når hjemmesiden skal i luften, skal domænets indstillinger, de såkaldte DNS-indstillinger, ofte ændres. Det går hurtigere, når det er klart, hvem der kan gøre det.","q.I.dns-contact.example":"Kasper fra det firma, der passer vores e-mail og computere.","q.I.hosting.label":"Webhotel i dag","q.I.hosting.ask":"Hvilket firma står i dag for at drive din hjemmeside, og er der en aftale, der binder dig?","q.I.hosting.help":"Det kaldes også webhotel eller hosting, og en løbende aftale kan påvirke, hvornår der kan skiftes. Hvis der ikke er noget i dag, er det også et fint svar.","q.I.hosting.example":"Den ligger hos vores gamle webbureau. Aftalen løber til udgangen af juni med tre måneders opsigelse.","q.I.existing-stack.label":"Systemer, der bruges i dag","q.I.existing-stack.ask":"Hvilket system er den nuværende hjemmeside lavet i, og er der andre systemer, der skal fortsætte?","q.I.existing-stack.help":"Svaret viser, hvad der skal tages hensyn til eller flyttes. Hvis du ikke kender navnet, er det helt fint at springe over.","q.I.existing-stack.example":"WordPress, tror jeg. Vi bruger også et bookingsystem til besøg, som vi gerne vil beholde.","q.I.personal-data.label":"Personoplysninger","q.I.personal-data.ask":"Hvilke oplysninger om personer skal hjemmesiden indsamle, for eksempel navn, telefonnummer, adresse eller betaling?","q.I.personal-data.help":"Reglerne for persondata, også kaldet GDPR, bestemmer, hvordan oplysninger om personer skal beskyttes og forklares. Derfor er det godt at vide fra starten, hvad hjemmesiden skal indsamle.","q.I.personal-data.example":"Navn, telefonnummer, adresse og de fotos, kunden sender via kontaktformularen.","choice.I.personal-data.none":"Ingen","choice.I.personal-data.contact-forms":"Kontaktformularer, for eksempel navn og telefonnummer","choice.I.personal-data.accounts":"Brugerkonti med login","choice.I.personal-data.payments":"Betalinger","choice.I.personal-data.other":"Andet","q.I.cookies-analytics.label":"Cookies og besøgsstatistik","q.I.cookies-analytics.ask":"Vil du gerne kunne se statistik over, hvordan hjemmesiden bliver brugt?","q.I.cookies-analytics.help":"Cookies er små filer, der gemmes i den besøgendes browser og ofte bruges til statistik og annoncer. Mange typer kræver, at den besøgende siger ja først, men der findes også enkel statistik, der ikke gør.","q.I.cookies-analytics.example":"Ja, men helst uden at de besøgende skal klikke ja til cookies, hvis det kan lade sig gøre.","choice.I.cookies-analytics.none":"Ingen statistik","choice.I.cookies-analytics.privacy-friendly":"Enkel statistik, der tager hensyn til privatlivet","choice.I.cookies-analytics.standard":"Almindelig statistik med samtykke til cookies","choice.I.cookies-analytics.undecided":"Ikke besluttet endnu","q.I.legal-pages.label":"Juridiske sider","q.I.legal-pages.ask":"Hvilke juridiske sider skal hjemmesiden have, for eksempel privatlivspolitik eller handelsbetingelser?","q.I.legal-pages.help":"Hvilke sider der kræves, afhænger af, hvad hjemmesiden gør. Hvis du allerede har nogle af teksterne, kan du skrive det i en note.","q.I.legal-pages.example":"En privatlivspolitik og en cookiepolitik. Vi har ingen af dem i dag.","choice.I.legal-pages.privacy":"Privatlivspolitik","choice.I.legal-pages.cookies":"Cookiepolitik","choice.I.legal-pages.terms":"Handelsbetingelser","choice.I.legal-pages.imprint":"Virksomhedsoplysninger, for eksempel CVR-nummer og adresse","choice.I.legal-pages.accessibility-statement":"Tilgængelighedserklæring","choice.I.legal-pages.none":"Ingen","choice.I.legal-pages.unsure":"Ved ikke","q.I.regulation.label":"Særlige regler i branchen","q.I.regulation.ask":"Er der regler i din branche, som hjemmesiden skal overholde, for eksempel om reklame, priser eller garantier?","q.I.regulation.help":"Nogle brancher har særlige krav til, hvad der må stå, og hvordan. Hvis du ikke kender til nogen, er det også et fint svar.","q.I.regulation.example":"Vi skal oplyse priser inklusive moms til private kunder og beskrive vores garantiordning korrekt.","q.I.accessibility.label":"Tilgængelighed","q.I.accessibility.ask":"Har du særlige krav til, at hjemmesiden kan bruges af alle, også af personer med nedsat syn, hørelse eller bevægelighed?","q.I.accessibility.help":"Tilgængelighed betyder, at alle kan bruge hjemmesiden, også med for eksempel skærmlæser eller kun tastatur. Den almindelige standard er et godt udgangspunkt, og offentlige myndigheder og nogle virksomheder er underlagt lovkrav.","q.I.accessibility.example":"Den almindelige standard er fin for os.","choice.I.accessibility.aa-default":"Den almindelige standard (anbefalet)","choice.I.accessibility.public-sector":"Offentlig organisation med lovkrav","choice.I.accessibility.higher":"Højere krav end det almindelige","choice.I.accessibility.unsure":"Ved ikke","q.I.seo.label":"Synlighed i søgemaskiner","q.I.seo.ask":"Hvad skal folk søge efter på nettet for at finde dig?","q.I.seo.help":"Arbejdet med at blive fundet i Google og andre søgemaskiner kaldes SEO, og dit svar er udgangspunktet for det. Skriv gerne de ord og steder, kunderne bruger, når de søger.","q.I.seo.example":"Tømrer Aarhus, køkkenrenovering Aarhus og nyt tag Østjylland. Vi vil især gerne findes af folk i Aarhus og omegn.","q.I.performance.label":"Hastighed","q.I.performance.ask":"Er der noget, der gør, at hjemmesiden skal være ekstra hurtig, for eksempel kunder med dårlig forbindelse?","q.I.performance.help":"Alle hjemmesider bør være hurtige. Svaret viser, om der er grund til at gøre noget ekstra.","q.I.performance.example":"Mange kunder ser siden på mobilen ude på landet, hvor forbindelsen kan være dårlig.","q.I.browsers.label":"Enheder og browsere","q.I.browsers.ask":"Er der bestemte browsere, telefoner eller computere, som hjemmesiden skal virke særligt godt på?","q.I.browsers.help":"Hjemmesiden kommer til at virke i de almindelige browsere. Svaret er kun vigtigt, hvis dine kunder bruger noget særligt, for eksempel gamle computere.","q.I.browsers.example":"Ikke noget særligt. Nogle af de ældre kunder bruger en gammel tablet.","q.I.data-location.label":"Hvor data opbevares","q.I.data-location.ask":"Har du krav om, hvor data fra hjemmesiden må opbevares, for eksempel kun i EU?","q.I.data-location.help":"Nogle virksomheder vil eller skal have deres data opbevaret i EU. Hvis du ikke har et krav, er det også et fint svar.","q.I.data-location.example":"Helst i EU.","choice.I.data-location.eu":"Kun i EU","choice.I.data-location.any":"Ingen krav","choice.I.data-location.specific":"Et bestemt land eller sted","q.I.email.label":"E-mail","q.I.email.ask":"Hvordan er din e-mail sat op i dag, og hænger den sammen med domænet?","q.I.email.help":"E-mail og hjemmeside deler ofte domæne. Når det er kendt, hvor e-mailen ligger, undgår man, at den holder op med at virke, når hjemmesiden flyttes.","q.I.email.example":"Vi har e-mail på vores eget domæne hos samme firma som webhotellet. Den skal bare blive ved med at virke.","q.J.contact.label":"Kontaktperson","q.J.contact.ask":"Hvem er den daglige kontaktperson i projek
