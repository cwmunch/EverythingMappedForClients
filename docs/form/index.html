<script type="application/json" id="emfc-texts-en">{"file.brief.title":"Project brief","file.brief.intro":"This part covers your business, the goal of the project and how the work will be organised. It takes about 20 minutes.","file.brand.title":"Brand","file.brand.intro":"This part gathers what makes your business recognisable: name, values, tone, logo and colours. It takes about 20 minutes.","file.audience.title":"Audience and competitors","file.audience.intro":"This part describes who the website is for, who you compete with and how the website should feel. It takes about 30 minutes.","file.content.title":"Products and content","file.content.intro":"This part covers what you sell and which texts, images and other files and material already exist. It takes about 20 minutes.","file.scope.title":"Scope and structure","file.scope.intro":"This part sets out which pages and features the website needs and who will update it afterwards. It takes about 15 minutes.","file.technical.title":"Technical and legal basics","file.technical.intro":"This part collects practical details about the domain name, hosting, personal data and legal requirements. It takes about 10 minutes, and you do not need to know the technical details to answer.","module.A.title":"Your business and the project","module.A.intro":"A short description of your business, why the project is happening now and what it should lead to. It takes about 15 minutes.","module.B.title":"Your brand","module.B.intro":"Name, purpose, personality and tone, and what exists in terms of logo, fonts and colours. It takes about 20 minutes.","module.C.title":"Products and services","module.C.intro":"What you sell, what matters most to sell and why customers choose you. It takes about 10 minutes.","module.D.title":"Your audience","module.D.intro":"Who the website is for, what they are looking for and what they should do when they visit. It takes about 15 minutes.","module.E.title":"Competitors and inspiration","module.E.intro":"Who you compete with, which websites you like or dislike, and how your own should feel. It takes about 15 minutes.","module.F.title":"Texts, images and other material","module.F.intro":"Which texts, photos and other files and material already exist, and who will write the new texts. It takes about 10 minutes.","module.G.title":"Pages and features","module.G.intro":"Which pages and features the website needs, and what is left out this time. It takes about 10 minutes.","module.H.title":"Updates and maintenance","module.H.intro":"Who will change and add content once the website is live, and who will look after it. It takes about 5 minutes.","module.I.title":"Technical setup, data and rules","module.I.intro":"Domain name, hosting, personal data, cookies and accessibility. It takes about 10 minutes, and it is fine to mark anything you do not know as something to clarify later.","module.J.title":"Working together","module.J.intro":"Who the main contact is, when you have time to give feedback and anything else worth knowing. It takes about 5 minutes.","q.A.business.label":"Your business in brief","q.A.business.ask":"How would you describe your business to someone who has never heard of it? Feel free to say what it does, who it is for and where.","q.A.business.help":"This gives a shared starting point for everything else. A few sentences in your own words are enough.","q.A.business.example":"Ellis Carpentry and Joinery is a carpentry firm with nine employees. We renovate kitchens, roofs and windows for homeowners in and around Millbrook and have done so since 1998.","q.A.project-kind.label":"Type of project","q.A.project-kind.ask":"What kind of project is this: a new website, a new version of the one you have, or something else?","q.A.project-kind.help":"The type decides what to look at first, for example whether content needs to be moved from an old website.","q.A.project-kind.example":"A new version of our current website, which is eight years old.","choice.A.project-kind.new-site":"New website","choice.A.project-kind.redesign":"New version of an existing website","choice.A.project-kind.landing-page":"A single page for a campaign or product","choice.A.project-kind.small-app":"A small app","choice.A.project-kind.other":"Something else","q.A.existing-site.label":"Your current website","q.A.existing-site.ask":"What is the address of your current website? Feel free to note what works well and what does not.","q.A.existing-site.help":"The current website shows what should be kept and what needs to improve.","q.A.existing-site.example":"- https://www.example.com | Customers find us, but the site is hard to use on a phone\n- https://www.example.com/gallery | The photos of our work are what people look at most","q.A.why-now.label":"Why now","q.A.why-now.ask":"What has made you start this project right now?","q.A.why-now.help":"The reason says a lot about what is urgent and what should be solved first.","q.A.why-now.example":"We have hired two new carpenters and have room for more work. The old website brings in almost no enquiries, and it does not show what we can do today.","q.A.goal.label":"Main goal","q.A.goal.ask":"What is the most important thing the website should achieve for your business?","q.A.goal.help":"A clear goal makes it easier to decide what should get the most space and what can wait.","q.A.goal.example":"To get more enquiries from homeowners so that our calendar is full two months ahead.","q.A.metrics.label":"Numbers that show it works","q.A.metrics.ask":"Which numbers would you like to see change, and where are they today?","q.A.metrics.help":"Knowing today's number makes it possible to see later whether the new website makes a difference. An estimate is fine if you do not have exact figures.","q.A.metrics.example":"- Enquiries through the website: about 6 a month today, ideally 15\n- Share of enquiries that become jobs: about 30 per cent today\n- Visitors per month: about 800 today","q.A.deadline.label":"Target launch date","q.A.deadline.ask":"When should the website be live at the latest?","q.A.deadline.help":"The date decides how much can be done and what may need to wait. Give the date you are aiming for, even if it might move.","q.A.deadline.example":"1 March 2027","q.A.deadline-reason.label":"Reason for the date","q.A.deadline-reason.ask":"What makes that date important, and what happens if it slips?","q.A.deadline-reason.help":"Some dates are fixed and others are wishes. It helps to know where there is room to move.","q.A.deadline-reason.example":"Spring is our busiest time, and people start planning renovations in February. If the website is only ready in May, we miss a season.","q.A.budget.label":"Budget","q.A.budget.ask":"What budget have you set aside for the project?","q.A.budget.help":"A budget makes it possible to fit the solution to what you have set aside. A range or an estimate is fine.","q.A.budget.example":"Between 8,000 and 11,000 euros, excluding VAT.","q.A.stakeholders.label":"People involved and who approves","q.A.stakeholders.ask":"Who is involved in the project, what is their role, and who needs to approve texts and legal pages?","q.A.stakeholders.help":"When it is clear who approves what, less time is spent waiting for answers. Include people who only come in at the end, such as a lawyer or a co-owner.","q.A.stakeholders.example":"- Sarah Ellis, owner: gives final approval on everything\n- Daniel Price, office and customer service: day-to-day contact, approves texts\n- Priya Shah, our lawyer: approves the privacy policy and terms of sale","q.A.failure.label":"What failure would look like","q.A.failure.ask":"If the project were seen as a failure a year from now, what would the reason be?","q.A.failure.help":"The answer often reveals concerns that are worth dealing with from the start.","q.A.failure.example":"If we have spent the money and the phone still does not ring more often. Or if none of us can work out how to update the site ourselves.","q.B.name.label":"Name","q.B.name.ask":"What is the name of the business, and should it be written in a particular way?","q.B.name.help":"The name appears across the whole website, so the spelling needs to be right, including capital letters.","q.B.name.example":"Ellis Carpentry and Joinery. We always write the word and, never an & sign.","q.B.name-meaning.label":"The story behind the name","q.B.name-meaning.ask":"Does the name mean something special, or is there a story behind it?","q.B.name-meaning.help":"A good story behind the name can be used in the texts. If there is none, that is a fine answer too.","q.B.name-meaning.example":"The firm is named after my father, Peter Ellis, who started it in 1998. The name shows that we are a family business where customers know the person who comes to their home.","q.B.purpose.label":"Why the business exists","q.B.purpose.ask":"Why does your business exist, beyond making money?","q.B.purpose.help":"The purpose is what both the texts and the look of the website build on. Write it the way you would explain it to a new employee.","q.B.purpose.example":"We want to make it feel safe to have tradespeople in your home. Customers should know what it costs, when we arrive and that we clean up after ourselves.","q.B.values.label":"Values","q.B.values.ask":"Which values matter most in the way your business works day to day? Three to five is a good number.","q.B.values.help":"Values become concrete when you write what they mean in practice. That makes them easier to show on the website.","q.B.values.example":"- Honesty: a fixed price whenever possible, and we tell you straight away if something changes\n- Tidiness: we clean up every day\n- Pride in the craft: we work as if it were our own house","q.B.personality.label":"Personality of the business","q.B.personality.ask":"If your business were a person, which five words would describe it?","q.B.personality.help":"The words help set the right tone and mood. Think of words such as friendly, calm, direct, playful, solid, down to earth or curious.","q.B.personality.example":"- Honest\n- Calm\n- Down to earth\n- Thorough\n- Friendly","q.B.not-personality.label":"What the business is not","q.B.not-personality.ask":"Which words do not fit your business at all, even if others in your industry use them?","q.B.not-personality.help":"Knowing what to avoid is just as useful. Examples could be flashy, posh, cheap or cheeky.","q.B.not-personality.example":"- Flashy\n- Cheap\n- Boastful","q.B.voice-samples.label":"Examples of the right tone","q.B.voice-samples.ask":"Do you have texts that sound the way your business should sound? They can be links, or a text you wrote yourself and like.","q.B.voice-samples.help":"Real examples show the tone better than a description. It could be a social media post, a newsletter, an email to a customer or another business's website.","q.B.voice-samples.example":"- https://www.example.com/post | Our post about our apprentice Emma, which got lots of kind comments\n- Thank you for letting us build your new kitchen. We have cleaned up and left a note with care tips in the top drawer. | From the email we send after every job","q.B.voice-avoid.label":"Words and phrases to avoid","q.B.voice-avoid.ask":"Are there words, phrases or ways of writing that you do not want on the website?","q.B.voice-avoid.help":"It could be trade terms that customers do not understand, or words that sound too much like advertising.","q.B.voice-avoid.example":"- Trade terms without an explanation, such as joist or batten\n- Advertising words like dream kitchen and exclusive\n- Long, complicated sentences","q.B.assets-status.label":"Logo, colours and fonts today","q.B.assets-status.ask":"Does your business already have a logo, set colours and fonts, and are they collected in one place?","q.B.assets-status.help":"The answer shows whether the work builds on what exists or starts from scratch. Both are perfectly normal.","q.B.assets-status.example":"We have a logo and two set colours, but no brand guide.","choice.B.assets-status.guidelines":"Yes, everything is collected in a brand guide","choice.B.assets-status.partial":"Some of it, for example only a logo","choice.B.assets-status.none":"No, nothing yet","q.B.logo.label":"Logo files","q.B.logo.ask":"Could you send the logo files you have? Feel free to say what you like and dislike about the logo.","q.B.logo.help":"Send the files you have in the best quality you can find. There are no wrong answers, and you do not need to know which file format is the right one.","q.B.logo.example":"- logo-colour.svg | The logo we use on our vans and work clothes\n- logo-white.png | For dark backgrounds, a bit blurry at the edges","q.B.fonts.label":"Fonts","q.B.fonts.ask":"Does your business use particular fonts today, and what do you think of them?","q.B.fonts.help":"If you do not know the name of the font, a picture or a description is enough. There are no wrong answers.","q.B.fonts.example":"We use the lettering from our logo, but we do not know what it is called. It looks a bit old-fashioned and could be more modern.","q.B.colors.label":"Colours","q.B.colors.ask":"Which colours do you connect with your business, and are there colours you dislike?","q.B.colors.help":"Describe the colours in your own words or send a picture. There are no wrong answers, and you do not have to choose the final colours.","q.B.colors.example":"Dark green like our vans and a light wood colour. We do not like red, because it reminds us of discount flyers.","q.B.guidelines.label":"Brand guide and guidelines","q.B.guidelines.ask":"Do you have a brand guide or other guidelines for how your business should look and sound?","q.B.guidelines.help":"A brand guide collects the rules for logo, colours and texts. If you do not have one, simply skip this question.","q.B.guidelines.example":"- brand-guide-2021.pdf | Made together with the logo, partly out of date\n- https://www.example.com/press | Press page with logos and colours","q.B.non-negotiables.label":"What must not change","q.B.non-negotiables.ask":"Is there anything about how your business looks or what it says that must not change?","q.B.non-negotiables.help":"It could be the logo, a colour, a slogan or a particular way of speaking to customers. That way the limits are clear from the start.","q.B.non-negotiables.example":"The logo and the green colour must stay, because they are on all our vans. Our slogan about cleaning up after ourselves must stay too.","q.B.admired.label":"Brands you admire","q.B.admired.ask":"Which businesses or brands do you like, also outside your industry? Feel free to add a link and a sentence about what you notice.","q.B.admired.help":"It could be a shop, a magazine or an app. There are no wrong answers, and a gut feeling is just as good as a long explanation.","q.B.admired.example":"- https://www.example.com | A local brewery. Their website feels honest and homemade in a good way\n- https://www.example.org | A furniture shop with calm colours and photos of real homes","q.B.never-resemble.label":"Brands you do not want to resemble","q.B.never-resemble.ask":"Are there businesses or brands you never want to be confused with? Feel free to add a link and a sentence about why.","q.B.never-resemble.help":"Knowing what to avoid is just as useful as knowing what you like. There are no wrong answers.","q.B.never-resemble.example":"- https://www.example.net | Big chains with special offers and countdowns, it feels stressful\n- https://www.example.com/build | Very slick and impersonal, as if no real people work there","q.B.story.label":"The story of the business","q.B.story.ask":"How did the business start, and what has happened since?","q.B.story.help":"A short story brings the texts to life and makes it easier for customers to get to know the business. Feel free to mention a few key years or moments.","q.B.story.example":"Peter Ellis started the firm on his own in 1998 with a van and a workbench in the garage. His daughter Sarah took over in 2015, and today there are nine of us.","q.B.tension.label":"What needs to be balanced","q.B.tension.ask":"Is there something your business needs to balance, for example being both solid and forward-thinking?","q.B.tension.help":"Many businesses need to hold two things at once. Once it is said out loud, it is easier to strike the right balance.","q.B.tension.example":"We are an old craft business, but we do not want to seem dusty. We need to come across as both experienced and easy to deal with.","q.C.offers.label":"Products and services","q.C.offers.ask":"Which products or services does your business sell?","q.C.offers.help":"The list becomes the basis for which pages are needed. Start with the most important.","q.C.offers.example":"- New kitchens and kitchen renovation\n- Roof renovation and insulation\n- Replacing windows and doors","q.C.hero-offer.label":"What you most want to sell","q.C.hero-offer.ask":"If the website could only sell one thing, what should it be?","q.C.hero-offer.help":"What you most want to sell gets the most visible place, for example at the top of the home page.","q.C.hero-offer.example":"Kitchen renovation. That is where we earn the most, and it is what we do best.","q.C.pricing.label":"Prices","q.C.pricing.ask":"How do you set your prices, and should they be shown on the website?","q.C.pricing.help":"Some customers like to know the price level before they get in touch. It is also fine to say that prices should not be shown.","q.C.pricing.example":"We always give a fixed quote after a visit. We would like to show examples, such as a typical kitchen starting at 12,000 euros, but not a price list.","q.C.catalogue-size.label":"Number of products and services","q.C.catalogue-size.ask":"How many products or services should be shown on the website?","q.C.catalogue-size.help":"The number decides whether each one can have its own page or whether a catalogue with filters and search is needed.","q.C.catalogue-size.example":"About six services and no products.","choice.C.catalogue-size.under-10":"Fewer than 10","choice.C.catalogue-size.10-100":"Between 10 and 100","choice.C.catalogue-size.over-100":"More than 100","choice.C.catalogue-size.none":"None to show individually","q.C.change-rate.label":"How often your range changes","q.C.change-rate.ask":"How often do your range or your prices change?","q.C.change-rate.help":"The answer decides how easy it needs to be to update products and prices yourself.","q.C.change-rate.example":"A couple of times a year, when we add a service or adjust prices.","choice.C.change-rate.rarely":"Rarely, a few times a year or less","choice.C.change-rate.monthly":"About once a month","choice.C.change-rate.weekly":"About once a week","choice.C.change-rate.daily":"Every day","q.C.seasonality.label":"Seasons and busy periods","q.C.seasonality.ask":"Does your business have seasons or periods when it is busier or quieter?","q.C.seasonality.help":"Seasons can affect when the website should be ready and what it highlights at different times of year.","q.C.seasonality.example":"Busiest from March to October. In winter we mostly do kitchens and indoor work.","q.C.proof.label":"Reviews and other proof of good work","q.C.proof.ask":"What can show new customers that they can trust your business, such as reviews, references, certifications or figures?","q.C.proof.help":"New customers do not know the business yet, so concrete proof from others makes it easier for them to get in touch.","q.C.proof.example":"- 4.8 out of 5 stars from 140 reviews on a review site\n- Member of a guarantee scheme for tradespeople\n- Photos and quotes from 12 finished kitchens","q.C.advantage.label":"Why customers choose you","q.C.advantage.ask":"Why do customers choose you over others?","q.C.advantage.help":"This is often what should stand out most clearly on the website. Think about what customers say when they praise you.","q.C.advantage.example":"We keep the agreements we make, and customers have one contact person from start to finish. Many tell us they chose us because we were the only ones who called back the same day.","q.C.fulfilment.label":"From order to delivery","q.C.fulfilment.ask":"What happens from the moment a customer orders until the job is done or the item is delivered?","q.C.fulfilment.help":"Once the process is described, the website can explain to customers what happens and when.","q.C.fulfilment.example":"A free visit and measurement, a fixed quote within a week, a start two to six weeks later and a walk-through with the customer when we finish.","q.D.segments.label":"Customer groups","q.D.segments.ask":"Which customer groups is the website mainly for?","q.D.segments.help":"When the customer groups are clear, texts and pages can speak directly to them. Start with the most important.","q.D.segments.example":"- Families in the Millbrook area who want to renovate a kitchen or bathroom\n- Older homeowners who need a new roof or new windows\n- Small housing associations with smaller jobs","q.D.jobs.label":"What customers want to get done","q.D.jobs.ask":"What are customers trying to get done when they come to the website?","q.D.jobs.help":"A website works best when it helps people with what they actually came for.","q.D.jobs.example":"- Find out whether we do the kind of job they have\n- Get an idea of price and waiting time\n- See examples of work we have done","q.D.questions.label":"Customers' questions","q.D.questions.ask":"Which questions do you hear most often from customers before they choose you?","q.D.questions.help":"The questions you hear again and again are often the ones the website should answer. Three to five is a good start.","q.D.questions.example":"- Roughly what does a new kitchen cost?\n- How long is the wait before work can start?\n- Who cleans up afterwards?","q.D.objections.label":"What makes customers hesitate","q.D.objections.ask":"What makes some customers hesitate or choose someone else?","q.D.objections.help":"When the doubts are known, the website can answer them before they get in the way.","q.D.objections.example":"- Worry that the price will go up along the way\n- Concern about noise and dust in the home\n- Thinking we only take on large jobs","q.D.channels.label":"Where customers find you","q.D.channels.ask":"How do new customers usually find you today?","q.D.channels.help":"This shows where people come from when they visit the website, and what they already know.","q.D.channels.example":"Most are recommended by previous customers, and some search online for a carpenter in Millbrook.","choice.D.channels.search":"Searching online","choice.D.channels.social":"Social media","choice.D.channels.referral":"Recommendations from others","choice.D.channels.ads":"Advertising","choice.D.channels.email":"Newsletters and email","choice.D.channels.offline":"Offline, such as signs and trade fairs","choice.D.channels.partners":"Business partners","choice.D.channels.other":"Other","q.D.devices.label":"Phone or computer","q.D.devices.ask":"Do you think customers mostly visit the website on a phone or on a computer?","q.D.devices.help":"An educated guess is fine. If you have visitor statistics, they can give the answer.","q.D.devices.example":"Mostly on phones, we think, especially in the evening.","choice.D.devices.mobile":"Mostly on phones","choice.D.devices.desktop":"Mostly on computers","choice.D.devices.mixed":"Both","choice.D.devices.unknown":"Not sure","q.D.languages.label":"Website languages","q.D.languages.ask":"Which languages should the website be available in?","q.D.languages.help":"Each extra language means more texts to write and keep up to date, so it is good to know from the start.","q.D.languages.example":"English only.","choice.D.languages.da":"Danish","choice.D.languages.en":"English","choice.D.languages.de":"German","choice.D.languages.sv":"Swedish","choice.D.languages.no":"Norwegian","choice.D.languages.other":"Other","q.D.access.label":"Special care for your customers","q.D.access.ask":"Is there anything about your customers the website should take special care of, such as age, eyesight or how used they are to computers?","q.D.access.help":"The answer affects things like text size, wording and how simple the website needs to be to use.","q.D.access.example":"Many of our customers are over 60. They should be able to read the text without zooming in and find the phone number straight away.","q.D.action.label":"What visitors should do","q.D.action.ask":"What is the most important thing a visitor should do on the website, for example call, write or book?","q.D.action.help":"When the action is clear, each page can be built to lead there. Start with the most important.","q.D.action.example":"- Book a free visit\n- Call us\n- Send photos of the job through a form","q.D.customer-voice.label":"Customers' own words","q.D.customer-voice.ask":"How do customers themselves describe their problem or what they need?","q.D.customer-voice.help":"Customers' own words make the texts easier to understand and the website easier to find when people search online.","q.D.customer-voice.example":"They rarely say kitchen renovation. They say the kitchen is worn out, the drawers stick, or they want more room to cook together.","q.E.competitors.label":"Competitors","q.E.competitors.ask":"Who are your main competitors? Feel free to add a link to their website and a sentence about what they do well or badly.","q.E.competitors.help":"Competitors show what customers compare you with and where there is room to stand out. Three is a good start.","q.E.competitors.example":"- https://www.example.com | Large firm with low prices, but long waiting times\n- https://www.example.org | Attractive website with lots of photos of finished kitchens\n- https://www.example.net | Very similar to us, but hard to find online","q.E.gap.label":"What customers miss elsewhere","q.E.gap.ask":"What do customers miss from your competitors that you can give them?","q.E.gap.help":"What no one else offers or says clearly can become the strongest message on the website.","q.E.gap.example":"None of the others show price examples or explain how a renovation goes from day to day. Customers ask about that all the time.","q.E.like.label":"Websites you like","q.E.like.ask":"Which websites do you like, including ones from completely different industries? Add the link and a sentence about what you notice or how they make you feel.","q.E.like.help":"You do not need to explain it in technical terms. There are no wrong answers, and a gut feeling is just as useful as a detailed reason.","q.E.like.example":"- https://www.example.com | Calm and airy, it makes me want to stay and look around\n- https://www.example.org | Large photos of real people, it feels honest\n- https://www.example.net | The phone number is easy to find, and the texts are short","q.E.dislike.label":"Websites you dislike","q.E.dislike.ask":"Which websites do you dislike? Add the link and a sentence about what you notice or how they make you feel.","q.E.dislike.help":"What you dislike says as much as what you like. There are no wrong answers.","q.E.dislike.example":"- https://www.example.com | Too many offers and pop-ups, it stresses me out\n- https://www.example.org | Looks good, but I cannot work out what they actually do","q.E.feel.label":"How the website should feel","q.E.feel.ask":"How should people feel when they visit the website? Try to describe it in five words.","q.E.feel.help":"There are no wrong answers. Examples could be safe, calm, warm, simple, professional, playful, inspired or curious.","q.E.feel.example":"- Safe\n- Welcome\n- Calm\n- Inspired\n- Ready to call","q.E.not-feel.label":"How the website must not feel","q.E.not-feel.ask":"How should people not feel when they visit the website?","q.E.not-feel.help":"There are no wrong answers. Examples could be pressured, confused, overwhelmed, uncertain or tricked.","q.E.not-feel.example":"- Pressured to buy\n- Confused\n- Unsure about the price","q.E.imagery.label":"Images and video","q.E.imagery.ask":"What kinds of images do you like best on a website like yours?","q.E.imagery.help":"Choose what feels right to you. There are no wrong answers, and you can choose more than one.","q.E.imagery.example":"Photos of our people at work and of finished kitchens. Perhaps a short video of a kitchen being built.","choice.E.imagery.photos-people":"Photos of people","choice.E.imagery.photos-product":"Photos of products","choice.E.imagery.photos-place":"Photos of places and surroundings","choice.E.imagery.illustration":"Drawings and illustrations","choice.E.imagery.abstract":"Patterns, shapes and areas of colour","choice.E.imagery.video":"Video","choice.E.imagery.none":"No images or very few","q.E.density.label":"How much on each page","q.E.density.ask":"Do you prefer websites with plenty of space and a few things at a time, or with lots of information gathered together?","q.E.density.help":"Think of the websites you use yourself and enjoy. There are no wrong answers.","q.E.density.example":"Calm with plenty of space. Customers should not drown in text.","choice.E.density.calm":"Calm with plenty of space","choice.E.density.balanced":"Somewhere in between","choice.E.density.dense":"Lots of information together","q.E.design-musts.label":"Other wishes for the look","q.E.design-musts.ask":"Is there anything else you want or want to avoid when it comes to how the website looks?","q.E.design-musts.help":"It could be small things you have noticed elsewhere. There are no wrong answers, and you do not need to use technical terms.","q.E.design-musts.example":"The phone number should be visible at all times. I do not like text that slowly appears as you scroll down.","q.F.existing-content.label":"Content you already have","q.F.existing-content.ask":"What content do you already have that could be used on the new website?","q.F.existing-content.help":"What already exists saves time and money. It does not need to be finished or perfect.","q.F.existing-content.example":"Texts from the old website, quite a few photos of finished jobs and some quotes from customers.","choice.F.existing-content.texts":"Texts","choice.F.existing-content.photos":"Photos","choice.F.existing-content.video":"Video","choice.F.existing-content.testimonials":"Quotes from customers","choice.F.existing-content.documents":"Documents, such as brochures or price lists","choice.F.existing-content.none":"Nothing yet","q.F.photos.label":"Photos","q.F.photos.ask":"Do you have good photos that can be used on the website?","q.F.photos.help":"Photos make a big difference to how the website feels. There are no wrong answers, and it is completely normal to have photos of mixed quality.","q.F.photos.example":"We have lots of phone photos of our work and a few professional photos of the team from last year.","choice.F.photos.professional":"Yes, professional photos","choice.F.photos.some":"Some, but of mixed quality","choice.F.photos.none":"No, no usable photos","choice.F.photos.unknown":"Not sure","q.F.copywriter.label":"Who writes the texts","q.F.copywriter.ask":"Who will write the texts for the new website?","q.F.copywriter.help":"Texts often take longer than expected, so it helps to agree early on who is responsible for them.","q.F.copywriter.example":"We will write drafts ourselves, but we would like help making them shorter and better.","choice.F.copywriter.client":"You or someone in your business","choice.F.copywriter.team":"The team building the website","choice.F.copywriter.mixed":"A mix of both","choice.F.copywriter.undecided":"Not decided yet","q.F.volume.label":"Amount of content","q.F.volume.ask":"How much content do you expect, for example the number of pages, articles or photos?","q.F.volume.help":"A rough estimate is enough. It helps to judge how long it will take to create the content and put it in place.","q.F.volume.example":"About 15 pages, 20 examples of jobs with photos and a few articles a year.","q.F.migration.label":"Content from the old website","q.F.migration.ask":"What should be moved from your current website, and what can be deleted?","q.F.migration.help":"Moving content takes time, and the old addresses can matter for people still being able to find you online. Write what you know and leave the rest for later.","q.F.migration.example":"All the job examples and the page about roof renovation should come along. The news items from before 2020 can be deleted.","q.F.rights.label":"Rights to photos, fonts and texts","q.F.rights.ask":"Who owns the photos, fonts and texts you want to use, or do you have permission to use them online?","q.F.rights.help":"Photos and fonts found online often cannot be used without a licence, which is a permission that may cost money. It is easier to clarify this now than to replace them later.","q.F.rights.example":"We took the photos of the jobs ourselves. The team photos were taken by a photographer, and we are allowed to use them on the website. We do not know whether we have a licence for the lettering in the logo.","q.F.sensitive.label":"Sensitive content","q.F.sensitive.ask":"Is there any content that is sensitive or may only be shown to certain people?","q.F.sensitive.help":"It could be photos from customers' homes, internal prices or information about employees. That way it can be protected or left out from the start.","q.F.sensitive.example":"Photos from customers' homes may only be shown when the customer has agreed, and without house numbers or names.","q.G.pages.label":"Pages on the website","q.G.pages.ask":"Which pages do you imagine the website should have?","q.G.pages.help":"A first suggestion is enough. The list will be adjusted along the way.","q.G.pages.example":"- Home page\n- A page for each service\n- Contact and booking a visit","q.G.features.label":"Features","q.G.features.ask":"Which features should the website have, for example a contact form, booking or an online shop?","q.G.features.help":"Features affect both price and time. Choose what should be included from the start, and add any later wishes in a note.","q.G.features.example":"A contact form where customers can send photos, a gallery of our work and a map of the area we cover.","choice.G.features.contact-form":"Contact form","choice.G.features.booking":"Booking appointments","choice.G.features.shop":"Online shop","choice.G.features.search":"Search","choice.G.features.blog":"Blog or news","choice.G.features.members":"Login for customers or members","choice.G.features.multilingual":"Several languages","choice.G.features.calculator":"Price calculator or other calculator","choice.G.features.map":"Map","choice.G.features.newsletter":"Newsletter sign-up","choice.G.features.gallery":"Gallery","choice.G.features.other":"Other","q.G.integrations.label":"Systems the website should connect to","q.G.integrations.ask":"Are there other systems the website should connect to, such as a calendar, accounting, a newsletter or customer records?","q.G.integrations.help":"Connections to other systems often take extra time, so it is good to know about them early. The name of the system is enough.","q.G.integrations.example":"- Our calendar for visits\n- The system we send quotes and invoices from\n- Our social media page","q.G.out-of-scope.label":"What is not included this time","q.G.out-of-scope.ask":"Is there anything that should deliberately be left out this time?","q.G.out-of-scope.help":"A clear limit makes it easier to stay on time and on budget. Anything listed here can easily be added later.","q.G.out-of-scope.example":"- Online shop\n- A Spanish version\n- Login for customers","q.G.priorities.label":"What matters most if choices must be made","q.G.priorities.ask":"If time or budget gets tight, what is most important to include?","q.G.priorities.help":"A list in order of priority makes it easier to make good choices along the way without having to ask you every time.","q.G.priorities.example":"- Booking a visit must be easy\n- Good photos of our work\n- The pages for each service","q.G.multilingual.label":"Content in several languages","q.G.multilingual.ask":"If the website will be in several languages, should all languages have the same content, or should some of it differ?","q.G.multilingual.help":"The same content in every language is the simplest. Different content gives more freedom, but also more to keep up to date.","q.G.multilingual.example":"If we add a Spanish version one day, it should have the same content as the English one.","choice.G.multilingual.same-structure":"Same content in all languages","choice.G.multilingual.separate-content":"Different content for each language","choice.G.multilingual.unsure":"Not sure","q.G.content-types.label":"Types of content","q.G.content-types.ask":"Is there content that repeats in the same form many times, such as jobs, employees, events or products?","q.G.content-types.help":"Repeating content can get a fixed template. That makes it easier to add new items and keep them consistent.","q.G.content-types.example":"- Job examples with photos, location and type of work\n- Employees with a photo and their area of expertise","q.H.editing-needs.label":"How much you want to change yourself","q.H.editing-needs.ask":"How much should you or your colleagues be able to change on the website once it is live?","q.H.editing-needs.help":"The answer decides how easy it needs to be to edit the content and which solution fits best.","q.H.editing-needs.example":"We would like to add new jobs and change our opening hours ourselves a couple of times a month.","choice.H.editing-needs.nobody":"Nothing, others handle it","choice.H.editing-needs.occasional":"Small changes now and then","choice.H.editing-needs.regular":"Regular updates, such as news or jobs","choice.H.editing-needs.restructure":"Also new pages and changes to the structure","q.H.who-edits.label":"Who will update the website","q.H.who-edits.ask":"Who will update the website, and how used are they to this kind of work?","q.H.who-edits.help":"It helps to know whether it is one person or several, and how much help they need. That way the solution can be made simple enough.","q.H.who-edits.example":"Daniel in the office. He has updated the old website, but finds it awkward.","q.H.approval.label":"Approving changes","q.H.approval.ask":"Does anyone need to approve changes before they appear on the website?","q.H.approval.help":"If approval is needed, a step can be added where changes are checked first.","q.H.approval.example":"No, Daniel can publish things himself. Price changes must be approved by Sarah, though.","q.H.roles.label":"Who may do what","q.H.roles.ask":"Should different people have different access, for example some who may only write drafts?","q.H.roles.help":"This is only relevant if several people will work on the website. Otherwise you can skip the question.","q.H.roles.example":"- Sarah: can do everything\n- Daniel: can edit texts and add jobs\n- Apprentices: can only add photos","q.H.preview.label":"Seeing changes before they go live","q.H.preview.ask":"Is it important to see how a change looks before it becomes visible to everyone?","q.H.preview.help":"A preview gives peace of mind, especially if several people edit the content.","q.H.preview.example":"Yes, it would make Daniel more confident about making changes himself.","choice.H.preview.yes":"Yes","choice.H.preview.no":"No","choice.H.preview.unsure":"Not sure","q.H.maintenance.label":"Maintenance","q.H.maintenance.ask":"Who will make sure the website is kept up to date and secure once it is finished?","q.H.maintenance.help":"A website needs technical updates and care, a bit like a car needs servicing. It is good to agree from the start who will do it.","q.H.maintenance.example":"We would like a fixed agreement with the team building the website.","choice.H.maintenance.client":"You or someone in your business","choice.H.maintenance.team":"The team building the website","choice.H.maintenance.agency":"Another agency or a freelancer","choice.H.maintenance.none":"No fixed arrangement","choice.H.maintenance.undecided":"Not decided yet","q.I.domain.label":"Domain name","q.I.domain.ask":"Which domain name should the website use, and who has access to manage it?","q.I.domain.help":"The domain name is the website's address, the part that comes after www. Without access to the domain the website can neither be moved nor go live, so it is good to know who owns it and has the login.","q.I.domain.example":"elliscarpentry.com. The domain is registered in Sarah's name, but our old web agency has the login.","q.I.dns-contact.label":"Who can change the domain settings","q.I.dns-contact.ask":"Who can change the technical settings for the domain if needed?","q.I.dns-contact.help":"When the website goes live, the domain's settings, known as DNS settings, often need to be changed. It goes faster when it is clear who can do it.","q.I.dns-contact.example":"Kevin at the company that looks after our email and computers.","q.I.hosting.label":"Hosting today","q.I.hosting.ask":"Which company runs your website today, and is there an agreement that ties you in?","q.I.hosting.help":"This is often called hosting, and an existing agreement can affect when a switch can happen. If there is none today, that is a fine answer too.","q.I.hosting.example":"It is hosted by our old web agency. The agreement runs until the end of June with three months' notice.","q.I.existing-stack.label":"Systems used today","q.I.existing-stack.ask":"Which system is your current website built with, and are there other systems that need to carry on?","q.I.existing-stack.help":"The answer shows what needs to be taken into account or moved. If you do not know the name, it is fine to skip this.","q.I.existing-stack.example":"WordPress, I think. We also use a booking system for visits that we would like to keep.","q.I.personal-data.label":"Personal data","q.I.personal-data.ask":"What information about people should the website collect, for example names, phone numbers, addresses or payments?","q.I.personal-data.help":"Data protection rules, also known as GDPR, decide how information about people must be protected and explained to them. That is why it helps to know from the start what the website will collect.","q.I.personal-data.example":"Name, phone number, address and the photos customers send through the contact form.","choice.I.personal-data.none":"None","choice.I.personal-data.contact-forms":"Contact forms, for example name and phone number","choice.I.personal-data.accounts":"User accounts with login","choice.I.personal-data.payments":"Payments","choice.I.personal-data.other":"Other","q.I.cookies-analytics.label":"Cookies and visitor statistics","q.I.cookies-analytics.ask":"Would you like to see statistics on how the website is used?","q.I.cookies-analytics.help":"Cookies are small files stored in the visitor's browser, often used for statistics and advertising. Many kinds require the visitor to agree first, but some simple statistics do not.","q.I.cookies-analytics.example":"Yes, but preferably without visitors having to click yes to cookies, if that is possible.","choice.I.cookies-analytics.none":"No statistics","choice.I.cookies-analytics.privacy-friendly":"Simple statistics that respect privacy","choice.I.cookies-analytics.standard":"Standard statistics with cookie consent","choice.I.cookies-analytics.undecided":"Not decided yet","q.I.legal-pages.label":"Legal pages","q.I.legal-pages.ask":"Which legal pages should the website have, for example a privacy policy or terms of sale?","q.I.legal-pages.help":"Which pages are required depends on what the website does. If you already have some of the texts, mention it in a note.","q.I.legal-pages.example":"A privacy policy and a cookie policy. We have neither today.","choice.I.legal-pages.privacy":"Privacy policy","choice.I.legal-pages.cookies":"Cookie policy","choice.I.legal-pages.terms":"Terms of sale","choice.I.legal-pages.imprint":"Company details, such as registration number and address","choice.I.legal-pages.accessibility-statement":"Accessibility statement","choice.I.legal-pages.none":"None","choice.I.legal-pages.unsure":"Not sure","q.I.regulation.label":"Special rules in your industry","q.I.regulation.ask":"Are there rules in your industry that the website must follow, for example about advertising, prices or guarantees?","q.I.regulation.help":"Some industries have special requirements for what may be said and how. If you do not know of any, that is a fine answer too.","q.I.regulation.example":"We must show prices including VAT to private customers and describe our guarantee scheme correctly.","q.I.accessibility.label":"Accessibility","q.I.accessibility.ask":"Do you have particular requirements for the website to be usable by everyone, including people with impaired sight, hearing or mobility?","q.I.accessibility.help":"Accessibility means that everyone can use the website, also with a screen reader or only a keyboard. The usual standard is a good starting point, and public bodies and some businesses have legal requirements.","q.I.accessibility.example":"The usual standard is fine for us.","choice.I.accessibility.aa-default":"The usual standard (recommended)","choice.I.accessibility.public-sector":"Public organisation with legal requirements","choice.I.accessibility.higher":"Higher requirements than usual","choice.I.accessibility.unsure":"Not sure","q.I.seo.label":"Showing up in search engines","q.I.seo.ask":"What should people search for online to find you?","q.I.seo.help":"Making a website easy to find in Google and other search engines is called SEO, and your answer is the starting point for it. Include the words and places customers use when they search.","q.I.seo.example":"Carpenter Millbrook, kitchen renovation Millbrook and new roof. We mainly want to be found by people in and around Millbrook.","q.I.performance.label":"Speed","q.I.performance.ask":"Is there anything that means the website needs to be extra fast, for example customers with a poor connection?","q.I.performance.help":"All websites should be fast. The answer shows whether there is a reason to do more.","q.I.performance.example":"Many customers look at the site on their phones in the countryside, where the connection can be poor.","q.I.browsers.label":"Devices and browsers","q.I.browsers.ask":"Are there particular browsers, phones or computers the website must work especially well on?","q.I.browsers.help":"The website will work in the common browsers. This only matters if your customers use something unusual, such as old computers.","q.I.browsers.example":"Nothing special. Some of our older customers use an old tablet.","q.I.data-location.label":"Where data is stored","q.I.data-location.ask":"Do you have requirements for where data from the website may be stored, for example only in the EU?","q.I.data-location.help":"Some businesses want or are required to keep their data in the EU. If you have no requirement, that is a fine answer too.","q.I.data-location.example":"Preferably in the EU.","choice.I.data-location.eu":"Only in the EU","choice.I.data-location.any":"No requirements","choice.I.data-location.specific":"A particular country or place","q.I.email.label":"Email","q.I.email.ask":"How is your email set up today, and is it connected to the domain?","q.I.email.help":"Email and website often share a domain. Knowing where the email is hosted avoids it stopping working when the website moves.","q.I.email.example":"We have email on our own domain with the same company that hosts the website. It just needs to keep working.","q.J.contact.label":"Main contact","q.J.contact.ask":"Who is the day-to-day contact for the project, and what is the easiest way to reach them?","q.J.contact.help":"One fixed contact person makes it easier to get quick answers and avoid misunderstandings.","q.J.contact.example":"Daniel Price in the office. Best by phone between 8 and 12, otherwise by email.","q.J.availability.label":"Time for the project","q.J.availability.ask":"When do you have time for the project, and are there periods when you cannot respond, such as holidays?","q.J.availability.help":"Projects move fastest when answers and feedback arrive on time. Holidays and busy periods are good to know about in advance.","q.J.availability.example":"A couple of hours a week. Sarah is on holiday for the last two weeks of February.","q.J.feedback.label":"How you give feedback","q.J.feedback.ask":"How do you prefer to give feedback, for example in meetings, by email or by writing directly on the drafts?","q.J.feedback.help":"When the format is agreed, feedback ends up in one place and is easier to act on.","q.J.feedback.example":"A short meeting every other week, and otherwise collected comments by email from Daniel.","q.J.accounts.label":"Access to accounts","q.J.accounts.ask":"Which accounts and logins will access be needed for at some point, for example the domain, hosting, statistics or social media?","q.J.accounts.help":"List only which accounts exist and who has access, never the passwords themselves. Passwords are shared in a secure way later.","q.J.accounts.example":"Domain and hosting with our old web agency, our social media profile with Daniel, and no visitor statistics today.","q.J.concerns.label":"Concerns","q.J.concerns.ask":"Is there anything about the project you are worried about or have had bad experiences with before?","q.J.concerns.help":"Concerns raised early are much easier to deal with.","q.J.concerns.example":"Last time it dragged on for six months, and we ended up with a website we could not update ourselves.","q.J.anything-else.label":"Anything else","q.J.anything-else.ask":"Is there anything else worth knowing that has not been asked about?","q.J.anything-else.help":"Anything that can help is welcome, including small things.","q.J.anything-else.example":"We turn 30 in 2028 and would like to celebrate that on the website.","status.complete":"Answe <script>
// Runs before the form's own script and keeps one thing working even when the form cannot start: the
// button that removes the data the form saved in this browser. It is plain old JavaScript on purpose.
(function () {
  var failed = document.getElementById('emfc-failed');
  var key = '';
  try {
    key = JSON.parse(document.getElementById('emfc-config').textContent).storageKey;
  } catch (error) {
    key = '';
  }

  function discard() {
    try {
      if (key) {
        window.localStorage.removeItem(key);
        window.localStorage.removeItem(key + '.broken');
      }
    } catch (error) {
      // There is no storage, so there is nothing to remove.
    }
    window.location.reload();
  }

  var buttons = document.getElementsByClassName('emfc-discard');
  for (var index = 0; index < buttons.length; index += 1) buttons[index].addEventListener('click', discard);

  window.addEventListener('load', function () {
    if (failed && !(window.__emfc && window.__emfc.app)) failed.hidden = false;
  });
})();
</script>
<script>
(function () {
'use strict';

// ---- util.mjs ----
// Small helpers shared by the pure modules (util, i18n-core, rules, parse, render, validate).
// This file must stay pure: no node: imports, no process, no Buffer. The static form inlines it.

// A pack that cannot be read: the key is an i18n key and the params fill its placeholders.
class PackError extends Error {
  constructor(key, params = {}) {
    super(key);
    this.name = 'PackError';
    this.key = key;
    this.params = params;
  }
}

// Bad input for answer.mjs. `problems` is a list of { key, params } with i18n keys.
class InputError extends Error {
  constructor(problems) {
    super(problems.map((problem) => problem.key).join(', '));
    this.name = 'InputError';
    this.problems = problems;
  }
}

function isPlainObject(value) {
  return typeof value === 'object' && value !== null && !Array.isArray(value);
}

function uniq(list) {
  return [...new Set(list)];
}

// U+2028 and U+2029 end a line in JavaScript patterns (a dot does not match them), so they are
// line breaks here too.
const LINE_SEPARATORS = [String.fromCharCode(0x2028), String.fromCharCode(0x2029)];

// Removes a byte order mark and turns CRLF, CR, U+2028 and U+2029 into LF.
function normalizeNewlines(text) {
  let result = String(text ?? '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  for (const separator of LINE_SEPARATORS) result = result.split(separator).join('\n');
  return result;
}

function splitLines(text) {
  return normalizeNewlines(text).split('\n');
}

// Canonical free text: LF only, no trailing spaces on any line, no blank lines at the ends.
function normalizeText(text) {
  return splitLines(text)
    .map((line) => line.trimEnd())
    .join('\n')
    .trim();
}

// Collapses every run of white space (including line breaks) into one space.
function oneLine(text) {
  return String(text ?? '').replace(/\s+/g, ' ').trim();
}

const LINE_BREAK_RUN = new RegExp(`[\\r\\n${String.fromCharCode(0x2028, 0x2029)}]+`, 'g');

// Removes spaces and tabs at both ends (and nothing else: other white space is text).
function trimSpaces(text) {
  const value = String(text ?? '');
  let start = 0;
  let end = value.length;
  while (start < end && (value[start] === ' ' || value[start] === '\t')) start += 1;
  while (end > start && (value[end - 1] === ' ' || value[end - 1] === '\t')) end -= 1;
  return value.slice(start, end);
}

// Stored text on one line: line breaks become one space; every other character, including
// other kinds of white space, stays as it is.
function joinLines(text) {
  return trimSpaces(String(text ?? '').replace(LINE_BREAK_RUN, ' '));
}

// A marker token has no spaces and cannot close the marker comment. Applying it twice gives the
// same token as applying it once.
function toToken(text) {
  return oneLine(text).replace(/[<>"]/g, '').replace(/ /g, '-').replace(/-{2,}/g, '-');
}

function slugify(text) {
  const slug = oneLine(text)
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-');
  let start = 0;
  let end = slug.length;
  while (start < end && slug[start] === '-') start += 1;
  while (end > start && slug[end - 1] === '-') end -= 1;
  return slug.slice(start, end);
}

// Backslash-pipe is a literal pipe in table cells and in "text | note" list items.
function escapePipes(text) {
  return String(text ?? '').replace(/\|/g, '\\|');
}

// Splits at unescaped pipes and unescapes the parts. With maxParts, later pipes stay literal.
function splitPipes(text, maxParts = Infinity) {
  const parts = [];
  let current = '';
  for (let index = 0; index < text.length; index += 1) {
    const char = text[index];
    if (char === '\\' && text[index + 1] === '|') {
      current += '|';
      index += 1;
    } else if (char === '|' && parts.length < maxParts - 1) {
      parts.push(current);
      current = '';
    } else {
      current += char;
    }
  }
  parts.push(current);
  return parts;
}

// True for a real calendar date written as YYYY-MM-DD.
function isValidDate(value) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value ?? ''));
  if (!match) return false;
  const year = Number(match[1]);
  const month = Number(match[2]);
  const day = Number(match[3]);
  if (year < 1000) return false;
  const date = new Date(Date.UTC(year, month - 1, day));
  return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day;
}

function localDate(date = new Date()) {
  const pad = (number) => String(number).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function isoDateTime(date = new Date()) {
  return date.toISOString().replace(/\.\d{3}Z$/, 'Z');
}

// ---------------------------------------------------------------------------------------------
// Limits that keep a hostile pack from using unbounded time or memory

const MAX_LINE_CHARS = 20000;
const MAX_BODY_CHARS = 200 * 1024;
const MAX_TEXT_FILE_BYTES = 2 * 1024 * 1024;
const MAX_JSON_FILE_BYTES = 20 * 1024 * 1024;
const MAX_ASSET_BYTES = 500 * 1024 * 1024;
const MAX_ASSET_ROWS = 5000;
const MAX_ASSET_FILES = 50000;
const MAX_FLAGS_PER_KIND = 100;
const MAX_LISTED_ITEMS = 200;
const MAX_CELL_CHARS = 300;

// Cuts text at max characters and adds "...". A surrogate pair is never cut in two.
function truncateText(text, max) {
  const value = String(text ?? '');
  if (value.length <= max) return value;
  let end = max;
  const last = value.charCodeAt(end - 1);
  if (last >= 0xd800 && last <= 0xdbff) end -= 1;
  return `${value.slice(0, end)}...`;

// The files that belong to a pack, by their path from the pack root (forward slashes): anything
// with a hidden name (a dot first) or a temporary one (.tmp last) in its path does not.
// The manifest and the zip use this one rule.
function isPackFile(relativePath) {
  const segments = String(relativePath).replace(/\\/g, '/').split('/').filter((segment) => segment !== '');
  if (segments.length === 0) return false;
  return !segments.some((segment) => segment.startsWith('.') || segment.toLowerCase().endsWith('.tmp'));

// ---------------------------------------------------------------------------------------------
// Control and hidden characters

// Control codes that answer input refuses: C0 except tab, line feed and carriage return, DEL

const CONTROL_CHARACTER_RANGES = [[0, 8], [11, 12], [14, 31], [127, 159]];

// Characters that are refused in answer input, in respondent, recipient, notes, asset

// operators (U+2060-2064), the byte order mark U+FEFF anywhere, interlinear annotation marks
// (U+FFF9-FFFB) and the tag characters (U+E0000-E007F). [from, to] ranges of code points.

const HIDDEN_CHARACTER_RANGES = [
  [0x061c, 0x061c],
  [0x180e, 0x180e],
  [0x200b, 0x200b],
  [0x202a, 0x202e],
  [0x2060, 0x2064],
  [0x2066, 0x2069],
  [0xfeff, 0xfeff],
  [0xfff9, 0xfffb],
  [0xe0000, 0xe007f],

// Characters that are fine in stored text but are shown as <U+XXXX> when printed, because they
// are easy to confuse with nothing: the soft hyphen, ZWNJ, ZWJ, LRM, RLM, line and paragraph separators.
const PRINT_ONLY_RANGES = [[0xad, 0xad], [0x200c, 0x200f], [0x2028, 0x2029]];

function inRanges(code, ranges) {
  for (const [from, to] of ranges) {
    if (code >= from && code <= to) return true;
  }
  return false;
}

function isControlCode(code) {
  return inRanges(code, CONTROL_CHARACTER_RANGES);
}

function isHiddenCode(code) {
  return inRanges(code, HIDDEN_CHARACTER_RANGES);
}

// True when the text holds a control character that no answer should contain. Tab, line feed
// and carriage return are fine.
function hasControlCharacters(text) {
  for (const char of String(text ?? '')) {
    if (isControlCode(char.codePointAt(0))) return true;
  }
  return false;
}

// The one rule for text that people hand in: true when the text holds a control character (see
// CONTROL_CHARACTER_RANGES) or a hidden character (see HIDDEN_CHARACTER_RANGES). Tab, line feed
// and carriage return are allowed; a carriage return becomes a line break.
function hasHiddenCharacters(text) {
  for (const char of String(text ?? '')) {
    const code = char.codePointAt(0);
    if (isControlCode(code) || isHiddenCode(code)) return true;
  }
  return false;
}

function codeMarker(code) {
  return `<U+${code.toString(16).toUpperCase().padStart(4, '0')}>`;
}

// Text with every control character (also tab and line breaks) and every hidden character written
// as <U+XXXX>, so that it can be read and cannot do anything.
function showHiddenCharacters(text) {
  const parts = [];
  for (const char of String(text ?? '')) {
    const code = char.codePointAt(0);
    parts.push(code < 32 || isControlCode(code) || isHiddenCode(code) ? codeMarker(code) : char);
  }
  return parts.join('');
}

// True for a file name that the assets table can hold exactly: no control or hidden character,
// no backslash, and no space at either end. Other names, with any kind of white space or
// invisible joiner, are stored as they are.
function isStorableAssetName(name) {
  const value = String(name ?? '');
  if (value === '' || value.startsWith(' ') || value.endsWith(' ') || value.includes(String.fromCharCode(92))) return false;
  for (const char of value) {
    const code = char.codePointAt(0);
    if (code < 32 || isControlCode(code) || isHiddenCode(code)) return false;
  }
  return true;
}

// A file name for a message, with the characters that cannot be seen written as <U+XXXX>.
function describeAssetName(name) {
  let shown = showHiddenCharacters(name);
  if (shown.startsWith(' ')) shown = `${codeMarker(32)}${shown.slice(1)}`;
  if (shown.endsWith(' ')) shown = `${shown.slice(0, -1)}${codeMarker(32)}`;
  return shown;
}

// Characters that are shown as a marker when printed: the hidden ones and the confusable ones.
function isDisplaySpoofing(code) {
  return isHiddenCode(code) || inRanges(code, PRINT_ONLY_RANGES);
}

// Characters that can change what a terminal shows: all C0 except tab, DEL, C1, carriage return
// and the display spoofing characters above.
function isTerminalUnsafe(code, keepLineBreaks) {
  if (code === 10) return !keepLineBreaks;
  if (code < 32) return code !== 9;
  if (code >= 127 && code <= 159) return true;
  return isDisplaySpoofing(code);
}

// Safe to print: every unsafe character is replaced by a visible stand-in (a control picture for
// C0 and DEL, the replacement character for the rest). With keepLineBreaks, line feeds stay.
// This is for printing only; stored text is never changed with it.
function sanitizeForTerminal(text, options = {}) {
  const keepLineBreaks = options.keepLineBreaks === true;
  const parts = [];
  for (const char of String(text ?? '')) {
    const code = char.codePointAt(0);
    if (!isTerminalUnsafe(code, keepLineBreaks)) parts.push(char);
    else if (code < 32) parts.push(String.fromCodePoint(0x2400 + code));
    else if (code === 127) parts.push(String.fromCodePoint(0x2421));
    else parts.push(String.fromCodePoint(0xfffd));
  }
  return parts.join('');
}

function unicodeEscape(code) {
  if (code <= 0xffff) return `${String.fromCharCode(92)}u${code.toString(16).padStart(4, '0')}`;
  const offset = code - 0x10000;
  return unicodeEscape(0xd800 + (offset >> 10)) + unicodeEscape(0xdc00 + (offset & 0x3ff));
}

// JSON text for printing: indented, with DEL, C1 and the display spoofing characters written as
// \\uXXXX escapes, so the output is safe to show and parses to the same value.
function stringifyJson(value) {
  const parts = [];
  for (const char of JSON.stringify(value, null, 2)) {
    const code = char.codePointAt(0);
    parts.push(code >= 127 && (code <= 159 || isDisplaySpoofing(code)) ? unicodeEscape(code) : char);
  }
  return parts.join('');
}

// ---------------------------------------------------------------------------------------------
// Markup in free text

// Free text is stored so that no markdown preview can see a comment or a tag in it: `<` before a
// letter, "/", "!" or "?" and the end of a comment become entities. A literal entity in the
// original is protected by escaping its ampersand, so decodeMarkup(encodeMarkup(x)) is x.
function encodeMarkup(text) {
  return defuseMarkup(String(text ?? '').replace(/&(?=(?:lt|gt|amp);)/g, '&amp;'));
}

// Only the defusing, without touching ampersands. Safe to apply again to its own output.
function defuseMarkup(text) {
  return String(text ?? '')
    .replace(/<(?=[A-Za-z/!?])/g, '&lt;')
    .replace(/--!?>/g, (whole) => `${whole.slice(0, -1)}&gt;`);
}

// For one part of a list that is joined into a string (a person in the respondent line): every
// ampersand is escaped, so that a part can never end or fake an entity. decodeMarkup reverses it.
function encodeListPart(text) {
  return defuseMarkup(String(text ?? '').replace(/&/g, '&amp;'));
}

// The same for the name of a person, in which a comma is written as &#44; so that the first
// comma of "Name, Role" always separates the name from the role.
function encodeListName(text) {
  return encodeListPart(text).replace(/,/g, '&#44;');
}

function decodeListPart(text) {
  return String(text ?? '').replace(/&(lt|gt|amp|#44);/g, (whole, name) => {
    if (name === 'lt') return '<';
    if (name === 'gt') return '>';
    return name === 'amp' ? '&' : ',';
  });
}

// People in a respondent line are separated by a semicolon that does not end an entity.
const RESPONDENT_LINE_SEPARATOR = /(?<!&(?:lt|gt|amp|#44));/;

function decodeMarkup(text) {
  return String(text ?? '').replace(/&(lt|gt|amp);/g, (whole, name) => {
    if (name === 'lt') return '<';
    return name === 'gt' ? '>' : '&';
  });
}

// Minimal option parser for the scripts. `spec` maps an option name to 'string' or 'boolean'.
// Returns { values, positionals, problems }; problems are { key, params } with i18n keys.
function parseArgv(argv, spec) {
  const values = {};
  const positionals = [];
  const problems = [];
  for (let index = 0; index < argv.length; index += 1) {
    const arg = String(argv[index]);
    if (!arg.startsWith('--')) {
      positionals.push(arg);
      continue;
    }
    const equals = arg.indexOf('=');
    const name = equals === -1 ? arg.slice(2) : arg.slice(2, equals);
    const kind = Object.hasOwn(spec, name) ? spec[name] : undefined;
    if (!kind) {
      problems.push({ key: 'ui.check.err.unknownOption', params: { option: `--${name}` } });
    } else if (kind === 'boolean') {
      if (equals === -1) values[name] = true;
      else problems.push({ key: 'ui.check.err.unexpectedValue', params: { option: `--${name}` } });
    } else if (equals !== -1) {
      values[name] = arg.slice(equals + 1);
    } else if (index + 1 < argv.length && !String(argv[index + 1]).startsWith('--')) {
      values[name] = String(argv[index + 1]);
      index += 1;
    } else {
      problems.push({ key: 'ui.check.err.missingValue', params: { option: `--${name}` } });
    }
  }
  return { values, positionals, problems };
}

// ---- i18n-core.mjs ----
// The pure part of i18n: wrap a flat dictionary of "dotted.key": "text with {placeholders}".
// Loading the dictionary from disk is in i18n.mjs. This file must stay pure (no node: imports).

function makeI18n(dict, lang) {
  const entries = new Map(Object.entries(dict ?? {}));

  function has(key) {
    return entries.has(key);
  }

  // A missing key returns the key itself, so a gap is visible instead of fatal.
  // A placeholder without a value is left as written.
  function t(key, params) {
    const template = entries.get(key);
    if (typeof template !== 'string') return key;
    const values = params ?? {};
    return template.replace(/\{([A-Za-z0-9_]+)\}/g, (whole, name) =>
      Object.hasOwn(values, name) ? String(values[name]) : whole,
    );
  }

  function keys() {
    return [...entries.keys()];
  }

  return { lang, t, has, keys };
}

// ---- rules.mjs ----
// Schema rules and the one place that converts between structured input and markdown bodies
// (FORMAT.md sections 4.4 and 9). This file must stay pure: no node: imports, no process, no Buffer.


const ANSWER_STATUSES = ['complete', 'partial', 'tbd', 'missing'];

const LIST_TYPES = ['list', 'urllist', 'files'];
const CHOICE_TYPES = ['choice', 'multichoice'];
const LEVEL_ORDER = ['gate1', 'recommended', 'optional'];
// A dot does not match every line break, so the rest of a line is matched with [\s\S]*.
const BULLET_LINE = /^\s*(?:[-*+]|\d+[.)])(?:\s+([\s\S]*))?$/;
const CHOICE_LINE = /^\s*Choice:[ \t]*([\s\S]*)$/i;
const DATE_LINE = /^\s*Date:[ \t]*([\s\S]*)$/i;
const NOTE_LINE = /^\s*Note:[ \t]*([\s\S]*)$/i;
const CONTENT_FIELDS = ['text', 'items', 'choice', 'date', 'note'];
const KNOWN_FIELDS = ['id', 'status', 'owner', 'due', ...CONTENT_FIELDS];
const FIELDS_BY_TYPE = {
  text: ['text'],
  longtext: ['text'],
  list: ['items', 'text'],
  urllist: ['items', 'text'],
  files: ['items', 'text'],
  choice: ['choice', 'note'],
  multichoice: ['choice', 'note'],
  date: ['date', 'note'],
};

function isListType(type) {
  return LIST_TYPES.includes(type);
}

function isChoiceType(type) {
  return CHOICE_TYPES.includes(type);
}

// ---------------------------------------------------------------------------------------------
// Questions, levels and depth

// Every question in interview order (schema.moduleOrder), with its module id and file id added.
function questionsInOrder(schema) {
  const modulesById = new Map(schema.modules.map((entry) => [entry.id, entry]));
  const result = [];
  for (const moduleId of schema.moduleOrder) {
    const entry = modulesById.get(moduleId);
    if (!entry) continue;
    for (const question of entry.questions) result.push({ ...question, module: entry.id, file: entry.file });
  }
  return result;
}

function findQuestion(schema, id) {
  for (const entry of schema.modules) {
    const question = entry.questions.find((candidate) => candidate.id === id);
    if (question) return { ...question, module: entry.id, file: entry.file };
  }
  return null;
}

function inDepth(level, depth, schema) {
  return Object.hasOwn(schema.depths, depth) && schema.depths[depth].includes(level);
}

// The valid choice ids picked in an answer. Deferred and unanswered questions pick nothing.
function selectedChoices(schema, answersById, id) {
  const question = findQuestion(schema, id);
  const entry = answersById[id];
  if (!question || !entry || entry.status === 'tbd' || entry.status === 'missing') return [];
  const value = entry.value ?? parseBody(question, entry.body);
  const allowed = question.choices ?? [];
  return (value.choice ?? []).filter((choice) => allowed.includes(choice));
}

function isQuestionShown(question, answersById, schema) {
  const condition = question.showIf;
  if (!condition) return true;
  const selected = selectedChoices(schema, answersById, condition.id);
  if (selected.length === 0) return true;
  return selected.some((choice) => condition.in.includes(choice));
}

function requirementHolds(rule, answersById, schema) {
  const selected = selectedChoices(schema, answersById, rule.id);
  if (Array.isArray(rule.in)) return selected.some((choice) => rule.in.includes(choice));
  if (Array.isArray(rule.notIn)) {
    return selected.length > 0 && selected.every((choice) => !rule.notIn.includes(choice));
  }
  if (typeof rule.minSelected === 'number') return selected.length >= rule.minSelected;
  return false;
}

function strongerLevel(first, second) {
  const firstRank = LEVEL_ORDER.indexOf(first);
  const secondRank = LEVEL_ORDER.indexOf(second);
  if (secondRank === -1) return first;
  if (firstRank === -1) return second;
  return secondRank < firstRank ? second : first;
}

// 'gate1' | 'recommended' | 'optional' | 'skipped'
function effectiveLevel(question, answersById, schema) {
  if (!isQuestionShown(question, answersById, schema)) return 'skipped';
  const rule = question.requiredIf;
  if (rule && requirementHolds(rule, answersById, schema)) return strongerLevel(question.level, rule.level);
  return question.level;
}

// ---------------------------------------------------------------------------------------------
// Body text -> structured value

function parseListBody(text) {
  const raw = [];
  for (const line of splitLines(text)) {
    if (line.trim() === '') continue;
    const bullet = BULLET_LINE.exec(line);
    if (bullet) raw.push(bullet[1] ?? '');
    else if (/^\s/.test(line) && raw.length > 0) raw[raw.length - 1] += ` ${line.trim()}`;
    else raw.push(line.trim());
  }
  return raw.map(toListItem).filter((item) => item.text !== '');
}

function toListItem(raw) {
  const [text, note = ''] = splitPipes(raw, 2).map(joinLines);
  return { text, note };
}

// The first line matching tagPattern carries the tag; every other line is note text.
function parseTaggedBody(text, tagPattern) {
  let tagged = null;
  const noteLines = [];
  for (const line of splitLines(text)) {
    const tag = tagged === null ? tagPattern.exec(line) : null;
    if (tag) {
      tagged = tag[1].trim();
      continue;
    }
    const note = NOTE_LINE.exec(line);
    noteLines.push(note ? note[1] : line);
  }
  return { tagged, note: normalizeText(noteLines.join('\n')) };
}

function parseChoiceIds(tagged) {
  if (tagged === null) return [];
  return uniq(tagged.split(',').map((id) => id.trim().toLowerCase()).filter(Boolean));
}

// text/longtext -> { text }; list types -> { items: [{ text, note }] };
// choice types -> { choice: [ids], note }; date -> { date, note }
function parseBody(question, body) {
  const text = decodeMarkup(normalizeText(body));
  if (LIST_TYPES.includes(question.type)) return { items: parseListBody(text) };
  if (CHOICE_TYPES.includes(question.type)) {
    const { tagged, note } = parseTaggedBody(text, CHOICE_LINE);
    return { choice: parseChoiceIds(tagged), note };
  }
  if (question.type === 'date') {
    const { tagged, note } = parseTaggedBody(text, DATE_LINE);
    return { date: tagged ?? '', note };
  }
  return { text };
}

function emptyValue(question) {
  return parseBody(question, '');
}

// Characters in a text answer: trimmed, with bullet markers removed (used by rules.minChars).
function textLength(text) {
  const stripped = splitLines(text)
    .map((line) => line.replace(/^\s*(?:[-*+]|\d+[.)])\s+/, ''))
    .join('\n')
    .trim();
  return Array.from(stripped).length;
}

// ---------------------------------------------------------------------------------------------
// Structured input -> body text

function toInputItem(raw) {
  if (isPlainObject(raw)) return { text: joinLines(raw.text), note: joinLines(raw.note) };
  return { text: joinLines(raw), note: '' };
}

// Items come from `items`; a `text` with bullets is accepted when `items` is absent.
function inputItems(input) {
  if (Array.isArray(input.items)) return input.items.map(toInputItem).filter((item) => item.text !== '');
  if (typeof input.text === 'string') return parseListBody(normalizeText(input.text));
  return [];
}

function inputChoiceIds(input) {
  const raw = Array.isArray(input.choice) ? input.choice : [input.choice];
  return uniq(raw.filter((id) => id !== undefined && id !== null).map((id) => String(id).trim().toLowerCase()).filter(Boolean));
}

function noteLines(note) {
  const text = encodeMarkup(normalizeText(note));
  if (text === '') return [];
  return text.split('\n').map((line) => `Note: ${line}`.trimEnd());
}

function itemLine(item) {
  const note = item.note ? ` | ${escapePipes(encodeMarkup(item.note))}` : '';
  return `- ${escapePipes(encodeMarkup(item.text))}${note}`;
}

// input: { text } | { items: [{ text, note }] } | { choice: [ids], note } | { date, note }
function bodyFromInput(question, input) {
  if (LIST_TYPES.includes(question.type)) return inputItems(input).map(itemLine).join('\n');
  if (CHOICE_TYPES.includes(question.type)) {
    const ids = inputChoiceIds(input);
    const lines = ids.length > 0 ? [`Choice: ${ids.join(', ')}`] : [];
    return [...lines, ...noteLines(input.note)].join('\n');
  }
  if (question.type === 'date') {
    const date = String(input.date ?? '').trim();
    return [...(date ? [`Date: ${date}`] : []), ...noteLines(input.note)].join('\n');
  }
  return encodeMarkup(normalizeText(input.text));
}

// The body as the renderer writes it: canonical bullets, Choice and Note lines.
// Deferred and missing answers keep their text, which is a free note.
function canonicalBody(question, entry) {
  const body = normalizeText(entry.body);
  if (entry.status === 'complete' || entry.status === 'partial') {
    return bodyFromInput(question, parseBody(question, body));
  }
  return encodeMarkup(decodeMarkup(body));
}

// ---------------------------------------------------------------------------------------------
// Answer input for answer.mjs

function isAssetPath(text) {
  if (!text.startsWith('assets/') || text === 'assets/') return false;
  if (/[\\\0]/.test(text)) return false;
  return text.split('/').every((part) => part !== '' && part !== '.' && part !== '..');
}

function isRawItem(raw) {
  if (typeof raw === 'string') return true;
  if (!isPlainObject(raw) || typeof raw.text !== 'string') return false;
  if (raw.note !== undefined && typeof raw.note !== 'string') return false;
  return Object.keys(raw).every((key) => key === 'text' || key === 'note');
}

function listProblems(question, input, add) {
  const items = Array.isArray(input.items) ? input.items : null;
  if (input.items !== undefined && (!items || !items.every(isRawItem))) {
    add('ui.answer.err.badItems');
    return;
  }
  if (input.items === undefined && input.text !== undefined && typeof input.text !== 'string') {
    add('ui.answer.err.badText', { field: 'text' });
    return;
  }
  const parsed = inputItems(input);
  if (parsed.length === 0) add('ui.answer.err.noContent');
  if (question.type === 'files') {
    for (const item of parsed) if (!isAssetPath(item.text)) add('ui.answer.err.badFilePath', { path: item.text });
  }
}

function choiceProblems(question, input, add) {
  const raw = input.choice;
  if (raw !== undefined && typeof raw !== 'string' && !(Array.isArray(raw) && raw.every((id) => typeof id === 'string'))) {
    add('ui.answer.err.badChoiceField');
    return;
  }
  const ids = inputChoiceIds(input);
  if (ids.length === 0) add('ui.answer.err.noContent');
  for (const id of ids) {
    if (!(question.choices ?? []).includes(id)) add('ui.answer.err.badChoice', { choice: id });
  }
  if (question.type === 'choice' && ids.length > 1) add('ui.answer.err.singleChoiceOnly');
}

function dateProblems(input, add) {
  if (input.date === undefined) add('ui.answer.err.noContent');
  else if (typeof input.date !== 'string' || !isValidDate(input.date.trim())) {
    add('ui.answer.err.badDate', { value: String(input.date) });
  }
}

function textProblems(input, add) {
  if (input.text !== undefined && typeof input.text !== 'string') add('ui.answer.err.badText', { field: 'text' });
  else if (normalizeText(input.text) === '') add('ui.answer.err.noContent');
}

function contentProblems(question, input, add) {
  if (LIST_TYPES.includes(question.type)) listProblems(question, input, add);
  else if (CHOICE_TYPES.includes(question.type)) choiceProblems(question, input, add);
  else if (question.type === 'date') dateProblems(input, add);
  else textProblems(input, add);
  if (input.note !== undefined && typeof input.note !== 'string') add('ui.answer.err.badText', { field: 'note' });
}

// Every text the input carries, for the control character check.
function inputStrings(input) {
  const strings = [];
  const add = (value) => {
    if (typeof value === 'string') strings.push(value);
  };
  for (const key of ['id', 'owner', 'due', 'text', 'note', 'date']) add(input[key]);
  (Array.isArray(input.choice) ? input.choice : [input.choice]).forEach(add);
  for (const item of Array.isArray(input.items) ? input.items : []) {
    if (isPlainObject(item)) {
      add(item.text);
      add(item.note);
    } else {
      add(item);
    }
  }
  return strings;
}

function exceedsTextLimits(body) {
  return body.length > MAX_BODY_CHARS || splitLines(body).some((line) => line.length > MAX_LINE_CHARS);
}

// Returns a list of { key, params } problems (empty when the input is fine). The caller has
// already checked that the id exists.
function checkAnswerInput(question, input) {
  const problems = [];
  const add = (key, params = {}) => problems.push({ key, params: { id: question.id, ...params } });
  for (const field of Object.keys(input)) {
    if (!KNOWN_FIELDS.includes(field)) add('ui.answer.err.unknownField', { field });
  }
  if (!ANSWER_STATUSES.includes(input.status)) {
    add('ui.answer.err.badStatus', { status: String(input.status) });
    return problems;
  }
  if (input.owner !== undefined && typeof input.owner !== 'string') add('ui.answer.err.badOwner');
  if (input.due !== undefined && input.due !== '' && !isValidDate(input.due)) {
